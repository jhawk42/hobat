<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDash: Thread Mesh Network Dashboard</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/tofsjonas/sortable@latest/sortable.min.js"></script>

    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #5b6472;
        --line: #d6dde8;
        --accent: #0f766e;
        --accent-soft: #d6f5f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 40%, #eef8f5 100%);
        color: var(--text);
      }

      .page {
        padding: 12px 16px;
        max-width: 100%;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 16px;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      /* ── Controls bar ─────────────────────────────────────────── */

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
      }

      label {
        font-size: 14px;
        font-weight: 580;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      select {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font-size: 14px;
      }

      #dataset-select {
        min-width: 360px;
      }

      #node-filter,
      #link-filter,
      #diagnostic-filter {
        min-width: 220px;
      }

      select.filter-disabled {
        opacity: 0.45;
        pointer-events: none;
        cursor: not-allowed;
      }

      /* Hide options that are unavailable for the active dataset (Phase 6) */
      #node-filter option:disabled,
      #link-filter option:disabled,
      #diagnostic-filter option:disabled {
        display: none;
      }

      /* ── View toggle bar ──────────────────────────────────────── */

      .view-toggle-bar {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }

      .view-toggle-bar button {
        padding: 6px 20px;
        font-size: 14px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }

      .view-toggle-bar button:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .view-toggle-bar button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
        font-weight: 600;
      }

      /* ── Status line ──────────────────────────────────────────── */

      #status {
        margin: 0 0 8px 0;
        color: var(--muted);
        font-size: 13px;
      }

      /* ── Topology view ────────────────────────────────────────── */

      #view-topology {
        display: block;
      }

      #view-table {
        display: none;
      }

      .topology-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 12px;
        align-items: start;
      }

      #topology-view {
        width: 100%;
        height: 80vh;
        border: 1px solid lightgray;
        border-radius: 6px;
        background: var(--surface);
      }

      #details {
        margin-top: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fafafa;
        max-height: 80vh;
        overflow: auto;
      }

      #details h2 {
        margin: 0 0 8px 0;
        font-size: 15px;
      }

      #details-list {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
      }

      #details-list li {
        margin: 3px 0;
        word-break: break-word;
      }

      /* ── Table view ───────────────────────────────────────────── */

      .table-wrap {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        overflow: auto;
        max-height: calc(100vh - 180px);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        min-width: 0;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--accent-soft);
        color: #0f2d3a;
        border-bottom: 1px solid var(--line);
      }

      th,
      td {
        padding: 8px 10px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        text-align: left;
        font-size: 13px;
        line-height: 1.3;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: break-word;
      }

      tr:nth-child(even) td {
        background: #fcfdff;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      /* ── Responsive ───────────────────────────────────────────── */

      @media (max-width: 1000px) {
        .topology-layout {
          grid-template-columns: 1fr;
        }

        #details {
          max-height: none;
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 10px;
        }

        #dataset-select,
        #node-filter,
        #link-filter,
        #diagnostic-filter {
          min-width: 100%;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <h1>TDash: Thread Mesh Network Dashboard</h1>

      <!-- View toggle -->
      <div class="view-toggle-bar">
        <button id="btn-topology" class="active">Topology</button>
        <button id="btn-table">Table</button>
        <button id="btn-physics" class="active" title="Toggle vis.js physics simulation">Physics</button>
        <button id="btn-auto-zoom" class="active" title="Auto-fit topology in view">Auto Zoom</button>
        <button id="btn-animation" class="active" title="Toggle vis.js animation">Animation</button>
      </div>

      <!-- Controls bar -->
      <div class="controls">
        <label for="dataset-select">Dataset:</label>
        <select id="dataset-select">
          <!-- populated by JS from DATASET_REGISTRY -->
        </select>

        <label for="node-filter">Nodes:</label>
        <select id="node-filter">
          <option value="all">All Nodes</option>
          <option value="ftd-devices">Full Thread Devices (FTD)</option>
          <option value="mtd-devices">Minimal Thread Devices (MTD)</option>
          <option value="border-routers">Border Routers</option>
          <option value="main-routers">Routers</option>
          <option value="routers-with-children">Routers with Children Nodes</option>
          <option value="routers-without-children">Routers without Children Nodes</option>
        </select>

        <label for="link-filter">Links:</label>
        <select id="link-filter">
          <option value="default_links">Default: router,children, 321 _links, childTable</option>
          <option value="default_plus_router_neighbors">Default: +router neighbors</option>
          <option value="otbr_rest_api">OTBR restapi: route routeData, childTable</option>
          <option value="eve_enhanced_routes_children">Eve Enhanced: routes, children</option>
          <option value="eve_native_routes_children">Eve Native: routes, children</option>
          <option value="all_links">All Links (large)</option>
        </select>        
      </div>

      <div class="controls">
        <label for="diagnostic-filter">Diagnostics:</label>
        <select id="diagnostic-filter">
          <option value="all">All Rows</option>
          <option value="medium-total-errors-pct">Mac - Total Error Packets % (&gt;= 5%) - Medium</option>
          <option value="medium-total-errors-high">Mac - Total Error Packets (&gt;= 10%) - High</option>
          <option value="medium-discard-pct">Mac - Total Discard Packets % (&gt;= 15%) - High</option>
          <option value="medium-partition-changes">Mle - Partition Changes (&gt;= 2) - Medium</option>
          <option value="high-partition-changes">Mle - Partition Changes (&gt;= 5) - High</option>
          <option value="medium-parent-changes">Mle - Parent Changes (&gt;= 2) - Medium</option>
          <option value="high-parent-changes">Mle - Parent Changes (&gt;= 5) - High</option>
          <option value="router-neighbor-err-rate-frame-low">Router Neighbor - Err Rate Frame &gt;= 2% - Low</option>
          <option value="router-neighbor-err-rate-frame-medium">Router Neighbor - Err Rate Frame &gt;= 5% - Medium</option>
          <option value="router-neighbor-err-rate-frame-high">Router Neighbor - Err Rate Frame &gt;= 10% - High</option>
          <option value="router-neighbor-err-rate-msg-low">Router Neighbor - Err Rate Msg &gt;= 2% - Low</option>
          <option value="router-neighbor-err-rate-msg-medium">Router Neighbor - Err Rate Msg &gt;= 5% - Medium</option>
          <option value="router-neighbor-err-rate-msg-high">Router Neighbor - Err Rate Msg &gt;= 10% - High</option>
          <option value="router-neighbor-rss-very-low">Router Neighbor - RSS Ave Bad (&lt; -80 dBm)</option>
          <option value="router-neighbor-rss-low">Router Neighbor - RSS Ave Fair (-70 dBm To -80 dBm)</option>
          <option value="router-neighbor-rss-medium">Router Neighbor - RSS Ave Good (-60 dBm To -70 dBm)</option>
          <option value="router-neighbor-rss-high">Router Neighbor - RSS Ave Excellent (&gt; -60 dBm)</option>
        </select>        
      </div>

      <!-- Status line -->
      <div id="status">Select a dataset to load.</div>

      <!-- Topology view -->
      <div id="view-topology">
        <div class="topology-layout">
          <div id="topology-view"></div>
          <div id="details">
            <h2>Node Details</h2>
            <ul id="details-list">
              <li>Click a node to view its properties.</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Table view -->
      <div id="view-table">
        <div class="table-wrap">
          <table id="data-table" class="sortable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // ── Section 2: Dataset Registry ───────────────────────────────────────────
      //
      // Each entry describes one selectable dataset.
      //
      // Fields:
      //   value            — unique key used as <option value=>
      //   label            — display text in the dropdown
      //   files[]          — ordered list of JSON filenames to fetch
      //   mergeStrategy    — 'none' | 'by-rloc16' | 'by-identity'
      //                       'none'        → pass raw arrays straight to the adaptor
      //                       'by-rloc16'   → merge all fetched arrays by rloc16 key
      //                       'by-identity' → merge by rloc16, canonical extaddr, or omrIpv6Address
      //   topologyMode     — which topology adaptor to call:
      //                       'meshdiag-networkdiag' | 'merged-detailed' | 'eve'
      //                       'router-table' | 'raw-array'
      //   defaultLinkFilter — value pre-selected in #link-filter when this dataset loads

      const DATASET_REGISTRY = [

        // ── Single-file simple datasets (eve, table; topology ) ───
        {
          value: 'example_small_eve_native_threadlayout',
          label: 'example: small: eve native: Eve Thread Network Layout.evethreadlayout',
          files: [
            'example-small-Eve Thread Network Layout.evethreadlayout'
          ],
          mergeStrategy: 'none',
          topologyMode: 'eve_native',
          defaultLinkFilter: 'eve_native_routes_children'
        },
        // ── Single-file simple datasets (eve, table; topology ) ───
        {
          value: 'eve_native_threadlayout',
          label: 'eve native: Eve Thread Network Layout.evethreadlayout',
          files: [
            'Eve Thread Network Layout.evethreadlayout'
          ],
          mergeStrategy: 'none',
          topologyMode: 'eve_native',
          defaultLinkFilter: 'eve_native_routes_children'
        },         
        // ── Single-file simple datasets (eve, table; topology ) ───
        {
          value: 'eve_enhanced_topology',
          label: 'eve enhanced: td-eve-topology.json',
          files: [
            'td-eve-topology.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'eve_enhanced',
          defaultLinkFilter: 'eve_enhanced_routes_children'
        }, 

        // ── Multi-file topology datasets (otbr rest api) ────────────
        {
          value: 'restapi_devices_diagnostics',
          label: 'otbr rest api: devices, diagnostics',
          files: [
            'td-otbr-restapi-devices.json',
            'td-otbr-restapi-diagnostics.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'otbr_restapi',
          defaultLinkFilter: 'otbr_rest_api'
        },

        // ── Multi-file merged (medium depth — matches td_web_tables.html __merged__) ──
        {
          value: 'merged_otbr_cli_all',
          label: 'merged: otbr cli: meshdiag, networkdiag, neighbortables, childtables',
          files: [
            'td-otbr-cli-meshdiag-topology.json',
            'td-otbr-cli-networkdiag-topology.json',
            'td-otbr-cli-meshdiag-router-neighbortables.json', 
            'td-otbr-cli-meshdiag-router-childtables.json'
          ],
          mergeStrategy: 'by-identity',
          topologyMode: 'meshdiag-networkdiag',
          defaultLinkFilter: 'default_links'
        }, 

        // ── Multi-file topology datasets (match td_web_topology.html) ────────────
        {
          value: 'merged_otbr_cli_otbr_restapi',
          label: 'merged: otbr cli: meshdiag, networkdiag, restapi: devices, diagnostics',
          files: [
            'td-otbr-cli-meshdiag-topology.json',
            'td-otbr-cli-networkdiag-topology.json',
            'td-otbr-cli-meshdiag-router-neighbortables.json',
            'td-otbr-cli-meshdiag-router-childtables.json',
            'td-otbr-restapi-devices.json',
            'td-otbr-restapi-diagnostics.json'
          ],
          mergeStrategy: 'by-identity',
          topologyMode: 'meshdiag-networkdiag',
          defaultLinkFilter: 'default_links'
        },

        // ── Multi-file merged (medium depth — matches td_web_tables.html __merged__) ──
        {
          value: 'merged_otbr_cli_meshdiag_networkdiag_neighbortables_eve',
          label: 'merged: otbr cli: meshdiag, networkdiag, neighbortables, eve',
          files: [
            'td-otbr-cli-meshdiag-topology.json',
            'td-otbr-cli-networkdiag-topology.json',
            'td-otbr-cli-meshdiag-router-neighbortables.json',
            'td-eve-topology.json'
          ],
          mergeStrategy: 'by-identity',
          topologyMode: 'meshdiag-networkdiag',
          defaultLinkFilter: 'default_links'
        },         
        
        // ── Multi-file merged (medium depth — matches td_web_tables.html __merged__) ──
        {
          value: 'merged_otbr_cli_meshdiag_networkdiag_neighbortables_restapi_eve',
          label: 'merged: otbr cli: meshdiag, networkdiag, neighbortables, otbr restapi, eve',
          files: [
            'td-otbr-cli-meshdiag-topology.json',
            'td-otbr-cli-networkdiag-topology.json',
            'td-otbr-cli-meshdiag-router-neighbortables.json',
            'td-otbr-restapi-devices.json',
            'td-otbr-restapi-diagnostics.json',
            'td-eve-topology.json'
          ],
          mergeStrategy: 'by-identity',
          topologyMode: 'meshdiag-networkdiag',
          defaultLinkFilter: 'default_links'
        },   

        // ── Deep merged (matches td_web_tables.html td-merged-topology-all.json) ─
        {
          value: 'merged_all_deep_wide_otbr_cli_restapi_eve',
          label: 'merged: all: otbr cli, restapi, eve - td-merged-topology-all.json',
          files: [
            'td-merged-topology-all.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'merged-detailed',
          defaultLinkFilter: 'all_links'
        },

        // ── Single-file simple datasets (table-first; topology via raw-array) ───
        {
          value: 'router_table',
          label: 'td-otbr-cli-router-table.json',
          files: [
            'td-otbr-cli-router-table.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'router-table',
          defaultLinkFilter: 'all_links'
        },
        {
          value: 'meshdiag_only',
          label: 'td-otbr-cli-meshdiag-topology.json',
          files: [
            'td-otbr-cli-meshdiag-topology.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'meshdiag-networkdiag',
          defaultLinkFilter: 'default_links'
        },
        {
          value: 'networkdiag_only',
          label: 'td-otbr-cli-networkdiag-topology.json',
          files: [
            'td-otbr-cli-networkdiag-topology.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'meshdiag-networkdiag',
          defaultLinkFilter: 'default_links'
        },
        {
          value: 'router_neighbortables',
          label: 'td-otbr-cli-meshdiag-router-neighbortables.json',
          files: [
            'td-otbr-cli-meshdiag-router-neighbortables.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'merged-detailed',
          defaultLinkFilter: 'all_links'
        },
        {
          value: 'restapi_devices',
          label: 'td-otbr-restapi-devices.json',
          files: [
            'td-otbr-restapi-devices.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'otbr_restapi',
          defaultLinkFilter: 'all_links'
        },
        {
          value: 'restapi_diagnostics',
          label: 'td-otbr-restapi-diagnostics.json',
          files: [
            'td-otbr-restapi-diagnostics.json'
          ],
          mergeStrategy: 'none',
          topologyMode: 'otbr_restapi',
          defaultLinkFilter: 'all_links'
        }
      ];

      // Build dataset <select> from registry
      (function populateDatasetSelect() {
        const sel = document.getElementById('dataset-select');
        DATASET_REGISTRY.forEach((entry) => {
          const opt = document.createElement('option');
          opt.value = entry.value;
          opt.textContent = entry.label;
          sel.appendChild(opt);
        });
      })();

      // ── Section 3: Dataset Loader ─────────────────────────────────────────────
      //
      // currentDataset holds the last successfully loaded result so that
      // switching views (topology ↔ table) never re-fetches JSON.
      //
      // Shape:
      //   {
      //     entry       : DATASET_REGISTRY entry
      //     rawFiles    : array of parsed JSON values, one per entry.files[]
      //     rows        : flat array of objects (after mergeStrategy applied)
      //     loadedFiles : string[]  names of files that actually loaded (for status)
      //   }

      let currentDataset = null;

      // Canonical merge identity model used by dashboard merge paths.
      const MERGE_STRATEGIES = Object.freeze({
        none: 'none',
        byRloc16: 'by-rloc16',
        byIdentity: 'by-identity'
      });

      const MERGE_IDENTITY_FIELDS = Object.freeze({
        rloc16: 'rloc16',
        extaddrAliases: ['extaddr', 'extAddress', 'Extended MAC'],
        omrIpv6Address: 'omrIpv6Address'
      });

      // ── Helpers shared with adaptors ────────────────────────────────────────

      function toText(value) {
        return value === undefined || value === null ? '' : String(value).trim();
      }

      function toFiniteNumber(value) {
        if (Number.isFinite(value)) return value;
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : undefined;
      }

      function isPlainObject(value) {
        return value !== null && typeof value === 'object' && !Array.isArray(value);
      }

      function canonicalIdText(value) {
        const text = toText(value);
        return text ? text.toLowerCase() : '';
      }

      function getCanonicalRloc16(row) {
        return canonicalIdText(row?.[MERGE_IDENTITY_FIELDS.rloc16]);
      }

      function getCanonicalExtaddr(row) {
        for (const key of MERGE_IDENTITY_FIELDS.extaddrAliases) {
          const value = canonicalIdText(row?.[key]);
          if (value) return value;
        }
        return '';
      }

      function getCanonicalOmrIpv6Address(row) {
        return canonicalIdText(row?.[MERGE_IDENTITY_FIELDS.omrIpv6Address]);
      }

      function normalizeRowMergeAliases(row) {
        if (!isPlainObject(row)) return row;
        const normalized = { ...row };
        const extaddr = getCanonicalExtaddr(row);
        const omrIpv6Address = getCanonicalOmrIpv6Address(row);

        if (extaddr) normalized.extaddr = extaddr;
        if (omrIpv6Address) normalized.omrIpv6Address = omrIpv6Address;

        return normalized;
      }

      function normalizeDatasetPayload(value) {
        if (Array.isArray(value)) {
          return value.map((item) => normalizeDatasetPayload(item));
        }
        if (isPlainObject(value)) {
          const normalized = normalizeRowMergeAliases(value);
          Object.keys(normalized).forEach((key) => {
            const child = normalized[key];
            if (Array.isArray(child) || isPlainObject(child)) {
              normalized[key] = normalizeDatasetPayload(child);
            }
          });
          return normalized;
        }
        return value;
      }

      // ── Row normalisation (used by table renderer + merge strategies) ────────

      function normalizeRows(rawData, sourceName = '') {
        if (Array.isArray(rawData)) {
          return rawData.map((row, index) => {
            if (isPlainObject(row)) return withRowProvenance(normalizeRowMergeAliases(row), sourceName);
            return withRowProvenance({ row_index: index, value: row }, sourceName);
          });
        }
        if (isPlainObject(rawData)) {
          return Object.keys(rawData).map((key) => {
            const row = rawData[key];
            if (isPlainObject(row)) return withRowProvenance(normalizeRowMergeAliases({ _row_key: key, ...row }), sourceName);
            return withRowProvenance({ _row_key: key, value: row }, sourceName);
          });
        }
        return [withRowProvenance({ value: rawData }, sourceName)];
      }

      // ── Merge strategies ───────────────────────────────────────────────────

      function normalizeRloc16(value) {
        return canonicalIdText(value);
      }

      function getRowMergeIdentityKeys(row, strategy) {
        const keys = [];
        const rloc16 = getCanonicalRloc16(row);
        if (rloc16) keys.push(`rloc16:${rloc16}`);

        if (strategy === MERGE_STRATEGIES.byIdentity) {
          const extaddr = getCanonicalExtaddr(row);
          const omrIpv6Address = getCanonicalOmrIpv6Address(row);
          if (extaddr) keys.push(`extaddr:${extaddr}`);
          if (omrIpv6Address) keys.push(`omrIpv6Address:${omrIpv6Address}`);
        }

        return [...new Set(keys)];
      }

      function isEmptyMergeValue(value) {
        if (value === undefined || value === null || value === '') return true;
        if (Array.isArray(value) && value.length === 0) return true;
        if (isPlainObject(value) && Object.keys(value).length === 0) return true;
        return false;
      }

      function areMergeValuesEquivalent(left, right) {
        if (left === right) return true;
        if (Array.isArray(left) || Array.isArray(right) || isPlainObject(left) || isPlainObject(right)) {
          try {
            return JSON.stringify(left) === JSON.stringify(right);
          } catch (_error) {
            return false;
          }
        }
        return false;
      }

      function mergeStringArrays(existingValues, incomingValues) {
        const merged = [];
        [...existingValues, ...incomingValues].forEach((value) => {
          const text = toText(value);
          if (text && !merged.includes(text)) merged.push(text);
        });
        return merged;
      }

      function withRowProvenance(row, sourceName) {
        if (!isPlainObject(row)) return row;
        const normalized = { ...row };
        const existingSources = Array.isArray(normalized._source_files) ? normalized._source_files : [];
        normalized._source_files = sourceName ? mergeStringArrays(existingSources, [sourceName]) : mergeStringArrays(existingSources, []);
        return normalized;
      }

      function appendRowConflict(target, key, currentValue, incomingValue) {
        const conflicts = Array.isArray(target._merge_conflicts) ? [...target._merge_conflicts] : [];
        if (conflicts.length >= 20) {
          target._merge_conflicts = conflicts;
          return;
        }

        const currentText = formatValue(currentValue);
        const incomingText = formatValue(incomingValue);
        const duplicate = conflicts.some((entry) => (
          entry && entry.key === key && entry.current === currentText && entry.incoming === incomingText
        ));
        if (!duplicate) {
          conflicts.push({ key, current: currentText, incoming: incomingText });
        }
        target._merge_conflicts = conflicts;
      }

      function mergeRowMetadata(target, source) {
        target._source_files = mergeStringArrays(
          Array.isArray(target._source_files) ? target._source_files : [],
          Array.isArray(source._source_files) ? source._source_files : []
        );
        target._merge_identity_keys = mergeStringArrays(
          Array.isArray(target._merge_identity_keys) ? target._merge_identity_keys : [],
          Array.isArray(source._merge_identity_keys) ? source._merge_identity_keys : []
        );
        const existingConflicts = Array.isArray(target._merge_conflicts) ? target._merge_conflicts : [];
        const incomingConflicts = Array.isArray(source._merge_conflicts) ? source._merge_conflicts : [];
        if (incomingConflicts.length > 0) {
          target._merge_conflicts = [...existingConflicts, ...incomingConflicts].slice(0, 20);
        } else if (existingConflicts.length > 0) {
          target._merge_conflicts = existingConflicts;
        }
      }

      function mergeRowFields(target, source) {
        mergeRowMetadata(target, source);
        Object.keys(source).forEach((key) => {
          if (key.startsWith('_')) return;
          const sv = source[key];
          const tv = target[key];
          if (isEmptyMergeValue(tv) && !isEmptyMergeValue(sv)) {
            target[key] = sv;
          } else if (!isEmptyMergeValue(tv) && !isEmptyMergeValue(sv) && !areMergeValuesEquivalent(tv, sv)) {
            appendRowConflict(target, key, tv, sv);
          }
        });
      }

      function mergeRowsByStrategy(rowGroups, strategy) {
        const mergedRows = new Map();
        const identifierToNodeId = new Map();
        let nextNodeId = 1;

        rowGroups.forEach((rows) => {
          rows.forEach((row) => {
            const identityKeys = getRowMergeIdentityKeys(row, strategy);
            if (identityKeys.length === 0) return;

            const candidateIds = [...new Set(identityKeys
              .map((identityKey) => identifierToNodeId.get(identityKey))
              .filter((nodeId) => nodeId !== undefined))].sort((a, b) => a - b);

            let targetId;
            if (candidateIds.length === 0) {
              targetId = nextNodeId;
              nextNodeId += 1;
              mergedRows.set(targetId, {
                ...row,
                _merge_identity_keys: [...identityKeys]
              });
            } else {
              targetId = candidateIds[0];
              const target = mergedRows.get(targetId) || { ...row };
              mergedRows.set(targetId, target);

              candidateIds.slice(1).forEach((sourceId) => {
                const source = mergedRows.get(sourceId);
                if (!source) return;
                mergeRowFields(target, source);
                mergedRows.delete(sourceId);
                identifierToNodeId.forEach((mappedId, identityKey) => {
                  if (mappedId === sourceId) identifierToNodeId.set(identityKey, targetId);
                });
              });

              mergeRowFields(target, row);
              target._merge_identity_keys = mergeStringArrays(
                Array.isArray(target._merge_identity_keys) ? target._merge_identity_keys : [],
                identityKeys
              );
            }

            identityKeys.forEach((identityKey) => {
              identifierToNodeId.set(identityKey, targetId);
            });
          });
        });

        return Array.from(mergedRows.values());
      }

      function mergeRowsByRloc16(rowGroups) {
        return mergeRowsByStrategy(rowGroups, MERGE_STRATEGIES.byRloc16);
      }

      function mergeRowsByIdentity(rowGroups) {
        return mergeRowsByStrategy(rowGroups, MERGE_STRATEGIES.byIdentity);
      }

      // ── Core fetch helper ─────────────────────────────────────────────────

      async function fetchJson(path) {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
        return response.json();
      }

      // ── Dataset load entry-point ──────────────────────────────────────────

      async function loadDataset(entryValue) {
        const entry = DATASET_REGISTRY.find((e) => e.value === entryValue);
        if (!entry) {
          document.getElementById('status').textContent = `Unknown dataset: ${entryValue}`;
          return;
        }

        const statusEl = document.getElementById('status');
        statusEl.textContent = `Loading ${entry.label}…`;

        // Apply default link-filter for this dataset
        const linkFilterEl = document.getElementById('link-filter');
        if (entry.defaultLinkFilter) {
          linkFilterEl.value = entry.defaultLinkFilter;
        }

        // Fetch all files in parallel (settle so a missing optional file doesn't abort)
        const settled = await Promise.allSettled(entry.files.map((f) => fetchJson(f)));

        const rawFiles = [];
        const loadedFiles = [];
        const failedFiles = [];

        settled.forEach((result, i) => {
          if (result.status === 'fulfilled') {
            rawFiles.push(normalizeDatasetPayload(result.value));
            loadedFiles.push(entry.files[i]);
          } else {
            rawFiles.push(null);
            failedFiles.push(entry.files[i]);
          }
        });

        if (loadedFiles.length === 0) {
          statusEl.textContent = `Error: could not load any file for "${entry.label}". Failed: ${failedFiles.join(', ')}`;
          return;
        }

        // Apply merge strategy to produce a flat rows array for the table renderer
        let rows;
        if (entry.mergeStrategy === MERGE_STRATEGIES.byRloc16) {
          const groups = rawFiles
            .map((d, index) => (d !== null ? normalizeRows(d, entry.files[index]) : null))
            .filter((group) => group !== null);
          rows = mergeRowsByRloc16(groups);
        } else if (entry.mergeStrategy === MERGE_STRATEGIES.byIdentity) {
          const groups = rawFiles
            .map((d, index) => (d !== null ? normalizeRows(d, entry.files[index]) : null))
            .filter((group) => group !== null);
          rows = mergeRowsByIdentity(groups);
        } else {
          // 'none' — for single-file datasets just normalise the first loaded file;
          // multi-file 'none' datasets hand the full rawFiles array to the adaptor
          const firstLoaded = rawFiles.find((d) => d !== null);
          const firstLoadedIndex = rawFiles.findIndex((d) => d !== null);
          // For eve_native files the top-level shape is { version, nodes: [...] };
          // For otbr_restapi files the top-level shape is { data: [...] };
          // extract the inner array so the table renderer shows one row per node.
          const rowSource = (entry.topologyMode === 'eve_native' && firstLoaded && Array.isArray(firstLoaded.nodes))
            ? firstLoaded.nodes
            : (entry.topologyMode === 'otbr_restapi' && firstLoaded && Array.isArray(firstLoaded.data))
            ? firstLoaded.data
            : firstLoaded;
          rows = rowSource !== null ? normalizeRows(rowSource, entry.files[firstLoadedIndex]) : [];
        }

        currentDataset = { entry, rawFiles, rows, loadedFiles };

        // Warn about any files that failed to load but don't hard-fail
        if (failedFiles.length > 0) {
          console.warn('Some dataset files could not be loaded:', failedFiles);
        }

        renderCurrentView();
      }

      // ── Render dispatcher — called after load and after view toggle ──────────

      function renderCurrentView() {
        if (!currentDataset) return;
        const view = currentView;   // set by view-toggle (Section 7)
        if (view === 'topology') {
          renderTopologyForDataset(currentDataset);
        } else {
          renderTableForDataset(currentDataset);
        }
      }

      // ── Section 4: Shared topology utilities + Adaptors ──────────────────────
      //
      // Each adaptor is a pure function:
      //   adaptXxx(rawFiles) → { nodeData, edgeData, nodeMap, rawByIdForDetails,
      //                          routerNeighborByRloc16, sourceNames }
      //
      // nodeData / edgeData feed directly into vis.DataSet.
      // nodeMap / rawByIdForDetails are used by the node-detail click handler.
      // routerNeighborByRloc16 is needed by the router-neighbor diagnostic filter.

      // ── Shared topology utility functions ────────────────────────────────────

      function chooseNodeId(node, fallbackPrefix, index) {
        const rloc16 = toText(node.rloc16);
        if (rloc16) return rloc16;
        const idField = toText(node.id);
        if (idField) return idField;
        const extAddr = getCanonicalExtaddr(node);
        if (extAddr) return extAddr;
        const omrIpv6Address = getCanonicalOmrIpv6Address(node);
        if (omrIpv6Address) return omrIpv6Address;
        return `${fallbackPrefix}-${index}`;
      }

      function buildLabel(node) {
        const nodeName = toText(node.device_label) || toText(node.name) || 'Unknown node';
        const rloc16 = toText(node.rloc16) || 'rloc16:n/a';
        return `${nodeName}\n${rloc16}`;
      }

      function isUnknownNodeName(nodeName) {
        return toText(nodeName).toLowerCase().startsWith('unknown');
      }

      function formatValue(value) {
        if (Array.isArray(value)) return value.length === 0 ? '[]' : value.join(', ');
        if (value && typeof value === 'object') {
          try { return JSON.stringify(value); } catch (_e) { return '[object]'; }
        }
        if (typeof value === 'boolean') return value ? 'true' : 'false';
        return toText(value) || 'n/a';
      }

      function mergeForDisplay(primary, secondary) {
        if (primary === undefined || primary === null) return secondary;
        if (secondary === undefined || secondary === null) return primary;
        if (Array.isArray(primary) && Array.isArray(secondary)) {
          return secondary.length > 0 ? secondary : primary;
        }
        if (isPlainObject(primary) && isPlainObject(secondary)) {
          const merged = {};
          const keys = new Set([...Object.keys(primary), ...Object.keys(secondary)]);
          keys.forEach((key) => { merged[key] = mergeForDisplay(primary[key], secondary[key]); });
          return merged;
        }
        return secondary;
      }

      function flattenObjectEntries(value, path = '', entries = []) {
        if (isPlainObject(value)) {
          const keys = Object.keys(value).sort((a, b) => a.localeCompare(b));
          if (keys.length === 0 && path) { entries.push([path, {}]); return entries; }
          keys.forEach((key) => {
            flattenObjectEntries(value[key], path ? `${path}.${key}` : key, entries);
          });
          return entries;
        }
        if (Array.isArray(value)) {
          if (value.length === 0) { entries.push([path, []]); return entries; }
          if (value.every((item) => isPlainObject(item))) {
            value.forEach((item, i) => flattenObjectEntries(item, `${path}[${i}]`, entries));
            return entries;
          }
          entries.push([path, value]);
          return entries;
        }
        entries.push([path || 'value', value]);
        return entries;
      }

      function shouldExcludeDetailPath(path) {
        const p = toText(path);
        if (!p) return false;
        if (p === '1_links' || p.startsWith('1_links[')) return true;
        if (p === '2_links' || p.startsWith('2_links[')) return true;
        if (p === '3_links' || p.startsWith('3_links[')) return true;
        if (p === 'children' || p.startsWith('children[')) return true;
        return false;
      }

      function sortDetailsWithPriority(details) {
        const priorityKeys = [
          'rloc16', 'extaddr', 'device_label', 'name', 'type', 'br',
          'mode.device', 'thread_stack_version', 'ver', 'total_links', 'total_children',
          'mac_counters.iftotaldiscards_pct', 'mac_counters.iftotalerrors_pct',
          'mle_counters.partitionidchanges', 'mle_counters.betterpartitionattachattempts',
          'mle_counters.parentchanges'
        ];
        const priorityIndex = new Map(priorityKeys.map((k, i) => [k, i]));
        return [...details].sort((a, b) => {
          const ap = priorityIndex.has(a[0]) ? priorityIndex.get(a[0]) : Infinity;
          const bp = priorityIndex.has(b[0]) ? priorityIndex.get(b[0]) : Infinity;
          if (ap !== bp) return ap - bp;
          return a[0].localeCompare(b[0]);
        });
      }

      function addEdge(edgeMap, edgeData, from, to, style) {
        if (!from || !to || from === to) return;
        const suffix = toText(style.edgeKeySuffix);
        const keyBase = [from, to].sort().join('|');
        const key = suffix ? `${keyBase}|${suffix}` : keyBase;
        const existing = edgeMap.get(key);
        if (existing) {
          if (Number.isFinite(style.width)) existing.width = Math.max(existing.width || 0, style.width);
          const merged = new Set([
            ...normalizeLinkCategories(existing.linkCategories),
            ...normalizeLinkCategories(style.linkCategories)
          ]);
          existing.linkCategories = Array.from(merged);
          if (style.isParentChild === true) existing.isParentChild = true;
          return;
        }
        const { edgeKeySuffix: _s, ...edgeStyle } = style;
        const edge = { from, to, ...edgeStyle };
        edge.id = key;
        edge.baseHidden = style.hidden === true;
        edge.linkCategories = normalizeLinkCategories(style.linkCategories);
        edgeMap.set(key, edge);
        edgeData.push(edge);
      }

      // ── Link filter constants ─────────────────────────────────────────────────

      const LINK_FILTER_DEFAULT = 'default_links';
      const LINK_FILTER_DEFAULT_PLUS_NEIGHBORS = 'default_plus_router_neighbors';
      const LINK_FILTER_OTBR_REST_API = 'otbr_rest_api';
      const LINK_FILTER_EVE_ENHANCED = 'eve_enhanced_routes_children';
      const LINK_FILTER_EVE_NATIVE = 'eve_native_routes_children';
      const LINK_FILTER_ALL = 'all_links';

      const EDGE_CATEGORY_DEFAULT_CHILDREN = 'default_children';
      const EDGE_CATEGORY_DEFAULT_1 = 'default_1_links';
      const EDGE_CATEGORY_DEFAULT_2 = 'default_2_links';
      const EDGE_CATEGORY_DEFAULT_3 = 'default_3_links';
      const EDGE_CATEGORY_ROUTER_NEIGHBOR = 'router_neighbor';
      const EDGE_CATEGORY_OTBR_ROUTE = 'otbr_route';
      const EDGE_CATEGORY_OTBR_CHILD = 'otbr_child';
      const EDGE_CATEGORY_EVE_ROUTE = 'eve_route';
      const EDGE_CATEGORY_EVE_CHILD = 'eve_child';
      const EDGE_CATEGORY_EVE_NATIVE_ROUTE = 'eve_native_route';
      const EDGE_CATEGORY_EVE_NATIVE_CHILD = 'eve_native_child';

      // ── Phase 1: Filter option metadata registries ────────────────────────────
      //
      // Each registry is the single source of truth mapping a dropdown <option>
      // value to the data fields / edge categories that must be present in the
      // active dataset for that option to be meaningful.
      //
      // Fields:
      //   value          — must match the <option value="..."> in the HTML
      //   alwaysShow     — when true the option is never hidden regardless of data
      //
      // NODE_FILTER_OPTIONS
      //   topoNodeField  — vis-node property name (topology view)
      //   topoNodeValue  — expected value to test for (undefined → truthy-check)
      //   tableRowField  — dot-path into the normalised row (table view)
      //   tableRowValue  — expected value to test for (undefined → any non-empty)
      //
      // LINK_FILTER_OPTIONS  (topology-only; always hidden in table view)
      //   requiredEdgeCategories — at least one edge must carry one of these
      //
      // DIAGNOSTIC_FILTER_OPTIONS
      //   topoNodeField  — vis-node property name (topology view)
      //   tableRowField  — dot-path into the normalised row (table view)
      //   tableNeighborField — field inside router_neighbor_table[] rows
      //                        (used instead of tableRowField when set)

      const NODE_FILTER_OPTIONS = Object.freeze([
        { value: 'all',                       alwaysShow: true },
        {
          value: 'ftd-devices',
          topoNodeField: 'mode_device',       topoNodeValue: 'FTD',
          tableRowField: 'mode.device',       tableRowValue: 'FTD'
        },
        {
          value: 'mtd-devices',
          topoNodeField: 'mode_device',       topoNodeValue: 'MTD',
          tableRowField: 'mode.device',       tableRowValue: 'MTD'
        },
        {
          value: 'main-routers',
          topoNodeField: 'isMainRouter',
          tableRowField: 'rloc16'             // rloc16 ending in '00' → main router
        },
        {
          value: 'border-routers',
          topoNodeField: 'isBorderRouter',
          tableRowField: 'br'
        },
        {
          value: 'routers-with-children',
          topoNodeField: 'isRouter',          // isRouter && hasChildren
          tableRowField: 'total_children'     // > 0, or children[] length > 0
        },
        {
          value: 'routers-without-children',
          topoNodeField: 'isRouter',          // isRouter && !hasChildren
          tableRowField: 'rloc16'             // router-shaped, checked by predicate
        }
      ]);

      const LINK_FILTER_OPTIONS = Object.freeze([
        { value: LINK_FILTER_ALL,                    alwaysShow: true },
        {
          value: LINK_FILTER_DEFAULT,
          requiredEdgeCategories: [
            EDGE_CATEGORY_DEFAULT_CHILDREN,
            EDGE_CATEGORY_DEFAULT_1,
            EDGE_CATEGORY_DEFAULT_2,
            EDGE_CATEGORY_DEFAULT_3,
            EDGE_CATEGORY_OTBR_CHILD
          ]
        },
        {
          value: LINK_FILTER_DEFAULT_PLUS_NEIGHBORS,
          requiredEdgeCategories: [
            EDGE_CATEGORY_DEFAULT_CHILDREN,
            EDGE_CATEGORY_DEFAULT_1,
            EDGE_CATEGORY_DEFAULT_2,
            EDGE_CATEGORY_DEFAULT_3,
            EDGE_CATEGORY_OTBR_CHILD,
            EDGE_CATEGORY_ROUTER_NEIGHBOR
          ]
        },
        {
          value: LINK_FILTER_OTBR_REST_API,
          requiredEdgeCategories: [EDGE_CATEGORY_OTBR_ROUTE, EDGE_CATEGORY_OTBR_CHILD]
        },
        {
          value: LINK_FILTER_EVE_ENHANCED,
          requiredEdgeCategories: [EDGE_CATEGORY_EVE_ROUTE, EDGE_CATEGORY_EVE_CHILD]
        },
        {
          value: LINK_FILTER_EVE_NATIVE,
          requiredEdgeCategories: [EDGE_CATEGORY_EVE_NATIVE_ROUTE, EDGE_CATEGORY_EVE_NATIVE_CHILD]
        }
      ]);

      const DIAGNOSTIC_FILTER_OPTIONS = Object.freeze([
        { value: 'all', alwaysShow: true },
        // ── Mac counters ──────────────────────────────────────────────────────
        {
          value: 'medium-total-errors-pct',
          topoNodeField: 'iftotalerrors_pct',
          tableRowField: 'mac_counters.iftotalerrors_pct'
        },
        {
          value: 'medium-total-errors-high',
          topoNodeField: 'iftotalerrors_pct',
          tableRowField: 'mac_counters.iftotalerrors_pct'
        },
        {
          value: 'medium-discard-pct',
          topoNodeField: 'iftotalpktserrorsdiscards_pct',
          tableRowField: 'mac_counters.iftotalpktserrorsdiscards_pct'
        },
        // ── Mle counters ──────────────────────────────────────────────────────
        {
          value: 'medium-partition-changes',
          topoNodeField: 'partitionidchanges',
          tableRowField: 'mle_counters.partitionidchanges'
        },
        {
          value: 'high-partition-changes',
          topoNodeField: 'partitionidchanges',
          tableRowField: 'mle_counters.partitionidchanges'
        },
        {
          value: 'medium-parent-changes',
          topoNodeField: 'parentchanges',
          tableRowField: 'mle_counters.parentchanges'
        },
        {
          value: 'high-parent-changes',
          topoNodeField: 'parentchanges',
          tableRowField: 'mle_counters.parentchanges'
        },
        // ── Router-neighbor: frame error rate ─────────────────────────────────
        {
          value: 'router-neighbor-err-rate-frame-low',
          topoNodeField: 'router_neighbor_max_err_rate_frame_pct',
          tableNeighborField: 'err_rate_frame_pct'
        },
        {
          value: 'router-neighbor-err-rate-frame-medium',
          topoNodeField: 'router_neighbor_max_err_rate_frame_pct',
          tableNeighborField: 'err_rate_frame_pct'
        },
        {
          value: 'router-neighbor-err-rate-frame-high',
          topoNodeField: 'router_neighbor_max_err_rate_frame_pct',
          tableNeighborField: 'err_rate_frame_pct'
        },
        // ── Router-neighbor: message error rate ───────────────────────────────
        {
          value: 'router-neighbor-err-rate-msg-low',
          topoNodeField: 'router_neighbor_max_err_rate_msg_pct',
          tableNeighborField: 'err_rate_msg_pct'
        },
        {
          value: 'router-neighbor-err-rate-msg-medium',
          topoNodeField: 'router_neighbor_max_err_rate_msg_pct',
          tableNeighborField: 'err_rate_msg_pct'
        },
        {
          value: 'router-neighbor-err-rate-msg-high',
          topoNodeField: 'router_neighbor_max_err_rate_msg_pct',
          tableNeighborField: 'err_rate_msg_pct'
        },
        // ── Router-neighbor: RSS ──────────────────────────────────────────────
        {
          value: 'router-neighbor-rss-very-low',
          topoNodeField: 'router_neighbor_has_rss_very_low',
          tableNeighborField: 'rss_ave'
        },
        {
          value: 'router-neighbor-rss-low',
          topoNodeField: 'router_neighbor_has_rss_low',
          tableNeighborField: 'rss_ave'
        },
        {
          value: 'router-neighbor-rss-medium',
          topoNodeField: 'router_neighbor_has_rss_medium',
          tableNeighborField: 'rss_ave'
        },
        {
          value: 'router-neighbor-rss-high',
          topoNodeField: 'router_neighbor_has_rss_high',
          tableNeighborField: 'rss_ave'
        }
      ]);

      // ── Phase 2: DatasetCapabilities compute functions ────────────────────────
      //
      // computeTopologyCapabilities(nodeData, edgeData)
      //   Called after runAdaptor() in renderTopologyForDataset.
      //   Scans vis-node objects and edge linkCategories to produce capability flags.
      //
      // computeTableCapabilities(rows)
      //   Called at the top of renderTableForDataset.
      //   Scans normalised row objects (including router_neighbor_table sub-arrays).
      //   Defined after getColumnValue (which it depends on) further down in this
      //   script, but declared here so the shape is documented alongside Phase 1.
      //
      // Both return a DatasetCapabilities object:
      //   {
      //     // Node filter flags
      //     hasFtdNodes               : bool,
      //     hasMtdNodes               : bool,
      //     hasMainRouters            : bool,
      //     hasBorderRouters          : bool,
      //     hasRoutersWithChildren    : bool,
      //     hasRoutersWithoutChildren : bool,
      //
      //     // Link filter (topology: Set of edge category strings; table: empty Set)
      //     edgeCategories            : Set<string>,
      //
      //     // Diagnostic filter flags
      //     hasFieldMacTotalErrorsPct  : bool,
      //     hasFieldMacDiscardPct      : bool,
      //     hasFieldPartitionChanges   : bool,
      //     hasFieldParentChanges      : bool,
      //     hasNeighborFrameErrRate    : bool,
      //     hasNeighborMsgErrRate      : bool,
      //     hasNeighborRss             : bool
      //   }

      function computeTopologyCapabilities(nodeData, edgeData) {
        let hasFtdNodes = false;
        let hasMtdNodes = false;
        let hasMainRouters = false;
        let hasBorderRouters = false;
        let hasRoutersWithChildren = false;
        let hasRoutersWithoutChildren = false;
        let hasFieldMacTotalErrorsPct = false;
        let hasFieldMacDiscardPct = false;
        let hasFieldPartitionChanges = false;
        let hasFieldParentChanges = false;
        let hasNeighborFrameErrRate = false;
        let hasNeighborMsgErrRate = false;
        let hasNeighborRss = false;

        for (const node of nodeData) {
          const md = toText(node.mode_device).toUpperCase();
          if (md === 'FTD') hasFtdNodes = true;
          if (md === 'MTD') hasMtdNodes = true;
          if (node.isMainRouter === true) hasMainRouters = true;
          if (node.isBorderRouter === true) hasBorderRouters = true;
          if (node.isRouter === true && node.hasChildren === true) hasRoutersWithChildren = true;
          if (node.isRouter === true && node.hasChildren !== true) hasRoutersWithoutChildren = true;
          if (Number.isFinite(node.iftotalerrors_pct)) hasFieldMacTotalErrorsPct = true;
          if (Number.isFinite(node.iftotalpktserrorsdiscards_pct)) hasFieldMacDiscardPct = true;
          if (Number.isFinite(node.partitionidchanges)) hasFieldPartitionChanges = true;
          if (Number.isFinite(node.parentchanges)) hasFieldParentChanges = true;
          if (Number.isFinite(node.router_neighbor_max_err_rate_frame_pct)) hasNeighborFrameErrRate = true;
          if (Number.isFinite(node.router_neighbor_max_err_rate_msg_pct)) hasNeighborMsgErrRate = true;
          if (Number.isFinite(node.router_neighbor_min_rss_ave)
              || Number.isFinite(node.router_neighbor_max_rss_ave)) hasNeighborRss = true;
        }

        const edgeCategories = new Set();
        for (const edge of edgeData) {
          for (const cat of normalizeLinkCategories(edge.linkCategories)) {
            edgeCategories.add(cat);
          }
        }

        return {
          hasFtdNodes, hasMtdNodes,
          hasMainRouters, hasBorderRouters,
          hasRoutersWithChildren, hasRoutersWithoutChildren,
          edgeCategories,
          hasFieldMacTotalErrorsPct, hasFieldMacDiscardPct,
          hasFieldPartitionChanges, hasFieldParentChanges,
          hasNeighborFrameErrRate, hasNeighborMsgErrRate, hasNeighborRss
        };
      }

      // computeTableCapabilities is defined after getColumnValue (Section 6 helpers).

      // ── Phase 4: updateFilterOptionVisibility ─────────────────────────────────
      //
      // Called after capabilities are computed for any dataset/view change.
      // Hides/disables options whose required fields are absent from the active
      // dataset.  If the currently-selected option becomes unavailable it is
      // reset to the safe default for that dropdown.
      //
      // Uses the Phase 1 registries (NODE_FILTER_OPTIONS, LINK_FILTER_OPTIONS,
      // DIAGNOSTIC_FILTER_OPTIONS) to iterate options and the Phase 2
      // DatasetCapabilities flags/edgeCategories to decide visibility.

      function updateFilterOptionVisibility(capabilities, view) {
        // ── Node filter ─────────────────────────────────────────────────────────
        const nodeCapabilityByValue = {
          'ftd-devices':              capabilities.hasFtdNodes,
          'mtd-devices':              capabilities.hasMtdNodes,
          'main-routers':             capabilities.hasMainRouters,
          'border-routers':           capabilities.hasBorderRouters,
          'routers-with-children':    capabilities.hasRoutersWithChildren,
          'routers-without-children': capabilities.hasRoutersWithoutChildren
        };

        const nodeFilterEl = document.getElementById('node-filter');
        Array.from(nodeFilterEl.options).forEach((opt) => {
          const meta = NODE_FILTER_OPTIONS.find((m) => m.value === opt.value);
          if (!meta || meta.alwaysShow) {
            opt.hidden = false;
            opt.disabled = false;
            return;
          }
          const available = nodeCapabilityByValue[opt.value] === true;
          opt.hidden = !available;
          opt.disabled = !available;
        });
        // Reset to 'all' if currently-selected option is now unavailable
        if (nodeFilterEl.options[nodeFilterEl.selectedIndex]?.disabled) {
          nodeFilterEl.value = 'all';
        }

        // ── Link filter ─────────────────────────────────────────────────────────
        // Link filter visibility only applies in topology view; in table view the
        // whole control is styled as disabled via CSS (filter-disabled class).
        const linkFilterEl = document.getElementById('link-filter');
        if (view === 'topology') {
          Array.from(linkFilterEl.options).forEach((opt) => {
            const meta = LINK_FILTER_OPTIONS.find((m) => m.value === opt.value);
            if (!meta || meta.alwaysShow) {
              opt.hidden = false;
              opt.disabled = false;
              return;
            }
            const available = meta.requiredEdgeCategories.some(
              (cat) => capabilities.edgeCategories.has(cat)
            );
            opt.hidden = !available;
            opt.disabled = !available;
          });
          if (linkFilterEl.options[linkFilterEl.selectedIndex]?.disabled) {
            linkFilterEl.value = LINK_FILTER_ALL;
          }
        }

        // ── Diagnostic filter ───────────────────────────────────────────────────
        const diagCapabilityByValue = {
          'medium-total-errors-pct':               capabilities.hasFieldMacTotalErrorsPct,
          'medium-total-errors-high':              capabilities.hasFieldMacTotalErrorsPct,
          'medium-discard-pct':                    capabilities.hasFieldMacDiscardPct,
          'medium-partition-changes':              capabilities.hasFieldPartitionChanges,
          'high-partition-changes':                capabilities.hasFieldPartitionChanges,
          'medium-parent-changes':                 capabilities.hasFieldParentChanges,
          'high-parent-changes':                   capabilities.hasFieldParentChanges,
          'router-neighbor-err-rate-frame-low':    capabilities.hasNeighborFrameErrRate,
          'router-neighbor-err-rate-frame-medium': capabilities.hasNeighborFrameErrRate,
          'router-neighbor-err-rate-frame-high':   capabilities.hasNeighborFrameErrRate,
          'router-neighbor-err-rate-msg-low':      capabilities.hasNeighborMsgErrRate,
          'router-neighbor-err-rate-msg-medium':   capabilities.hasNeighborMsgErrRate,
          'router-neighbor-err-rate-msg-high':     capabilities.hasNeighborMsgErrRate,
          'router-neighbor-rss-very-low':          capabilities.hasNeighborRss,
          'router-neighbor-rss-low':               capabilities.hasNeighborRss,
          'router-neighbor-rss-medium':            capabilities.hasNeighborRss,
          'router-neighbor-rss-high':              capabilities.hasNeighborRss
        };

        const diagFilterEl = document.getElementById('diagnostic-filter');
        Array.from(diagFilterEl.options).forEach((opt) => {
          const meta = DIAGNOSTIC_FILTER_OPTIONS.find((m) => m.value === opt.value);
          if (!meta || meta.alwaysShow) {
            opt.hidden = false;
            opt.disabled = false;
            return;
          }
          const available = diagCapabilityByValue[opt.value] === true;
          opt.hidden = !available;
          opt.disabled = !available;
        });
        if (diagFilterEl.options[diagFilterEl.selectedIndex]?.disabled) {
          diagFilterEl.value = 'all';
        }
      }

      function normalizeLinkCategories(value) {
        if (Array.isArray(value)) return value.filter((item) => toText(item));
        const text = toText(value);
        return text ? [text] : [];
      }

      function edgeMatchesLinkFilter(edge, mode) {
        const cats = normalizeLinkCategories(edge.linkCategories);
        if (cats.length === 0) return mode === LINK_FILTER_ALL;
        const hasAny = (...wanted) => wanted.some((c) => cats.includes(c));
        if (mode === LINK_FILTER_DEFAULT) {
          return hasAny(EDGE_CATEGORY_DEFAULT_CHILDREN, EDGE_CATEGORY_DEFAULT_1,
            EDGE_CATEGORY_DEFAULT_2, EDGE_CATEGORY_DEFAULT_3, EDGE_CATEGORY_OTBR_CHILD);
        }
        if (mode === LINK_FILTER_DEFAULT_PLUS_NEIGHBORS) {
          return hasAny(EDGE_CATEGORY_DEFAULT_CHILDREN, EDGE_CATEGORY_DEFAULT_1,
            EDGE_CATEGORY_DEFAULT_2, EDGE_CATEGORY_DEFAULT_3, EDGE_CATEGORY_OTBR_CHILD,
            EDGE_CATEGORY_ROUTER_NEIGHBOR);
        }
        if (mode === LINK_FILTER_OTBR_REST_API) return hasAny(EDGE_CATEGORY_OTBR_ROUTE, EDGE_CATEGORY_OTBR_CHILD);
        if (mode === LINK_FILTER_EVE_ENHANCED) return hasAny(EDGE_CATEGORY_EVE_ROUTE, EDGE_CATEGORY_EVE_CHILD);
        if (mode === LINK_FILTER_EVE_NATIVE) return hasAny(EDGE_CATEGORY_EVE_NATIVE_ROUTE, EDGE_CATEGORY_EVE_NATIVE_CHILD);
        if (mode === LINK_FILTER_ALL) return true;
        return false;
      }

      function buildMainRouterRloc16(routeId) {
        const n = toFiniteNumber(routeId);
        if (!Number.isFinite(n)) return '';
        return `0x${(n << 10).toString(16).padStart(4, '0')}`;
      }

      function buildChildRloc16(parentRloc16, childId) {
        const parentText = toText(parentRloc16).toLowerCase();
        const childNum = toFiniteNumber(childId);
        if (!parentText.startsWith('0x') || !Number.isFinite(childNum)) return '';
        const parentNum = Number.parseInt(parentText, 16);
        if (!Number.isFinite(parentNum)) return '';
        return `0x${(parentNum + childNum).toString(16).padStart(4, '0')}`;
      }

      function computeRouterNeighborStats(routerNeighborTable) {
        const rows = Array.isArray(routerNeighborTable) ? routerNeighborTable : [];
        let maxFrame, maxMsg, minRss, maxRss;
        let hasVeryLow = false, hasLow = false, hasMedium = false, hasHigh = false;
        rows.forEach((row) => {
          const fp = toFiniteNumber(row?.err_rate_frame_pct);
          if (Number.isFinite(fp)) maxFrame = Number.isFinite(maxFrame) ? Math.max(maxFrame, fp) : fp;
          const mp = toFiniteNumber(row?.err_rate_msg_pct);
          if (Number.isFinite(mp)) maxMsg = Number.isFinite(maxMsg) ? Math.max(maxMsg, mp) : mp;
          const rss = toFiniteNumber(row?.rss_ave);
          if (Number.isFinite(rss)) {
            minRss = Number.isFinite(minRss) ? Math.min(minRss, rss) : rss;
            maxRss = Number.isFinite(maxRss) ? Math.max(maxRss, rss) : rss;
            if (rss < -80) hasVeryLow = true;
            else if (rss >= -80 && rss < -70) hasLow = true;
            else if (rss >= -70 && rss <= -60) hasMedium = true;
            else if (rss > -60) hasHigh = true;
          }
        });
        return {
          router_neighbor_max_err_rate_frame_pct: maxFrame,
          router_neighbor_max_err_rate_msg_pct: maxMsg,
          router_neighbor_min_rss_ave: minRss,
          router_neighbor_max_rss_ave: maxRss,
          router_neighbor_has_rss_very_low: hasVeryLow,
          router_neighbor_has_rss_low: hasLow,
          router_neighbor_has_rss_medium: hasMedium,
          router_neighbor_has_rss_high: hasHigh
        };
      }

      function isRouterNeighborDiagnosticMode(mode) {
        return mode === 'router-neighbor-err-rate-frame-low'
          || mode === 'router-neighbor-err-rate-frame-medium'
          || mode === 'router-neighbor-err-rate-frame-high'
          || mode === 'router-neighbor-err-rate-msg-low'
          || mode === 'router-neighbor-err-rate-msg-medium'
          || mode === 'router-neighbor-err-rate-msg-high'
          || mode === 'router-neighbor-rss-very-low'
          || mode === 'router-neighbor-rss-low'
          || mode === 'router-neighbor-rss-medium'
          || mode === 'router-neighbor-rss-high';
      }

      function routerNeighborRowMatchesDiagnosticFilter(row, mode) {
        const fp = toFiniteNumber(row?.err_rate_frame_pct);
        const mp = toFiniteNumber(row?.err_rate_msg_pct);
        const rss = toFiniteNumber(row?.rss_ave);
        if (mode === 'router-neighbor-err-rate-frame-low') return Number.isFinite(fp) && fp >= 2;
        if (mode === 'router-neighbor-err-rate-frame-medium') return Number.isFinite(fp) && fp >= 5;
        if (mode === 'router-neighbor-err-rate-frame-high') return Number.isFinite(fp) && fp >= 10;
        if (mode === 'router-neighbor-err-rate-msg-low') return Number.isFinite(mp) && mp >= 2;
        if (mode === 'router-neighbor-err-rate-msg-medium') return Number.isFinite(mp) && mp >= 5;
        if (mode === 'router-neighbor-err-rate-msg-high') return Number.isFinite(mp) && mp >= 10;
        if (mode === 'router-neighbor-rss-very-low') return Number.isFinite(rss) && rss < -80;
        if (mode === 'router-neighbor-rss-low') return Number.isFinite(rss) && rss >= -80 && rss < -70;
        if (mode === 'router-neighbor-rss-medium') return Number.isFinite(rss) && rss >= -70 && rss <= -60;
        if (mode === 'router-neighbor-rss-high') return Number.isFinite(rss) && rss > -60;
        return false;
      }

      function areNodeIdsEquivalent(a, b) {
        return toText(a).toLowerCase() === toText(b).toLowerCase();
      }

      // ── Shared phantom-edge helper (clusters isolated unknown nodes) ──────────

      function groupIsolatedUnknownNodes(nodeData, edgeData, edgeMap) {
        const nodeDegree = new Map();
        for (const edge of edgeData) {
          nodeDegree.set(edge.from, (nodeDegree.get(edge.from) || 0) + 1);
          nodeDegree.set(edge.to, (nodeDegree.get(edge.to) || 0) + 1);
        }
        const connectedAnchorId = (function chooseConnectedAnchorId() {
          const knownCandidates = nodeData
            .filter((n) => n.group !== 'unknown' && (nodeDegree.get(n.id) || 0) > 0)
            .sort((a, b) => (nodeDegree.get(b.id) || 0) - (nodeDegree.get(a.id) || 0));
          return knownCandidates.length > 0 ? knownCandidates[0].id : '';
        })();

        function clusterIsolatedNodeIds(nodeIds, options = {}) {
          if (nodeIds.length === 0) return;
          const {
            clusterLength = 80,
            anchorLength = 180,
            anchorId = ''
          } = options;

          if (nodeIds.length > 1) {
            const anchorNodeId = nodeIds[0];
            for (let i = 1; i < nodeIds.length; i += 1) {
              addEdge(edgeMap, edgeData, anchorNodeId, nodeIds[i], {
                hidden: true, physics: true, length: clusterLength, color: { opacity: 0 }
              });
            }
          }

          if (anchorId) {
            addEdge(edgeMap, edgeData, nodeIds[0], anchorId, {
              hidden: true, physics: true, length: anchorLength, color: { opacity: 0 }
            });
          }
        }

        const unknownIds = nodeData
          .filter((n) => n.group === 'unknown' && (nodeDegree.get(n.id) || 0) === 0)
          .map((n) => n.id);
        clusterIsolatedNodeIds(unknownIds, { clusterLength: 60, anchorLength: 180, anchorId: connectedAnchorId });

        const knownIsolatedIds = nodeData
          .filter((n) => n.group !== 'unknown' && (nodeDegree.get(n.id) || 0) === 0)
          .map((n) => n.id);
        clusterIsolatedNodeIds(knownIsolatedIds, { clusterLength: 110, anchorLength: 240, anchorId: connectedAnchorId });

        return nodeDegree;
      }

      // ── Shared vis nodeData builder ───────────────────────────────────────────

      function buildVisNodeData(nodeMap, routerIdsWithChildren, routerNeighborByRloc16, labelFn) {
        return Array.from(nodeMap.values()).map((node) => {
          const displayName = toText(node.device_label) || toText(node.name);
          const unknown = isUnknownNodeName(displayName);
          const effectiveShape = unknown ? 'ellipse' : node.shape;
          const rloc16Text = toText(node.rloc16).toLowerCase();
          const neighborStats = computeRouterNeighborStats(
            routerNeighborByRloc16.get(rloc16Text)?.router_neighbor_table
          );
          const isRouter = effectiveShape !== 'ellipse';
          const hasChildren = routerIdsWithChildren.has(node.id);
          const isMainRouter = rloc16Text.endsWith('00');
          const isBorderRouter = isMainRouter && node.br === true;
          let borderWidth = 1;
          let fontSize = 13;
          let widthConstraint = { minimum: 109, maximum: 109 };
          let heightConstraint = { minimum: 41, maximum: 41 };
          if (isBorderRouter) { borderWidth = 5; fontSize = 19.5; }
          else if (isRouter) { borderWidth = 3; fontSize = 19.5; }
          if (isRouter) {
            widthConstraint = { minimum: 187, maximum: 187 };
            heightConstraint = { minimum: 77, maximum: 77 };
          }
          return {
            id: node.id,
            label: labelFn(node),
            shape: effectiveShape,
            color: node.color,
            font: { size: fontSize, face: 'monospace', multi: 'md' },
            heightConstraint,
            widthConstraint,
            group: unknown ? 'unknown' : 'known',
            isRouter, hasChildren, isMainRouter, isBorderRouter, borderWidth,
            iftotalpktserrorsdiscards_pct: node.iftotalpktserrorsdiscards_pct,
            iftotalerrors_pct: node.iftotalerrors_pct,
            mode_device: node.mode_device,
            partitionidchanges: node.partitionidchanges,
            parentchanges: node.parentchanges,
            router_neighbor_max_err_rate_frame_pct: neighborStats.router_neighbor_max_err_rate_frame_pct,
            router_neighbor_max_err_rate_msg_pct: neighborStats.router_neighbor_max_err_rate_msg_pct,
            router_neighbor_min_rss_ave: neighborStats.router_neighbor_min_rss_ave,
            router_neighbor_max_rss_ave: neighborStats.router_neighbor_max_rss_ave,
            router_neighbor_has_rss_very_low: neighborStats.router_neighbor_has_rss_very_low,
            router_neighbor_has_rss_low: neighborStats.router_neighbor_has_rss_low,
            router_neighbor_has_rss_medium: neighborStats.router_neighbor_has_rss_medium,
            router_neighbor_has_rss_high: neighborStats.router_neighbor_has_rss_high
          };
        });
      }

      // ── Adaptor 1: meshdiag + networkdiag + routerNeighbors + restApi ─────────

      function adaptMeshdiagNetworkdiag(rawFiles) {
        const meshdiag = Array.isArray(rawFiles[0]) ? rawFiles[0] : [];
        const networkDiag = Array.isArray(rawFiles[1]) ? rawFiles[1] : [];
        const routerNeighborTables = Array.isArray(rawFiles[2]) ? rawFiles[2] : [];
        const restApiRaw = rawFiles[3];
        const restApiDiagnostics = (restApiRaw && Array.isArray(restApiRaw.data))
          ? restApiRaw.data
              .map((item) => ({ id: item.id, type: item.type, ...(item.attributes || {}) }))
              .filter((item) => item && typeof item === 'object')
          : [];

        const nodeMap = new Map();
        const meshdiagById = new Map();
        const networkDiagById = new Map();
        const restApiById = new Map();
        const meshIdToUnifiedId = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        function upsertNode(nodeId, rawNode, style) {
          const existing = nodeMap.get(nodeId);
          const rawIpv6 = Array.isArray(rawNode.ipv6_addrs) ? rawNode.ipv6_addrs : [];
          const existingIpv6 = existing && Array.isArray(existing.ipv6_addrs) ? existing.ipv6_addrs : [];
          const mergedIpv6 = rawIpv6.length > 0 ? rawIpv6 : existingIpv6;
          const rawChildren = Array.isArray(rawNode.children) ? rawNode.children : [];
          const rawPacketErrorDiscardPct = rawNode.mac_counters && Number.isFinite(rawNode.mac_counters.iftotalpktserrorsdiscards_pct)
            ? rawNode.mac_counters.iftotalpktserrorsdiscards_pct : undefined;
          const rawTotalErrorsPct = rawNode.mac_counters && Number.isFinite(rawNode.mac_counters.iftotalerrors_pct)
            ? rawNode.mac_counters.iftotalerrors_pct : undefined;
          const rawModeDevice = rawNode.mode && toText(rawNode.mode.device)
            ? toText(rawNode.mode.device)
            : (rawNode.mode?.deviceTypeFTD === true ? 'FTD' : (rawNode.mode?.deviceTypeFTD === false ? 'MTD' : ''));
          const rawPartitionIdChanges = rawNode.mle_counters && Number.isFinite(rawNode.mle_counters.partitionidchanges)
            ? rawNode.mle_counters.partitionidchanges : undefined;
          const rawParentChanges = rawNode.mle_counters && Number.isFinite(rawNode.mle_counters.parentchanges)
            ? rawNode.mle_counters.parentchanges : undefined;
          const merged = {
            id: nodeId,
            device_label: toText(rawNode.device_label) || (existing ? existing.device_label : ''),
            rloc16: toText(rawNode.rloc16) || (existing ? existing.rloc16 : ''),
            source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
            extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
            type: toText(rawNode.type) || (existing ? existing.type : ''),
            thread_stack_version: toText(rawNode.thread_stack_version) || (existing ? existing.thread_stack_version : ''),
            ipv6_addrs: mergedIpv6,
            total_children: Number.isFinite(rawNode.total_children)
              ? rawNode.total_children : (rawChildren.length || (existing ? existing.total_children : 0)),
            total_links: Number.isFinite(rawNode.total_links) ? rawNode.total_links : (existing ? existing.total_links : 0),
            iftotalpktserrorsdiscards_pct: Number.isFinite(rawPacketErrorDiscardPct) ? rawPacketErrorDiscardPct
              : (existing && Number.isFinite(existing.iftotalpktserrorsdiscards_pct) ? existing.iftotalpktserrorsdiscards_pct : undefined),
            iftotalerrors_pct: Number.isFinite(rawTotalErrorsPct) ? rawTotalErrorsPct
              : (existing && Number.isFinite(existing.iftotalerrors_pct) ? existing.iftotalerrors_pct : undefined),
            mode_device: rawModeDevice || (existing ? existing.mode_device : ''),
            partitionidchanges: Number.isFinite(rawPartitionIdChanges) ? rawPartitionIdChanges
              : (existing && Number.isFinite(existing.partitionidchanges) ? existing.partitionidchanges : undefined),
            parentchanges: Number.isFinite(rawParentChanges) ? rawParentChanges
              : (existing && Number.isFinite(existing.parentchanges) ? existing.parentchanges : undefined),
            br: rawNode.br === true || (existing ? existing.br === true : false),
            from_meshdiag: (style.source === 'meshdiag') || (existing ? existing.from_meshdiag === true : false),
            from_networkdiagnostic: (style.source === 'networkdiagnostic') || (existing ? existing.from_networkdiagnostic === true : false),
            shape: style.shape || (existing ? existing.shape : 'box'),
            color: style.color || (existing ? existing.color : { background: '#d9ecff', border: '#1565c0' })
          };
          if (merged.br) merged.color = { background: '#ffd9d9', border: '#c62828' };
          nodeMap.set(nodeId, merged);
        }

        function ensureNode(nodeId, rawNode, style) {
          if (!nodeId) return '';
          if (!nodeMap.has(nodeId)) upsertNode(nodeId, rawNode, style);
          return nodeId;
        }

        meshdiag.forEach((node, index) => {
          const uid = chooseNodeId(node, 'meshdiag-node', index + 1);
          meshdiagById.set(uid, node);
          const meshRawId = toText(node.id);
          if (meshRawId) meshIdToUnifiedId.set(meshRawId, uid);
          upsertNode(uid, node, {
            source: 'meshdiag', shape: 'box',
            color: node.br ? { background: '#ffd9d9', border: '#c62828' } : { background: '#d9ecff', border: '#1565c0' }
          });
        });

        networkDiag.forEach((node, index) => {
          const uid = chooseNodeId(node, 'netdiag-node', index + 1);
          networkDiagById.set(uid, node);
          upsertNode(uid, node, { source: 'networkdiagnostic', shape: 'box', color: { background: '#d9ecff', border: '#1565c0' } });
        });

        restApiDiagnostics.forEach((node, index) => {
          const uid = chooseNodeId(node, 'restapi-node', index + 1);
          restApiById.set(uid, node);
          upsertNode(uid, node, { source: 'networkdiagnostic', shape: 'box', color: { background: '#d9ecff', border: '#1565c0' } });
        });

        routerNeighborTables.forEach((row) => {
          const rloc16 = toText(row.rloc16).toLowerCase();
          if (rloc16) routerNeighborByRloc16.set(rloc16, row);
        });

        for (const node of meshdiag) {
          const fromId = chooseNodeId(node, 'meshdiag-parent', 0);
          (Array.isArray(node.children) ? node.children : []).forEach((child, ci) => {
            const childId = toText(child.rloc16) || `${fromId}-child-${ci + 1}`;
            upsertNode(childId, { device_label: toText(child.device_label), rloc16: toText(child.rloc16), id: childId },
              { source: 'meshdiag', shape: 'ellipse', color: { background: '#fff4cc', border: '#d9a400' } });
            addEdge(edgeMap, edgeData, fromId, childId, { dashes: true, isParentChild: true, linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN] });
            routerIdsWithChildren.add(fromId);
          });

          const linkStyleByField = { '1_links': { width: 1 }, '2_links': { width: 2 }, '3_links': { width: 4 } };
          ['3_links', '2_links', '1_links'].forEach((field) => {
            (Array.isArray(node[field]) ? node[field] : []).forEach((link) => {
              const linkMeshId = toText(link.id);
              const toId = meshIdToUnifiedId.get(linkMeshId) || toText(link.rloc16) || linkMeshId;
              if (!toId) return;
              if (!nodeMap.has(toId)) {
                upsertNode(toId, { device_label: toText(link.device_label), rloc16: toText(link.rloc16), id: linkMeshId || toId },
                  { source: 'meshdiag', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } });
              }
              addEdge(edgeMap, edgeData, fromId, toId, {
                ...(linkStyleByField[field] || {}),
                linkCategories: [field === '3_links' ? EDGE_CATEGORY_DEFAULT_3 : field === '2_links' ? EDGE_CATEGORY_DEFAULT_2 : EDGE_CATEGORY_DEFAULT_1]
              });
            });
          });

          const neighborRow = routerNeighborByRloc16.get(toText(node.rloc16).toLowerCase());
          (Array.isArray(neighborRow?.router_neighbor_table) ? neighborRow.router_neighbor_table : []).forEach((neighbor) => {
            const toId = ensureNode(
              toText(neighbor.rloc16) || toText(neighbor.extaddr),
              { rloc16: toText(neighbor.rloc16), extaddr: toText(neighbor.extaddr), device_label: toText(neighbor.device_label),
                id: toText(neighbor.rloc16) || toText(neighbor.extaddr) },
              { source: 'meshdiag', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } }
            );
            addEdge(edgeMap, edgeData, fromId, toId, { width: 1.5, linkCategories: [EDGE_CATEGORY_ROUTER_NEIGHBOR] });
          });
        }

        for (const node of networkDiag) {
          const fromId = chooseNodeId(node, 'netdiag-parent', 0);
          (Array.isArray(node.children) ? node.children : []).forEach((child, ci) => {
            const childId = toText(child.rloc16) || `${fromId}-child-${ci + 1}`;
            upsertNode(childId, { device_label: toText(child.device_label), rloc16: toText(child.rloc16), id: childId },
              { source: 'networkdiagnostic', shape: 'ellipse', color: { background: '#fff4cc', border: '#d9a400' } });
            addEdge(edgeMap, edgeData, fromId, childId, { dashes: true, isParentChild: true, linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN] });
            routerIdsWithChildren.add(fromId);
          });
        }

        restApiDiagnostics.forEach((node) => {
          const fromId = chooseNodeId(node, 'restapi-parent', 0);
          (Array.isArray(node.route?.routeData) ? node.route.routeData : []).forEach((route) => {
            const toRloc16 = buildMainRouterRloc16(route.routeId);
            const toId = ensureNode(toRloc16, { rloc16: toRloc16, id: toRloc16, device_label: toRloc16 },
              { source: 'networkdiagnostic', shape: 'box', color: { background: '#d9ecff', border: '#1565c0' } });
            addEdge(edgeMap, edgeData, fromId, toId, { width: 1.5, linkCategories: [EDGE_CATEGORY_OTBR_ROUTE] });
          });
          (Array.isArray(node.childTable) ? node.childTable : []).forEach((child, ci) => {
            const childRloc16 = buildChildRloc16(node.rloc16, child.childId);

              childRloc16 || `${fromId}-rest-child-${ci + 1}`,
              { rloc16: childRloc16, id: childRloc16 || `${fromId}-rest-child-${ci + 1}`,
                device_label: childRloc16 || `${fromId} child ${child.childId}` },

            routerIdsWithChildren.add(fromId);

        });

        const nodeData = buildVisNodeData(nodeMap, routerIdsWithChildren, routerNeighborByRloc16, buildLabel);

        const rawByIdForDetails = new Map();
        nodeMap.forEach((_, id) => {
          const m = meshdiagById.get(id) || {};
          const n = networkDiagById.get(id) || {};
          const r = restApiById.get(id) || {};
          rawByIdForDetails.set(id, mergeForDisplay(mergeForDisplay(m, n), r));
        });

        const sourceNames = [];
        if (meshdiag.length > 0) sourceNames.push('meshdiag');
        if (networkDiag.length > 0) sourceNames.push('networkdiagnostic');
        if (routerNeighborTables.length > 0) sourceNames.push('routerneighbortables');
        if (restApiDiagnostics.length > 0) sourceNames.push('restapi');

        groupIsolatedUnknownNodes(nodeData, edgeData, edgeMap);

        return { nodeData, edgeData, nodeMap, rawByIdForDetails, routerNeighborByRloc16, sourceNames };
      }

      // ── Adaptor 2: Eve topology ───────────────────────────────────────────────

      function adaptEve(rawFiles) {
