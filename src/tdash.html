            total_links: Number.isFinite(rawNode.total_links) ? rawNode.total_links : (existing ? existing.total_links : 0),
            iftotalpktserrorsdiscards_pct: Number.isFinite(rawNode.mac_counters?.iftotalpktserrorsdiscards_pct)

            iftotalerrors_pct: Number.isFinite(rawNode.mac_counters?.iftotalerrors_pct)

        }

        eveArray.forEach((node) => {
          const eveNodeId = toText(node.id);
          if (!eveNodeId) return;

              : (isChildType ? { background: '#fff4cc', border: '#d9a400' } : { background: '#e8f5e9', border: '#2e7d32' })
          });
        });

        for (const node of eveArray) {
          const fromId = toText(node.id);
          if (!fromId) continue;
          (Array.isArray(node.routes) ? node.routes : []).forEach((route) => {
            const toId = toText(route.to);
            if (!toId) return;
            if (!nodeMap.has(toId)) {
              upsertEveNode(toId, { id: toId }, { source: 'eve', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } });
            }
            const lqiIn = toFiniteNumber(route.in);
            const lqiOut = toFiniteNumber(route.out);
            const avgLqi = (Number.isFinite(lqiIn) && Number.isFinite(lqiOut)) ? (lqiIn + lqiOut) / 2 : (lqiIn || lqiOut);
            let edgeWidth = 1.5;
            if (Number.isFinite(avgLqi)) {

      }

      // ── Adaptor 2b: Eve native topology (Eve Thread Network Layout.evethreadlayout) ───

      function adaptEveNative(rawFiles) {
        const raw = rawFiles[0];
        // Native file shape: { version, nodes: [...] }
        // Fall back gracefully if the loader already normalised it to a plain array.
        const eveArray = (raw && Array.isArray(raw.nodes)) ? raw.nodes
          : (Array.isArray(raw) ? raw
          : (raw && typeof raw === 'object' ? Object.values(raw) : []));

        const nodeMap = new Map();
        const eveNodeById = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        // Native rloc16 is a decimal integer; convert to canonical hex string '0xNNNN'.
        function nativeRloc16ToHex(value) {
          const n = toFiniteNumber(value);
          if (!Number.isFinite(n)) return '';
          return `0x${n.toString(16).padStart(4, '0')}`;
        }

        function upsertEveNativeNode(nodeId, rawNode, style) {
          const existing = nodeMap.get(nodeId);
          const rloc16Hex = nativeRloc16ToHex(rawNode.rloc16) || (existing ? existing.rloc16 : '');
          const merged = {
            id: nodeId,
            name: toText(rawNode.name) || (existing ? existing.name : ''),
            device_label: toText(rawNode.device_label) || toText(rawNode.name) || (existing ? existing.device_label : ''),
            rloc16: rloc16Hex,
            source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
            extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
            type: toText(rawNode.type) || (existing ? existing.type : ''),
            room: toText(rawNode.room) || (existing ? existing.room : ''),
            ip_addresses: Array.isArray(rawNode.ip_addresses) ? rawNode.ip_addresses
              : (existing ? existing.ip_addresses : []),
            threadNetworks: Array.isArray(rawNode.threadNetworks) ? rawNode.threadNetworks

            mode_device: rawNode.type === 'router' ? 'FTD'
              : (rawNode.type === 'child' || rawNode.type === 'sleepy-child' ? 'MTD' : '')
              || (existing ? existing.mode_device : ''),
            br: rawNode.br === true || (existing ? existing.br === true : false),

          };
          if (merged.br) merged.color = { background: '#ffd9d9', border: '#c62828' };
          nodeMap.set(nodeId, merged);
        }

        // Pass 1: register all nodes
        eveArray.forEach((node) => {
          const eveNodeId = toText(node.id);
          if (!eveNodeId) return;
          eveNodeById.set(eveNodeId, node);
          const isChildType = node.type === 'child' || node.type === 'sleepy-child';
          upsertEveNativeNode(eveNodeId, node, {
            source: 'eve_native',
            shape: isChildType ? 'ellipse' : 'box',

              : (isChildType ? { background: '#fff4cc', border: '#d9a400' } : { background: '#e8f5e9', border: '#2e7d32' })
          });
        });

        // Pass 2: build edges from routes[] and children[]
        for (const node of eveArray) {
          const fromId = toText(node.id);
          if (!fromId) continue;

          (Array.isArray(node.routes) ? node.routes : []).forEach((route) => {
            const toId = toText(route.to);
            if (!toId) return;
            if (!nodeMap.has(toId)) {
              upsertEveNativeNode(toId, { id: toId }, { source: 'eve_native', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } });
            }
            const lqiIn = toFiniteNumber(route.in);
            const lqiOut = toFiniteNumber(route.out);
            const avgLqi = (Number.isFinite(lqiIn) && Number.isFinite(lqiOut)) ? (lqiIn + lqiOut) / 2 : (lqiIn || lqiOut);
            let edgeWidth = 1.5;
            if (Number.isFinite(avgLqi)) {
              if (avgLqi >= 3) edgeWidth = 3;
              else if (avgLqi >= 2) edgeWidth = 2;
            }

      }

      // ── Adaptor 3: Merged detailed topology ───────────────────────────────────

      function adaptMergedDetailed(rawFiles) {
        const rows = Array.isArray(rawFiles[0]) ? rawFiles[0] : [];
        const nodeMap = new Map();
        const rawNodeById = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        function isMergedRowEveOnly(node) {
          const sources = Array.isArray(node?._sources) ? node._sources : [];
          if (!sources.includes('td-eve-topology.json')) return false;
          return !sources.some((s) => s === 'td-otbr-cli-router-table.json'
            || s === 'td-otbr-cli-meshdiag-topology.json'
            || s === 'td-otbr-cli-networkdiag-topology.json'
            || s === 'td-otbr-cli-meshdiag-router-neighbortables.json'
            || s === 'td-otbr-restapi-devices.json'
            || s === 'td-otbr-restapi-diagnostics.json');
        }

        function chooseMergedId(node, index) {
          return toText(node.rloc16) || toText(node.id) || toText(node.extaddr) || `merged-node-${index + 1}`;
        }

        function upsertMergedNode(nodeId, rawNode, style) {
          const existing = nodeMap.get(nodeId);
          const merged = {
            id: nodeId,
            name: toText(rawNode.name) || (existing ? existing.name : ''),
            device_label: toText(rawNode.device_label) || (existing ? existing.device_label : ''),
            rloc16: toText(rawNode.rloc16) || (existing ? existing.rloc16 : ''),
            source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
            extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
            type: toText(rawNode.type) || (existing ? existing.type : ''),
            thread_stack_version: toText(rawNode.thread_stack_version) || (existing ? existing.thread_stack_version : ''),
            total_children: Number.isFinite(rawNode.total_children) ? rawNode.total_children : (existing ? existing.total_children : 0),
            total_links: Number.isFinite(rawNode.total_links) ? rawNode.total_links : (existing ? existing.total_links : 0),
            iftotalpktserrorsdiscards_pct: Number.isFinite(rawNode.mac_counters?.iftotalpktserrorsdiscards_pct)
              ? rawNode.mac_counters.iftotalpktserrorsdiscards_pct : (existing?.iftotalpktserrorsdiscards_pct),
            iftotalerrors_pct: Number.isFinite(rawNode.mac_counters?.iftotalerrors_pct)
              ? rawNode.mac_counters.iftotalerrors_pct : (existing?.iftotalerrors_pct),
            mode_device: toText(rawNode['mode.device']) || toText(rawNode.mode?.device) || (existing ? existing.mode_device : ''),
            partitionidchanges: Number.isFinite(rawNode.mle_counters?.partitionidchanges)
              ? rawNode.mle_counters.partitionidchanges : (existing?.partitionidchanges),
            parentchanges: Number.isFinite(rawNode.mle_counters?.parentchanges)
              ? rawNode.mle_counters.parentchanges : (existing?.parentchanges),
            br: rawNode.br === true || (existing ? existing.br === true : false),
            from_merged_detailed: true,
            shape: style.shape || (existing ? existing.shape : 'box'),
            color: style.color || (existing ? existing.color : { background: '#e8f5e9', border: '#2e7d32' })
          };
          if (merged.br) merged.color = { background: '#ffd9d9', border: '#c62828' };
          nodeMap.set(nodeId, merged);
        }

        function ensureNodeForLink(linkNode, fallbackId) {
          const candidateId = toText(linkNode.rloc16) || toText(linkNode.id) || toText(fallbackId);
          if (!candidateId) return '';
          if (!nodeMap.has(candidateId)) {
            upsertMergedNode(candidateId, {
              rloc16: toText(linkNode.rloc16), id: toText(linkNode.id) || candidateId,
              device_label: toText(linkNode.device_label), name: toText(linkNode.name)
            }, { source: 'merged-detailed', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } });
          }
          return candidateId;
        }

        rows.forEach((node, index) => {
          if (isMergedRowEveOnly(node)) return;
          const nodeId = chooseMergedId(node, index);
          rawNodeById.set(nodeId, node);
          const rloc16Text = toText(node.rloc16).toLowerCase();
          const modeDevice = toText(node['mode.device'] || node.mode?.device).toUpperCase();
          const isRouterLike = rloc16Text.endsWith('00') || modeDevice === 'FTD' || toText(node.type).toLowerCase() === 'router';
          const isChildLike = modeDevice === 'MTD' || toText(node.type).toLowerCase().includes('child');
          upsertMergedNode(nodeId, node, {
            source: 'merged-detailed',
            shape: isChildLike && !isRouterLike ? 'ellipse' : 'box',
            color: isChildLike && !isRouterLike ? { background: '#fff4cc', border: '#d9a400' } : { background: '#e8f5e9', border: '#2e7d32' }
          });
          // populate routerNeighborByRloc16 for filter support
          if (Array.isArray(node.router_neighbor_table) && rloc16Text) {
            routerNeighborByRloc16.set(rloc16Text, node);
          }
        });

        rows.forEach((node, index) => {
          if (isMergedRowEveOnly(node)) return;
          const fromId = chooseMergedId(node, index);
          [{ key: '3_links', width: 4 }, { key: '2_links', width: 2 }, { key: '1_links', width: 1 }].forEach((f) => {
            (Array.isArray(node[f.key]) ? node[f.key] : []).forEach((link) => {
              const toId = ensureNodeForLink(link, link.rloc16 || link.id);
              if (!toId) return;
              addEdge(edgeMap, edgeData, fromId, toId, {
                width: f.width,
                linkCategories: [f.key === '3_links' ? EDGE_CATEGORY_DEFAULT_3 : f.key === '2_links' ? EDGE_CATEGORY_DEFAULT_2 : EDGE_CATEGORY_DEFAULT_1],
                edgeKeySuffix: `merged-${f.key}`
              });
            });
          });
          (Array.isArray(node.router_neighbor_table) ? node.router_neighbor_table : []).forEach((neighbor) => {
            const toId = ensureNodeForLink(neighbor, neighbor.rloc16 || neighbor.extaddr || neighbor.id);
            if (!toId) return;
            addEdge(edgeMap, edgeData, fromId, toId, { width: 1.5, linkCategories: [EDGE_CATEGORY_ROUTER_NEIGHBOR], edgeKeySuffix: 'merged-router-neighbor' });
          });
          (Array.isArray(node.route?.routeData) ? node.route.routeData : []).forEach((route) => {
            const toRloc16 = buildMainRouterRloc16(route.routeId);
            const toId = ensureNodeForLink({ rloc16: toRloc16, id: toRloc16, device_label: toRloc16 }, toRloc16);
            if (!toId) return;
            addEdge(edgeMap, edgeData, fromId, toId, { width: 1.5, linkCategories: [EDGE_CATEGORY_OTBR_ROUTE], edgeKeySuffix: 'merged-otbr-route' });
          });
          (Array.isArray(node.childTable) ? node.childTable : []).forEach((child, ci) => {
            const childRloc16 = buildChildRloc16(node.rloc16, child.childId);
            const childId = ensureNodeForLink(
              { rloc16: childRloc16, id: childRloc16 || `${fromId}-rest-child-${ci + 1}`, device_label: childRloc16 || `${fromId} child ${child.childId}` },
              childRloc16 || `${fromId}-rest-child-${ci + 1}`
            );
            if (!childId) return;
            addEdge(edgeMap, edgeData, fromId, childId, { dashes: true, isParentChild: true, linkCategories: [EDGE_CATEGORY_OTBR_CHILD], edgeKeySuffix: 'merged-otbr-child' });
            routerIdsWithChildren.add(fromId);
          });
          (Array.isArray(node.children) ? node.children : []).forEach((child, ci) => {
            const childNode = typeof child === 'string' ? { id: child } : (child || {});
            if (typeof child === 'string' || toText(childNode.id)) return; // skip eve-only string children
            const childId = ensureNodeForLink(childNode, `${fromId}-child-${ci + 1}`);
            if (!childId) return;
            addEdge(edgeMap, edgeData, fromId, childId, { dashes: true, isParentChild: true, linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN], edgeKeySuffix: 'merged-default-child' });
            routerIdsWithChildren.add(fromId);
          });
        });

        const nodeData = buildVisNodeData(nodeMap, routerIdsWithChildren, routerNeighborByRloc16, buildLabel);

        const rawByIdForDetails = new Map(rawNodeById);

        groupIsolatedUnknownNodes(nodeData, edgeData, edgeMap);

        return { nodeData, edgeData, nodeMap, rawByIdForDetails, routerNeighborByRloc16, sourceNames: ['merged-detailed'] };
      }

      // ── Adaptor 4: Router table (Nodes from ID/rloc16, edges from Next Hop) ───

      function adaptRouterTable(rawFiles) {
        const rows = Array.isArray(rawFiles[0]) ? rawFiles[0] : [];
        const nodeMap = new Map();
        const rawByIdForDetails = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        // Index rows by rloc16 for next-hop lookup
        const byRloc16 = new Map();
        rows.forEach((row) => {
          const rloc16 = getCanonicalRloc16(row);
          if (rloc16) byRloc16.set(rloc16, row);
        });

        rows.forEach((row) => {
          const nodeId = toText(row.rloc16) || getCanonicalExtaddr(row);
          if (!nodeId) return;
          const isBr = toText(nodeId).toLowerCase().endsWith('00');
          nodeMap.set(nodeId, {
            id: nodeId,
            device_label: toText(row.device_label),
            rloc16: toText(row.rloc16),
            extaddr: getCanonicalExtaddr(row),
            type: 'router',
            mode_device: 'FTD',
            br: isBr,
            shape: 'box',
            color: isBr ? { background: '#ffd9d9', border: '#c62828' } : { background: '#d9ecff', border: '#1565c0' }
          });
          rawByIdForDetails.set(nodeId, row);
        });

        // Build edges: row.rloc16 → rloc16 of Next Hop router ID
        rows.forEach((row) => {
          const fromId = toText(row.rloc16);
          if (!fromId) return;

          // "Next Hop" is a router ID integer → convert to rloc16
          const nextHopId = toFiniteNumber(row['Next Hop']);
          if (Number.isFinite(nextHopId)) {
            const toRloc16 = buildMainRouterRloc16(nextHopId);
            const toRow = byRloc16.get(toRloc16.toLowerCase());
            if (toRow && toRloc16 && toRloc16 !== fromId) {
              const lqOut = toFiniteNumber(row['LQ Out']);
              const edgeWidth = Number.isFinite(lqOut) ? (lqOut >= 3 ? 4 : lqOut >= 2 ? 2 : 1) : 1.5;
              addEdge(edgeMap, edgeData, fromId, toRloc16, {
                width: edgeWidth,
                linkCategories: [EDGE_CATEGORY_DEFAULT_1]
              });
            }
          }
        });

        const nodeData = buildVisNodeData(nodeMap, routerIdsWithChildren, routerNeighborByRloc16, buildLabel);

        groupIsolatedUnknownNodes(nodeData, edgeData, edgeMap);

        return { nodeData, edgeData, nodeMap, rawByIdForDetails, routerNeighborByRloc16, sourceNames: ['router-table'] };
      }

      // ── Adaptor 5: Raw array generic fallback ─────────────────────────────────

      function adaptRawArray(rawFiles) {
        const raw = rawFiles.find((f) => f !== null);
        const rows = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' ? Object.values(raw) : []);
        const nodeMap = new Map();
        const rawByIdForDetails = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        rows.forEach((row, index) => {
          if (!isPlainObject(row)) return;
          const nodeId = chooseNodeId(row, 'raw-node', index + 1);
          const rloc16Text = toText(row.rloc16).toLowerCase();
          const isBr = row.br === true || (rloc16Text.endsWith('00') && row.br === true);
          const isChildLike = toText(row.type).toLowerCase().includes('child');
          nodeMap.set(nodeId, {
            id: nodeId,
            device_label: toText(row.device_label),
            name: toText(row.name),
            rloc16: toText(row.rloc16),
            extaddr: getCanonicalExtaddr(row),
            type: toText(row.type),
            mode_device: toText(row.mode?.device) || (row.type === 'router' ? 'FTD' : (isChildLike ? 'MTD' : '')),
            iftotalpktserrorsdiscards_pct: row.mac_counters?.iftotalpktserrorsdiscards_pct,
            iftotalerrors_pct: row.mac_counters?.iftotalerrors_pct,
            partitionidchanges: row.mle_counters?.partitionidchanges,
            parentchanges: row.mle_counters?.parentchanges,
            br: row.br === true,
            shape: isChildLike ? 'ellipse' : 'box',
            color: isBr ? { background: '#ffd9d9', border: '#c62828' }
              : (isChildLike ? { background: '#fff4cc', border: '#d9a400' } : { background: '#d9ecff', border: '#1565c0' })
          });
          rawByIdForDetails.set(nodeId, row);
          if (Array.isArray(row.router_neighbor_table) && rloc16Text) {
            routerNeighborByRloc16.set(rloc16Text, row);
          }
        });

        rows.forEach((row, index) => {
          if (!isPlainObject(row)) return;
          const fromId = chooseNodeId(row, 'raw-node', index + 1);
          // children[] → dashed edges
          (Array.isArray(row.children) ? row.children : []).forEach((child) => {
            const childId = typeof child === 'string' ? child
              : (toText(child.rloc16) || toText(child.id));
            if (!childId || !nodeMap.has(childId)) return;
            addEdge(edgeMap, edgeData, fromId, childId, { dashes: true, isParentChild: true, linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN] });
            routerIdsWithChildren.add(fromId);
          });
          // routes[] → solid edges
          (Array.isArray(row.routes) ? row.routes : []).forEach((route) => {
            const toId = toText(route.to);
            if (!toId || !nodeMap.has(toId)) return;
            addEdge(edgeMap, edgeData, fromId, toId, { linkCategories: [EDGE_CATEGORY_EVE_ROUTE] });
          });
        });

        const nodeData = buildVisNodeData(nodeMap, routerIdsWithChildren, routerNeighborByRloc16, buildLabel);

        groupIsolatedUnknownNodes(nodeData, edgeData, edgeMap);

        return { nodeData, edgeData, nodeMap, rawByIdForDetails, routerNeighborByRloc16, sourceNames: ['raw-array'] };
      }

      // ── Adaptor 6: OTBR REST API (devices + diagnostics) ──────────────────────
      //
      // Both files use { "data": [ { "id", "type", "attributes": {...} } ] } shape.
      // Devices provide: extAddress, mlEidIid, omrIpv6Address, hostName, role, mode.
      // Diagnostics provide: extAddress, rloc16, route.routeData[], childTable[].
      // Primary node ID = extAddress (lowercase). Merged by extAddress identity.

      function adaptOtbrRestApi(rawFiles) {
        const devicesData = (rawFiles[0] && Array.isArray(rawFiles[0].data)) ? rawFiles[0].data : [];
        const diagData = (rawFiles[1] && Array.isArray(rawFiles[1].data)) ? rawFiles[1].data : [];

        // Flatten each item: merge top-level fields + attributes sub-object
        function flattenRestApiItem(item) {
          if (!isPlainObject(item)) return item;
          const attrs = isPlainObject(item.attributes) ? item.attributes : {};
          return { ...item, ...attrs };
        }

        const devices = devicesData.map(flattenRestApiItem);
        const diagnostics = diagData.map(flattenRestApiItem);

        const nodeMap = new Map();
        const rawByIdForDetails = new Map();
        const rloc16ToNodeId = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        function upsertOtbrRestApiNode(nodeId, rawNode, style) {
          const existing = nodeMap.get(nodeId);
          const roleText = toText(rawNode.role).toLowerCase();
          const isChildLike = roleText === 'child' || roleText.includes('sleepy');
          const modeDevice = rawNode.mode?.deviceTypeFTD === true ? 'FTD'
            : (rawNode.mode?.deviceTypeFTD === false ? 'MTD' : (existing ? existing.mode_device : ''));
          const rloc16Val = toText(rawNode.rloc16) || (existing ? existing.rloc16 : '');
          const extaddrVal = toText(rawNode.extAddress || rawNode.extaddr).toLowerCase() || (existing ? existing.extaddr : '');
          const merged = {
            id: nodeId,
            device_label: toText(rawNode.hostName) || (existing ? existing.device_label : ''),
            name: toText(rawNode.hostName) || (existing ? existing.name : ''),
            rloc16: rloc16Val,
            extaddr: extaddrVal,
            type: roleText || toText(rawNode.type) || (existing ? existing.type : ''),
            mode_device: modeDevice || (existing ? existing.mode_device : ''),
            omrIpv6Address: toText(rawNode.omrIpv6Address) || (existing ? existing.omrIpv6Address : ''),
            br: rawNode.br === true || (existing ? existing.br === true : false),
            from_otbr_restapi: true,
            shape: style.shape || (existing ? existing.shape : (isChildLike ? 'ellipse' : 'box')),
            color: style.color || (existing ? existing.color : { background: '#d9ecff', border: '#1565c0' })
          };
          if (merged.br) merged.color = { background: '#ffd9d9', border: '#c62828' };
          nodeMap.set(nodeId, merged);
        }

        // Pass 1: register nodes from devices (extAddress as node ID)
        devices.forEach((node) => {
          const nodeId = toText(node.extAddress || node.extaddr).toLowerCase() || toText(node.id);
          if (!nodeId) return;
          const roleText = toText(node.role).toLowerCase();
          const isChildLike = roleText === 'child' || roleText.includes('sleepy');
          upsertOtbrRestApiNode(nodeId, node, {
            shape: isChildLike ? 'ellipse' : 'box',
            color: isChildLike ? { background: '#fff4cc', border: '#d9a400' } : { background: '#d9ecff', border: '#1565c0' }
          });
          rawByIdForDetails.set(nodeId, node);
        });

        // Pass 2: augment from diagnostics — adds rloc16, route, childTable
        diagnostics.forEach((node) => {
          const nodeId = toText(node.extAddress || node.extaddr).toLowerCase() || toText(node.id);
          if (!nodeId) return;
          upsertOtbrRestApiNode(nodeId, node, {
            shape: 'box',
            color: { background: '#d9ecff', border: '#1565c0' }
          });
          const rloc16Val = toText(node.rloc16).toLowerCase();
          if (rloc16Val) rloc16ToNodeId.set(rloc16Val, nodeId);
          const existing = rawByIdForDetails.get(nodeId) || {};
          rawByIdForDetails.set(nodeId, mergeForDisplay(existing, node));
        });

        // Pass 3: edges from diagnostics route.routeData (router routes) + childTable
        diagnostics.forEach((node) => {
          const fromId = toText(node.extAddress || node.extaddr).toLowerCase() || toText(node.id);
          if (!fromId || !nodeMap.has(fromId)) return;
          const fromNode = nodeMap.get(fromId);

          (Array.isArray(node.route?.routeData) ? node.route.routeData : []).forEach((route) => {
            const toRloc16 = buildMainRouterRloc16(route.routeId);
            if (!toRloc16) return;
            let toId = rloc16ToNodeId.get(toRloc16.toLowerCase()) || toRloc16;
            if (!nodeMap.has(toId)) {
              upsertOtbrRestApiNode(toId, { rloc16: toRloc16, id: toId },
                { shape: 'box', color: { background: '#d9ecff', border: '#1565c0' } });
            }
            const lqi = Math.max(toFiniteNumber(route.linkQualityOut) || 0, toFiniteNumber(route.linkQualityIn) || 0);
            const edgeWidth = lqi >= 3 ? 3 : (lqi >= 2 ? 2 : 1.5);
            addEdge(edgeMap, edgeData, fromId, toId, { width: edgeWidth, linkCategories: [EDGE_CATEGORY_OTBR_ROUTE] });
          });

          (Array.isArray(node.childTable) ? node.childTable : []).forEach((child, ci) => {
            const childRloc16 = buildChildRloc16(toText(fromNode.rloc16), child.childId);
            const childId = (childRloc16 && rloc16ToNodeId.get(childRloc16.toLowerCase()))
              || childRloc16
              || `${fromId}-child-${ci + 1}`;
            if (!nodeMap.has(childId)) {
              upsertOtbrRestApiNode(childId, { rloc16: childRloc16, id: childId },
                { shape: 'ellipse', color: { background: '#fff4cc', border: '#d9a400' } });
            }
            addEdge(edgeMap, edgeData, fromId, childId, { dashes: true, isParentChild: true, linkCategories: [EDGE_CATEGORY_OTBR_CHILD] });
            routerIdsWithChildren.add(fromId);
          });
        });

        const nodeData = buildVisNodeData(nodeMap, routerIdsWithChildren, routerNeighborByRloc16, buildLabel);
        groupIsolatedUnknownNodes(nodeData, edgeData, edgeMap);

        const sourceNames = [];
        if (devices.length > 0) sourceNames.push('otbr_restapi_devices');
        if (diagnostics.length > 0) sourceNames.push('otbr_restapi_diagnostics');

        return { nodeData, edgeData, nodeMap, rawByIdForDetails, routerNeighborByRloc16, sourceNames };
      }

      // ── Dispatch: pick adaptor based on topologyMode ──────────────────────────

      function runAdaptor(dataset) {
        const { entry, rawFiles } = dataset;
        switch (entry.topologyMode) {
          case 'meshdiag-networkdiag': return adaptMeshdiagNetworkdiag(rawFiles);
          case 'merged-detailed':      return adaptMergedDetailed(rawFiles);
          case 'eve_enhanced':         return adaptEve(rawFiles);
          case 'eve_native':           return adaptEveNative(rawFiles);
          case 'router-table':         return adaptRouterTable(rawFiles);
          case 'otbr_restapi':         return adaptOtbrRestApi(rawFiles);
          case 'raw-array':
          default:                     return adaptRawArray(rawFiles);
        }
      }

      // ── Section 5: Topology Renderer ─────────────────────────────────────────
      //
      // renderTopologyForDataset(dataset):
      //   1. Runs the appropriate adaptor via runAdaptor()
      //   2. Destroys any existing vis.Network instance
      //   3. Creates new vis.DataSet + vis.Network
      //   4. Wires up applyFilters, node-detail click handler, filter-change handlers
      //   5. Runs initial applyFilters pass

      // Module-level reference so we can destroy on re-render
      let _visNetwork = null;
      // Stored filter callbacks so that filter dropdowns can call the active view's handler
      let _topologyFilterHandlers = null;
      let _autoZoomEnabled = true;
      let _animationEnabled = true;

      const VIS_OPTIONS = {
        layout: { improvedLayout: true, randomSeed: 7 },
        nodes: { font: { size: 13, face: 'monospace', multi: 'md' }, margin: 10, widthConstraint: { maximum: 260 } },
        groups: { unknown: { color: { background: '#f2f2f2', border: '#808080' } } },
        edges: { color: '#8a8a8a', width: 1.5, smooth: false },
        physics: {
          barnesHut: {
            gravitationalConstant: -9500,
            centralGravity: 0.15,
            springLength: 380,
            springConstant: 0.01,
            damping: 0.22,
            avoidOverlap: 1.5
          },
          stabilization: { enabled: true, iterations: 1500, updateInterval: 25 }
        },
        interaction: { hover: true, navigationButtons: true }
      };

      function isNodeVisibleByFilter(node, filterMode) {
        if (filterMode === 'ftd-devices') return toText(node.mode_device).toUpperCase() === 'FTD';
        if (filterMode === 'mtd-devices') return toText(node.mode_device).toUpperCase() === 'MTD';
        if (filterMode === 'main-routers') return node.isMainRouter === true;
        if (filterMode === 'border-routers') return node.isBorderRouter === true;
        if (filterMode === 'routers-with-children') return node.isRouter === true && node.hasChildren === true;
        if (filterMode === 'routers-without-children') return node.isRouter === true && node.hasChildren !== true;
        return true;
      }

      function isNodeVisibleByDiagnosticFilter(node, filterMode) {
        if (filterMode === 'medium-discard-pct') return Number.isFinite(node.iftotalpktserrorsdiscards_pct) && node.iftotalpktserrorsdiscards_pct >= 15;
        if (filterMode === 'medium-total-errors-pct') return Number.isFinite(node.iftotalerrors_pct) && node.iftotalerrors_pct >= 5;
        if (filterMode === 'medium-total-errors-high') return Number.isFinite(node.iftotalerrors_pct) && node.iftotalerrors_pct > 10;
        if (filterMode === 'medium-partition-changes') return Number.isFinite(node.partitionidchanges) && node.partitionidchanges >= 2;
        if (filterMode === 'high-partition-changes') return Number.isFinite(node.partitionidchanges) && node.partitionidchanges >= 5;
        if (filterMode === 'medium-parent-changes') return Number.isFinite(node.parentchanges) && node.parentchanges >= 2;
        if (filterMode === 'high-parent-changes') return Number.isFinite(node.parentchanges) && node.parentchanges >= 5;
        if (filterMode === 'router-neighbor-err-rate-frame-low') return Number.isFinite(node.router_neighbor_max_err_rate_frame_pct) && node.router_neighbor_max_err_rate_frame_pct >= 2;
        if (filterMode === 'router-neighbor-err-rate-frame-medium') return Number.isFinite(node.router_neighbor_max_err_rate_frame_pct) && node.router_neighbor_max_err_rate_frame_pct >= 5;
        if (filterMode === 'router-neighbor-err-rate-frame-high') return Number.isFinite(node.router_neighbor_max_err_rate_frame_pct) && node.router_neighbor_max_err_rate_frame_pct >= 10;
        if (filterMode === 'router-neighbor-err-rate-msg-low') return Number.isFinite(node.router_neighbor_max_err_rate_msg_pct) && node.router_neighbor_max_err_rate_msg_pct >= 2;
        if (filterMode === 'router-neighbor-err-rate-msg-medium') return Number.isFinite(node.router_neighbor_max_err_rate_msg_pct) && node.router_neighbor_max_err_rate_msg_pct >= 5;
        if (filterMode === 'router-neighbor-err-rate-msg-high') return Number.isFinite(node.router_neighbor_max_err_rate_msg_pct) && node.router_neighbor_max_err_rate_msg_pct >= 10;
        if (filterMode === 'router-neighbor-rss-very-low') return node.router_neighbor_has_rss_very_low === true;
        if (filterMode === 'router-neighbor-rss-low') return node.router_neighbor_has_rss_low === true;
        if (filterMode === 'router-neighbor-rss-medium') return node.router_neighbor_has_rss_medium === true;
        if (filterMode === 'router-neighbor-rss-high') return node.router_neighbor_has_rss_high === true;
        return true;
      }

      function renderTopologyForDataset(dataset) {
        const container = document.getElementById('topology-view');
        const statusEl = document.getElementById('status');
        const detailsList = document.getElementById('details-list');
        const nodeFilterEl = document.getElementById('node-filter');
        const linkFilterEl = document.getElementById('link-filter');
        const diagnosticFilterEl = document.getElementById('diagnostic-filter');
        let lastStatusCounts = null;

        // Destroy previous network instance to free memory
        if (_visNetwork) {
          _visNetwork.destroy();
          _visNetwork = null;
          _topologyFilterHandlers = null;
        }
        container.innerHTML = '';
        detailsList.innerHTML = '<li>Click a node to view its properties.</li>';

        let adaptorResult;
        try {
          adaptorResult = runAdaptor(dataset);
        } catch (err) {
          statusEl.textContent = `Topology error: ${err.message}`;
          return;
        }

        const { nodeData, edgeData, nodeMap, rawByIdForDetails, routerNeighborByRloc16, sourceNames } = adaptorResult;

        // ── Phase 5.1: compute and apply dynamic filter option visibility ────────
        const capabilities = computeTopologyCapabilities(nodeData, edgeData);
        dataset.capabilities = capabilities;
        updateFilterOptionVisibility(capabilities, 'topology');

        const nodesDataset = new vis.DataSet(nodeData);
        const edgesDataset = new vis.DataSet(edgeData);
        const effectiveOptions = _physicsEnabled
          ? VIS_OPTIONS
          : Object.assign({}, VIS_OPTIONS, { physics: Object.assign({}, VIS_OPTIONS.physics, { enabled: false }) });
        _visNetwork = new vis.Network(container, { nodes: nodesDataset, edges: edgesDataset }, effectiveOptions);

        // ── applyFilters ───────────────────────────────────────────────────────

        function applyFilters(nodeFilterMode, linkFilterMode, diagnosticFilterMode) {
          const visibleNodeIds = new Set();
          const forcedVisibleEdgeIds = new Set();
          const matchedTargetNodeIds = new Set();
          let visibleEdgeCount = 0;

          nodesDataset.forEach((node) => {
            if (isNodeVisibleByFilter(node, nodeFilterMode) && isNodeVisibleByDiagnosticFilter(node, diagnosticFilterMode)) {
              visibleNodeIds.add(node.id);
            }
          });

          // Pull in child nodes when routers-with-children filter is active
          if (nodeFilterMode === 'routers-with-children') {
            edgesDataset.forEach((edge) => {
              if (edge.isParentChild === true && edgeMatchesLinkFilter(edge, linkFilterMode) && visibleNodeIds.has(edge.from)) {
                visibleNodeIds.add(edge.to);
              }
            });
          }

          // For router-neighbor diagnostic modes: expose matched neighbor nodes + force their edges visible
          if (isRouterNeighborDiagnosticMode(diagnosticFilterMode)) {
            Array.from(visibleNodeIds).forEach((sourceNodeId) => {
              const sourceNode = nodeMap.get(sourceNodeId);
              if (!sourceNode) return;
              const sourceRloc16 = toText(sourceNode.rloc16).toLowerCase();
              const neighborRow = routerNeighborByRloc16.get(sourceRloc16);
              const neighborEntries = Array.isArray(neighborRow?.router_neighbor_table) ? neighborRow.router_neighbor_table : [];
              neighborEntries
                .filter((neighbor) => routerNeighborRowMatchesDiagnosticFilter(neighbor, diagnosticFilterMode))
                .forEach((neighbor) => {
                  const targetId = toText(neighbor.rloc16) || toText(neighbor.extaddr);
                  if (!targetId) return;
                  matchedTargetNodeIds.add(targetId);
                  visibleNodeIds.add(targetId);
                  edgesDataset.forEach((edge) => {
                    const cats = normalizeLinkCategories(edge.linkCategories);
                    if (!cats.includes(EDGE_CATEGORY_ROUTER_NEIGHBOR)) return;
                    if ((areNodeIdsEquivalent(edge.from, sourceNodeId) && areNodeIdsEquivalent(edge.to, targetId))
                      || (areNodeIdsEquivalent(edge.to, sourceNodeId) && areNodeIdsEquivalent(edge.from, targetId))) {
                      forcedVisibleEdgeIds.add(edge.id);
                    }
                  });
                });
            });
          }

          nodesDataset.forEach((node) => {
            nodesDataset.update({ id: node.id, hidden: !visibleNodeIds.has(node.id) });
          });

          edgesDataset.forEach((edge) => {
            const endpointsVisible = visibleNodeIds.has(edge.from) && visibleNodeIds.has(edge.to);
            const shouldShow = edge.baseHidden !== true
              && endpointsVisible
              && (edgeMatchesLinkFilter(edge, linkFilterMode) || forcedVisibleEdgeIds.has(edge.id));
            edgesDataset.update({ id: edge.id, hidden: !shouldShow });
            if (shouldShow) visibleEdgeCount += 1;
          });

          return {
            visibleNodeCount: visibleNodeIds.size,
            visibleEdgeCount,
            matchedTargetNodeCount: matchedTargetNodeIds.size,
            forcedVisibleLinkCount: forcedVisibleEdgeIds.size
          };
        }

        // ── Status line ────────────────────────────────────────────────────────

        function formatTopologyScale() {
          if (!_visNetwork || typeof _visNetwork.getScale !== 'function') return '';
          const scale = _visNetwork.getScale();
          if (!Number.isFinite(scale)) return '';
          return ` Scale: ${scale.toFixed(2)}x.`;
        }

        function updateStatus(counts) {
          lastStatusCounts = counts;
          const { visibleNodeCount, visibleEdgeCount, matchedTargetNodeCount = 0, forcedVisibleLinkCount = 0 } = counts;
          const nodeFilterLabel = nodeFilterEl.options[nodeFilterEl.selectedIndex].text;
          const linkFilterLabel = linkFilterEl.options[linkFilterEl.selectedIndex].text;
          const diagFilterLabel = diagnosticFilterEl.options[diagnosticFilterEl.selectedIndex].text;
          const neighborSuffix = isRouterNeighborDiagnosticMode(diagnosticFilterEl.value)
            ? ` Neighbor Match: targets ${matchedTargetNodeCount}, links ${forcedVisibleLinkCount}.` : '';
          statusEl.textContent = `Loaded ${sourceNames.join(', ')}. Total: ${nodeData.length} nodes, ${edgeData.length} links. `
            + `Showing: ${visibleNodeCount} nodes, ${visibleEdgeCount} links. `
            + `Node Filter: ${nodeFilterLabel}. Link Filter: ${linkFilterLabel}. Diagnostic Filter: ${diagFilterLabel}.${neighborSuffix}${formatTopologyScale()}`;
        }

        // ── Node detail click handler ──────────────────────────────────────────

        _visNetwork.on('click', (params) => {
          if (params.nodes.length === 0) {
            detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            return;
          }
          const selectedId = params.nodes[0];
          const node = nodeMap.get(selectedId);
          detailsList.innerHTML = '';
          if (!node) {
            detailsList.innerHTML = '<li>No details available for selected node.</li>';
            return;
          }

          const rawSource = rawByIdForDetails.get(selectedId) || {};
          const graphDetails = {
            graph: {
              unified_id: selectedId,
              graph_link_count: (function () {
                let deg = 0;
                edgesDataset.forEach((e) => { if (e.from === selectedId || e.to === selectedId) deg += 1; });
                return deg;
              })(),
              is_router: node.shape !== 'ellipse',
              has_children: routerIdsWithChildrenRef ? routerIdsWithChildrenRef.has(selectedId) : undefined
            }
          };

          // Router-neighbor table gets its own top-level li for readability
          if (Array.isArray(rawSource.router_neighbor_table)) {
            const li = document.createElement('li');
            li.textContent = `router_neighbor_table: ${formatValue(rawSource.router_neighbor_table)}`;
            detailsList.appendChild(li);
          }

          const mergedDetails = mergeForDisplay(rawSource, graphDetails);
          const details = sortDetailsWithPriority(
            flattenObjectEntries(mergedDetails).filter(([key]) => !shouldExcludeDetailPath(key))
          );

          if (details.length === 0) {
            detailsList.innerHTML = '<li>No details available for selected node.</li>';
            return;
          }
          details.forEach(([key, value]) => {
            const li = document.createElement('li');
            li.textContent = `${key}: ${formatValue(value)}`;
            detailsList.appendChild(li);
          });
        });

        // Capture routerIdsWithChildren for detail panel — adaptors put it inside nodeMap entries (hasChildren flag)
        // Use a closure reference to whatever the adaptor set; we check hasChildren on the vis node directly.
        const routerIdsWithChildrenRef = new Set(
          nodeData.filter((n) => n.hasChildren).map((n) => n.id)
        );

        function refreshStatusScale() {
          if (lastStatusCounts) updateStatus(lastStatusCounts);
        }

        _visNetwork.on('zoom', refreshStatusScale);
        _visNetwork.on('animationFinished', refreshStatusScale);
        _visNetwork.once('stabilized', refreshStatusScale);

        // ── Store filter handlers so the toggle/filter wiring (Section 7/8) can call them ──
        _topologyFilterHandlers = {
          applyFilters,
          updateStatus,
          fitIfEnabled: () => {
            if (_autoZoomEnabled && _visNetwork) {
              requestAnimationFrame(() => {
                if (_visNetwork) {
                  _visNetwork.fit({ animation: _animationEnabled });
                }
              });
            }
          }
        };

        // ── Initial filter pass ────────────────────────────────────────────────
        const initial = applyFilters(nodeFilterEl.value, linkFilterEl.value, diagnosticFilterEl.value);
        updateStatus(initial);
        _topologyFilterHandlers.fitIfEnabled();
      }

      // ── Section 6: Table Renderer ─────────────────────────────────────────────
      //
      // renderTableForDataset(dataset):
      //   Uses dataset.rows (already normalised by Section 3 loader).
      //   Applies node + diagnostic filters, then renders a sortable HTML table.
      //
      // applyTableFilters() re-filters currentRows and re-renders without refetching.

      const TABLE_PRIORITY_COLUMNS = [
        'rloc16', 'extaddr', 'device_label', 'name', 'room',
        'ID', 'Extended MAC', 'Next Hop', 'Path Cost', 'LQ In', 'LQ Out', 'Age',
        'type', 'total_children', 'total_links', 'mode.device', 'thread_stack_version',
        'mac_counters.iftotalerrors_pct', 'mac_counters.iftotaldiscards_pct',
        'mle_counters.partitionidchanges', 'mle_counters.betterpartitionattachattempts',
        'mle_counters.parentchanges'
      ];

      // ── Column value helpers ──────────────────────────────────────────────────

      function hasNestedPath(row, path) {
        if (!path.includes('.')) return Object.prototype.hasOwnProperty.call(row, path);
        let current = row;
        for (const part of path.split('.')) {
          if (!isPlainObject(current) || !Object.prototype.hasOwnProperty.call(current, part)) return false;
          current = current[part];
        }
        return true;
      }

      function getColumnValue(row, columnName) {
        if (Object.prototype.hasOwnProperty.call(row, columnName)) return row[columnName];
        if (!columnName.includes('.')) return undefined;
        let current = row;
        for (const part of columnName.split('.')) {
          if (!isPlainObject(current) || !Object.prototype.hasOwnProperty.call(current, part)) return undefined;
          current = current[part];
        }
        return current;
      }

      // ── Phase 2 (continued): computeTableCapabilities ─────────────────────────
      //
      // Placed here because it depends on getColumnValue (defined just above).
      // Scans the flat normalised rows array to produce the same DatasetCapabilities
      // shape as computeTopologyCapabilities, with edgeCategories always empty (table
      // view has no topology edges).

      function computeTableCapabilities(rows) {
        let hasFtdNodes = false;
        let hasMtdNodes = false;
        let hasMainRouters = false;
        let hasBorderRouters = false;
        let hasRoutersWithChildren = false;
        let hasRoutersWithoutChildren = false;
        let hasFieldMacTotalErrorsPct = false;
        let hasFieldMacDiscardPct = false;
        let hasFieldPartitionChanges = false;
        let hasFieldParentChanges = false;
        let hasNeighborFrameErrRate = false;
        let hasNeighborMsgErrRate = false;
        let hasNeighborRss = false;

        for (const row of rows) {
          const md = toText(getColumnValue(row, 'mode.device')).toUpperCase();
          if (md === 'FTD') hasFtdNodes = true;
          if (md === 'MTD') hasMtdNodes = true;

          const rloc16Text = toText(getColumnValue(row, 'rloc16')).toLowerCase();
          const isMainRouter = rloc16Text.endsWith('00') && rloc16Text.length > 0;
          if (isMainRouter) hasMainRouters = true;

          const brValue = getColumnValue(row, 'br');
          if (isMainRouter && (brValue === true || toText(brValue).toLowerCase() === 'true')) {
            hasBorderRouters = true;
          }

          const totalChildren = toFiniteNumber(getColumnValue(row, 'total_children'));
          const childrenValue = getColumnValue(row, 'children');
          const childrenCount = Array.isArray(childrenValue) ? childrenValue.length : undefined;
          const hasChildren = (Number.isFinite(totalChildren) && totalChildren > 0)
            || (Number.isFinite(childrenCount) && childrenCount > 0);
          const isRouter = isMainRouter
            || Number.isFinite(totalChildren)
            || Array.isArray(childrenValue);
          if (isRouter && hasChildren) hasRoutersWithChildren = true;
          if (isRouter && !hasChildren) hasRoutersWithoutChildren = true;

          const macTotalErrors = getColumnValue(row, 'mac_counters.iftotalerrors_pct');
          if (Number.isFinite(toFiniteNumber(macTotalErrors))) hasFieldMacTotalErrorsPct = true;

          const macDiscard = getColumnValue(row, 'mac_counters.iftotalpktserrorsdiscards_pct');
          if (Number.isFinite(toFiniteNumber(macDiscard))) hasFieldMacDiscardPct = true;

          const partChanges = getColumnValue(row, 'mle_counters.partitionidchanges');
          if (Number.isFinite(toFiniteNumber(partChanges))) hasFieldPartitionChanges = true;

          const parentChanges = getColumnValue(row, 'mle_counters.parentchanges');
          if (Number.isFinite(toFiniteNumber(parentChanges))) hasFieldParentChanges = true;

          const neighborRows = Array.isArray(getColumnValue(row, 'router_neighbor_table'))
            ? getColumnValue(row, 'router_neighbor_table') : [];
          for (const neighbor of neighborRows) {
            if (Number.isFinite(toFiniteNumber(neighbor?.err_rate_frame_pct))) hasNeighborFrameErrRate = true;
            if (Number.isFinite(toFiniteNumber(neighbor?.err_rate_msg_pct))) hasNeighborMsgErrRate = true;
            if (Number.isFinite(toFiniteNumber(neighbor?.rss_ave))) hasNeighborRss = true;
          }
        }

        return {
          hasFtdNodes, hasMtdNodes,
          hasMainRouters, hasBorderRouters,
          hasRoutersWithChildren, hasRoutersWithoutChildren,
          edgeCategories: new Set(),
          hasFieldMacTotalErrorsPct, hasFieldMacDiscardPct,
          hasFieldPartitionChanges, hasFieldParentChanges,
          hasNeighborFrameErrRate, hasNeighborMsgErrRate, hasNeighborRss
        };
      }

      function formatCellValue(value, columnName) {
        if (value === null || value === undefined) return '';

        if (columnName === 'routes') {
          const routeItems = Array.isArray(value) ? value : (isPlainObject(value) ? [value] : []);
          if (routeItems.length === 0) return '[]';
          const summaries = routeItems.map((route) => {
            if (!isPlainObject(route)) return '';
            const nestedTo = isPlainObject(route.to) ? route.to : null;
            const toName = route.to_name ?? (nestedTo ? nestedTo.name ?? nestedTo.to_name : '') ?? '';
            const toRloc16 = route.to_rloc16 ?? (nestedTo ? nestedTo.rloc16 ?? nestedTo.to_rloc16 : '') ?? '';
            if (!toName && !toRloc16) return '';
            return `${toName ? String(toName) : '(no-name)'} (${toRloc16 ? String(toRloc16) : '(no-rloc16)'})`;
          }).filter(Boolean);
          return summaries.length > 0 ? summaries.join('\n') : '[]';
        }

        if (Array.isArray(value) || isPlainObject(value)) {
          try { return JSON.stringify(value); } catch (_e) { return String(value); }
        }
        return String(value);
      }

      function collectColumns(rows) {
        const columns = [];
        const seen = new Set();
        rows.forEach((row) => {
          Object.keys(row).forEach((key) => {
            if (!seen.has(key)) { seen.add(key); columns.push(key); }
          });
        });
        const pinned = TABLE_PRIORITY_COLUMNS.filter(
          (col) => seen.has(col) || rows.some((row) => hasNestedPath(row, col))
        );
        const remaining = columns.filter((col) => !pinned.includes(col));
        return [...pinned, ...remaining];
      }

      // ── Column width calculation ──────────────────────────────────────────────

      function calculateColumnMaxLength(rows, column) {
        let max = column.length;
        rows.forEach((row) => {
          const val = formatCellValue(getColumnValue(row, column), column);
          if (val) {
            val.split('\n').forEach((line) => { max = Math.max(max, line.length); });
          }
        });
        return max;
      }

      function getColumnWidthStyle(maxLen) {
        const charPx = 8.8;
        const minWidth = 70;
        const maxWidth = 25 * charPx;
        const width = maxLen >= 25 ? maxWidth : Math.max(maxLen * charPx, minWidth);
        return { width: `${width}px` };
      }

      // ── Row visibility filters (mirrors td_web_tables.html) ──────────────────

      function isRowVisibleByNodeFilter(row, filterMode) {
        if (filterMode === 'all') return true;
        const modeDevice = toText(getColumnValue(row, 'mode.device')).toUpperCase();
        const rloc16Text = toText(getColumnValue(row, 'rloc16')).toLowerCase();
        const isMainRouter = rloc16Text.endsWith('00');
        const brValue = getColumnValue(row, 'br');
        const isBorderRouter = isMainRouter && (brValue === true || toText(brValue).toLowerCase() === 'true');
        const totalChildren = toFiniteNumber(getColumnValue(row, 'total_children'));
        const childrenValue = getColumnValue(row, 'children');
        const childrenCount = Array.isArray(childrenValue) ? childrenValue.length : undefined;
        const hasChildren = (Number.isFinite(totalChildren) && totalChildren > 0)
          || (Number.isFinite(childrenCount) && childrenCount > 0);
        const isRouter = isMainRouter || Number.isFinite(totalChildren) || Array.isArray(childrenValue);
        if (filterMode === 'ftd-devices') return modeDevice === 'FTD';
        if (filterMode === 'mtd-devices') return modeDevice === 'MTD';
        if (filterMode === 'main-routers') return isMainRouter;
        if (filterMode === 'border-routers') return isBorderRouter;
        if (filterMode === 'routers-with-children') return isRouter && hasChildren;
        if (filterMode === 'routers-without-children') return isRouter && !hasChildren;
        return true;
      }

      function isRowVisibleByDiagnosticFilter(row, filterMode) {
        if (filterMode === 'all') return true;
        const getMetric = (path) => {
          const v = getColumnValue(row, path);
          return Number.isFinite(v) ? v : undefined;
        };
        if (filterMode === 'medium-total-errors-pct') { const v = getMetric('mac_counters.iftotalerrors_pct'); return Number.isFinite(v) && v >= 5; }
        if (filterMode === 'medium-total-errors-high') { const v = getMetric('mac_counters.iftotalerrors_pct'); return Number.isFinite(v) && v > 10; }
        if (filterMode === 'medium-discard-pct') { const v = getMetric('mac_counters.iftotaldiscards_pct'); return Number.isFinite(v) && v >= 15; }
        if (filterMode === 'medium-partition-changes') { const v = getMetric('mle_counters.partitionidchanges'); return Number.isFinite(v) && v >= 2; }
        if (filterMode === 'high-partition-changes') { const v = getMetric('mle_counters.partitionidchanges'); return Number.isFinite(v) && v >= 5; }
        if (filterMode === 'medium-parent-changes') { const v = getMetric('mle_counters.parentchanges'); return Number.isFinite(v) && v >= 2; }
        if (filterMode === 'high-parent-changes') { const v = getMetric('mle_counters.parentchanges'); return Number.isFinite(v) && v >= 5; }

        const neighborRows = Array.isArray(getColumnValue(row, 'router_neighbor_table'))
          ? getColumnValue(row, 'router_neighbor_table') : [];
        const hasMatchingNeighbor = (pred) => neighborRows.some(pred);

        if (filterMode === 'router-neighbor-err-rate-frame-low') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.err_rate_frame_pct); return Number.isFinite(v) && v >= 2; });
        if (filterMode === 'router-neighbor-err-rate-frame-medium') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.err_rate_frame_pct); return Number.isFinite(v) && v >= 5; });
        if (filterMode === 'router-neighbor-err-rate-frame-high') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.err_rate_frame_pct); return Number.isFinite(v) && v >= 10; });
        if (filterMode === 'router-neighbor-err-rate-msg-low') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.err_rate_msg_pct); return Number.isFinite(v) && v >= 2; });
        if (filterMode === 'router-neighbor-err-rate-msg-medium') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.err_rate_msg_pct); return Number.isFinite(v) && v >= 5; });
        if (filterMode === 'router-neighbor-err-rate-msg-high') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.err_rate_msg_pct); return Number.isFinite(v) && v >= 10; });
        if (filterMode === 'router-neighbor-rss-very-low') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.rss_ave); return Number.isFinite(v) && v < -80; });
        if (filterMode === 'router-neighbor-rss-low') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.rss_ave); return Number.isFinite(v) && v >= -80 && v < -70; });
        if (filterMode === 'router-neighbor-rss-medium') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.rss_ave); return Number.isFinite(v) && v >= -70 && v <= -60; });
        if (filterMode === 'router-neighbor-rss-high') return hasMatchingNeighbor((n) => { const v = toFiniteNumber(n?.rss_ave); return Number.isFinite(v) && v > -60; });
        return true;
      }

      // ── DOM table builder ─────────────────────────────────────────────────────

      function renderTableRows(rows, columns) {
        const theadEl = document.querySelector('#data-table thead');
        const tbodyEl = document.querySelector('#data-table tbody');
        theadEl.innerHTML = '';
        tbodyEl.innerHTML = '';

        const columnWidths = new Map();
        columns.forEach((col) => columnWidths.set(col, getColumnWidthStyle(calculateColumnMaxLength(rows, col))));

        const headRow = document.createElement('tr');
        columns.forEach((col) => {
          const th = document.createElement('th');
          th.textContent = col;
          Object.assign(th.style, columnWidths.get(col));
          headRow.appendChild(th);
        });
        theadEl.appendChild(headRow);

        const fragment = document.createDocumentFragment();
        rows.forEach((row) => {
          const tr = document.createElement('tr');
          columns.forEach((col) => {
            const td = document.createElement('td');
            td.textContent = formatCellValue(getColumnValue(row, col), col);
            Object.assign(td.style, columnWidths.get(col));
            tr.appendChild(td);
          });
          fragment.appendChild(tr);
        });
        tbodyEl.appendChild(fragment);

        // Re-initialise SortableJS after replacing table content
        if (window.Sortable && typeof window.Sortable.init === 'function') {
          window.Sortable.init();
        }
      }

      // ── Filter + render pipeline ──────────────────────────────────────────────

      // Module-level table state (set by renderTableForDataset, read by applyTableFilters)
      let _tableRows = [];
      let _tableColumns = [];
      let _tableDatasetLabel = '';

      function applyTableFilters() {
        const nodeMode = document.getElementById('node-filter').value;
        const diagMode = document.getElementById('diagnostic-filter').value;
        const filtered = _tableRows.filter(
          (row) => isRowVisibleByNodeFilter(row, nodeMode) && isRowVisibleByDiagnosticFilter(row, diagMode)
        );
        renderTableRows(filtered, _tableColumns);
        updateTableStatus(filtered.length);
      }

      function updateTableStatus(visibleRowCount) {
        const nodeFilterEl = document.getElementById('node-filter');
        const diagFilterEl = document.getElementById('diagnostic-filter');
        const nodeLabel = nodeFilterEl.options[nodeFilterEl.selectedIndex].text;
        const diagLabel = diagFilterEl.options[diagFilterEl.selectedIndex].text;
        document.getElementById('status').textContent =
          `Loaded ${_tableDatasetLabel}. Total: ${_tableRows.length} rows, ${_tableColumns.length} columns. `
          + `Showing: ${visibleRowCount} rows. Node Filter: ${nodeLabel}. Diagnostic Filter: ${diagLabel}. `
          + `Click a header to sort.`;
      }

      function renderTableForDataset(dataset) {
        const rows = dataset.rows;
        const columns = collectColumns(rows);

        _tableRows = rows;
        _tableColumns = columns;
        _tableDatasetLabel = dataset.loadedFiles.join(', ');

        // ── Phase 5.2: compute and apply dynamic filter option visibility ────────
        const capabilities = computeTableCapabilities(rows);
        dataset.capabilities = capabilities;
        updateFilterOptionVisibility(capabilities, 'table');

        applyTableFilters();
      }

      // ── Section 7: View Toggle ────────────────────────────────────────────────
      //
      // currentView tracks which panel is active: 'topology' | 'table'
      //
      // switchView(newView):
      //   - Shows/hides #view-topology / #view-table
      //   - Updates active button styling
      //   - Grays out #link-filter when table view is active (not used by table)
      //   - Re-renders the current dataset in the new view (no refetch)

      let currentView = 'topology';

      function switchView(newView) {
        if (newView === currentView) return;
        currentView = newView;

        const topoPanel = document.getElementById('view-topology');
        const tablePanel = document.getElementById('view-table');
        const btnTopology = document.getElementById('btn-topology');
        const btnTable = document.getElementById('btn-table');
        const btnPhysics = document.getElementById('btn-physics');
        const btnAutoZoom = document.getElementById('btn-auto-zoom');
        const btnAnimation = document.getElementById('btn-animation');
        const linkFilterEl = document.getElementById('link-filter');

        if (newView === 'topology') {
          topoPanel.style.display = 'block';
          tablePanel.style.display = 'none';
          btnTopology.classList.add('active');
          btnTable.classList.remove('active');
          btnPhysics.style.display = 'inline-block';
          btnAutoZoom.style.display = 'inline-block';
          btnAnimation.style.display = 'inline-block';
          linkFilterEl.classList.remove('filter-disabled');
        } else {
          topoPanel.style.display = 'none';
          tablePanel.style.display = 'block';
          btnTable.classList.add('active');
          btnTopology.classList.remove('active');
          btnPhysics.style.display = 'none';
          btnAutoZoom.style.display = 'none';
          btnAnimation.style.display = 'none';
          linkFilterEl.classList.add('filter-disabled');
        }

        // Re-render current dataset in the new view without refetching
        if (currentDataset) {
          renderCurrentView();
        }
      }

      document.getElementById('btn-topology').addEventListener('click', () => switchView('topology'));
      document.getElementById('btn-table').addEventListener('click', () => switchView('table'));

      // ── Physics toggle ────────────────────────────────────────────────────────
      let _physicsEnabled = true;

      function setPhysics(enabled) {
        _physicsEnabled = enabled;
        const btn = document.getElementById('btn-physics');
        if (enabled) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
        if (_visNetwork) {
          _visNetwork.setOptions({ physics: { enabled } });
        }
      }

      document.getElementById('btn-physics').addEventListener('click', () => setPhysics(!_physicsEnabled));

      // ── Animation toggle ────────────────────────────────────────────────────
      function setAnimation(enabled) {
        _animationEnabled = enabled;
        const btn = document.getElementById('btn-animation');
        if (enabled) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }

      document.getElementById('btn-animation').addEventListener('click', () => setAnimation(!_animationEnabled));

      // ── Auto Zoom toggle ─────────────────────────────────────────────────────
      function setAutoZoom(enabled) {
        _autoZoomEnabled = enabled;
        const btn = document.getElementById('btn-auto-zoom');
        if (enabled) {
          btn.classList.add('active');
          if (currentView === 'topology' && _visNetwork) {
            _visNetwork.fit({ animation: _animationEnabled });
          }
        } else {
          btn.classList.remove('active');
        }
      }

      document.getElementById('btn-auto-zoom').addEventListener('click', () => setAutoZoom(!_autoZoomEnabled));

      // ── Section 8: Filter Controls + Dataset Select Wiring ────────────────────
      //
      // Dataset select   → loadDataset() → renderCurrentView()
      // Node filter      → re-renders in whichever view is active
      // Link filter      → topology only (disabled in table view via CSS)
      // Diagnostic filter → re-renders in whichever view is active

      document.getElementById('dataset-select').addEventListener('change', (event) => {
        // Reset filters to neutral defaults on dataset change
        document.getElementById('node-filter').value = 'all';
        document.getElementById('diagnostic-filter').value = 'all';
        loadDataset(event.target.value);
      });

      document.getElementById('node-filter').addEventListener('change', () => {
        if (!currentDataset) return;
        if (currentView === 'topology') {
          if (_topologyFilterHandlers) {
            const linkFilterEl = document.getElementById('link-filter');
            const nodeFilterEl = document.getElementById('node-filter');
            const diagFilterEl = document.getElementById('diagnostic-filter');
            const counts = _topologyFilterHandlers.applyFilters(
              nodeFilterEl.value, linkFilterEl.value, diagFilterEl.value
            );
            _topologyFilterHandlers.updateStatus(counts);
            _topologyFilterHandlers.fitIfEnabled();
            document.getElementById('details-list').innerHTML = '<li>Click a node to view its properties.</li>';
          }
        } else {
          applyTableFilters();
        }
      });

      document.getElementById('link-filter').addEventListener('change', () => {
        // Link filter only applies to topology view
        if (!currentDataset || currentView !== 'topology') return;
        if (_topologyFilterHandlers) {
          const linkFilterEl = document.getElementById('link-filter');
          const nodeFilterEl = document.getElementById('node-filter');
          const diagFilterEl = document.getElementById('diagnostic-filter');
          const counts = _topologyFilterHandlers.applyFilters(
            nodeFilterEl.value, linkFilterEl.value, diagFilterEl.value
          );
          _topologyFilterHandlers.updateStatus(counts);
          _topologyFilterHandlers.fitIfEnabled();
          document.getElementById('details-list').innerHTML = '<li>Click a node to view its properties.</li>';
        }
      });

      document.getElementById('diagnostic-filter').addEventListener('change', () => {
        if (!currentDataset) return;
        if (currentView === 'topology') {
          if (_topologyFilterHandlers) {
            const linkFilterEl = document.getElementById('link-filter');
            const nodeFilterEl = document.getElementById('node-filter');
            const diagFilterEl = document.getElementById('diagnostic-filter');
            const counts = _topologyFilterHandlers.applyFilters(
              nodeFilterEl.value, linkFilterEl.value, diagFilterEl.value
            );
            _topologyFilterHandlers.updateStatus(counts);
            _topologyFilterHandlers.fitIfEnabled();
            document.getElementById('details-list').innerHTML = '<li>Click a node to view its properties.</li>';
          }
        } else {
          applyTableFilters();
        }
      });

      // ── Bootstrap: load first dataset on page load ────────────────────────────
      loadDataset(document.getElementById('dataset-select').value);
    </script>
  </body>
</html>
