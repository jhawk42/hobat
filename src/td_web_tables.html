<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thread Dashboard: Mesh Network Topology Tables</title>

    <!-- SortableJS table sorting library -->
    <script src="https://cdn.jsdelivr.net/gh/tofsjonas/sortable@latest/sortable.min.js"></script>

    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #5b6472;
        --line: #d6dde8;
        --accent: #0f766e;
        --accent-soft: #d6f5f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 40%, #eef8f5 100%);
        color: var(--text);
      }

      .page {
        padding: 16px;
        max-width: 100%;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 16px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      label {
        font-weight: 580;
      }

      select {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 320px;
        background: var(--surface);
        font-size: 14px;
      }

      #status {
        margin: 6px 0 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .table-wrap {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        overflow: auto;
        max-height: calc(100vh - 190px);
      }

      table {
        width: 100%;
        border-collapse: collapse;
          table-layout: fixed;
          min-width: 0; /* Remove hardcoded min-width */
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--accent-soft);
        color: #0f2d3a;
        border-bottom: 1px solid var(--line);
      }

      th,
      td {
        padding: 8px 10px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        text-align: left;
        font-size: 13px;
        line-height: 1.3;
          white-space: normal;
        word-break: break-word;
          overflow-wrap: break-word;
      }

      tr:nth-child(even) td {
        background: #fcfdff;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      @media (max-width: 720px) {
        .page {
          padding: 12px;
        }

        h1 {
          font-size: 18px;
        }

        select {
          min-width: 100%;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <h1>Thread Mesh Network Topology: JSON Tables</h1>

      <div class="controls">
        <label for="dataset-select">Dataset:</label>
        <select id="dataset-select">
          <option value="td-otbr-cli-router-table.json">td-otbr-cli-router-table.json</option>
          <option value="td-otbr-cli-meshdiag-topology.json">td-otbr-cli-meshdiag-topology.json</option>
          <option value="td-otbr-cli-networkdiag-topology.json">td-otbr-cli-networkdiag-topology.json</option>
          <option value="td-otbr-cli-meshdiag-router-neighbortables.json">td-otbr-cli-meshdiag-router-neighbortables.json</option>
          <option value="td-eve-topology.json">td-eve-topology.json</option>
          <option value="__merged__">merged: medium: otbr cli meshdiag, networkdiag, eve</option>
          <option value="td-merged-topology-all.json">merged: deep: otbr cli, restapi, eve - td-merged-topology-all.json</option>
        </select>

        <label for="node-filter">Node Filter:</label>
        <select id="node-filter">
          <option value="all">All Nodes</option>
          <option value="ftd-devices">Full Thread Devices (FTD)</option>
          <option value="mtd-devices">Minimal Thread Devices (MTD)</option>
          <option value="border-routers">Border Routers (rloc16 ends with 00, br=true)</option>
          <option value="main-routers">Main Routers (rloc16 ends with 00)</option>
          <option value="routers-with-children">Routers with Children Nodes</option>
          <option value="routers-without-children">Routers without Children Nodes</option>
        </select>

        <label for="diagnostic-filter">Diagnostic Filter:</label>
        <select id="diagnostic-filter">
          <option value="all">All Rows</option>
          <option value="medium-total-errors-pct">Mac - Total Error Packets % (>= 5%) - Medium</option>
          <option value="medium-total-errors-high">Mac - Total Error Packets (>= 10%) - High</option>
          <option value="medium-discard-pct">Mac - Total Discard Packets % (>= 15%) - High</option>
          <option value="medium-partition-changes">Mle - Partition Changes (>= 2) - Medium</option>
          <option value="high-partition-changes">Mle - Partition Changes (>= 5) - High</option>
          <option value="medium-parent-changes">Mle - Parent Changes (>= 2) - Medium</option>
          <option value="high-parent-changes">Mle - Parent Changes (>= 5) - High</option>
          <option value="router-neighbor-err-rate-frame-low">Router Neighbor - Err Rate Frame >= 2% - Low</option>
          <option value="router-neighbor-err-rate-frame-medium">Router Neighbor - Err Rate Frame >= 5% - Medium</option>
          <option value="router-neighbor-err-rate-frame-high">Router Neighbor - Err Rate Frame >= 10% - High</option>
          <option value="router-neighbor-err-rate-msg-low">Router Neighbor - Err Rate Msg >= 2% - Low</option>
          <option value="router-neighbor-err-rate-msg-medium">Router Neighbor - Err Rate Msg >= 5% - Medium</option>
          <option value="router-neighbor-err-rate-msg-high">Router Neighbor - Err Rate Msg >= 10% - High</option>
          <option value="router-neighbor-rss-very-low">Router Neighbor - RSS Ave < -80 dBm - Very Low (Bad)</option>
          <option value="router-neighbor-rss-low">Router Neighbor - RSS Ave Between -70 dBm To -80 dBm - Low (Fair)</option>
          <option value="router-neighbor-rss-medium">Router Neighbor - RSS Ave Between -60 dBm To -70 dBm - Medium (Good)</option>
          <option value="router-neighbor-rss-high">Router Neighbor - RSS Ave > -60 dBm - High (Excellent)</option>
        </select>
      </div>

      <div id="status">Loading dataset...</div>

      <div class="table-wrap">
        <table id="data-table" class="sortable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script>
      const datasetSelect = document.getElementById("dataset-select");
      const nodeFilterSelect = document.getElementById("node-filter");
      const diagnosticFilterSelect = document.getElementById("diagnostic-filter");
      const statusEl = document.getElementById("status");
      const theadEl = document.querySelector("#data-table thead");
      const tbodyEl = document.querySelector("#data-table tbody");
      let currentRows = [];
      let currentColumns = [];
      let currentDatasetLabel = "";
      const priorityColumns = [
        "rloc16",
        "extaddr",
        "device_label",
        "name",
        "room",
        "ID",
        "Extended MAC",
        "Next Hop",
        "Path Cost",
        "LQ In",
        "LQ Out",
        "Age",
        "type",
        "total_children",
        "total_links",
        "mode.device",
        "thread_stack_version",
        "mac_counters.iftotalerrors_pct",
        "mac_counters.iftotaldiscards_pct",
        "mle_counters.partitionidchanges",
        "mle_counters.betterpartitionattachattempts",
        "mle_counters.parentchanges",
      ];
      const MERGED_DATASET_VALUE = "__merged__";
      const MERGED_SOURCE_FILES = [
        "td-otbr-cli-meshdiag-topology.json",
        "td-otbr-cli-networkdiag-topology.json",
        "td-eve-topology.json",
      ];

      function isObject(value) {
        return value !== null && typeof value === "object" && !Array.isArray(value);
      }

      function formatCellValue(value, columnName) {
        if (value === null || value === undefined) {
          return "";
        }

        if (columnName === "routes") {
          const routeItems = Array.isArray(value) ? value : isObject(value) ? [value] : [];
          if (routeItems.length === 0) {
            return "[]";
          }

          const routeSummaries = routeItems
            .map((route) => {
              if (!isObject(route)) {
                return "";
              }

              const nestedTo = isObject(route.to) ? route.to : null;
              const toName =
                route.to_name ??
                (nestedTo ? nestedTo.name ?? nestedTo.to_name : "") ??
                "";
              const toRloc16 =
                route.to_rloc16 ??
                (nestedTo ? nestedTo.rloc16 ?? nestedTo.to_rloc16 : "") ??
                "";

              if (!toName && !toRloc16) {
                return "";
              }

              const safeName = toName ? String(toName) : "(no-name)";
              const safeRloc16 = toRloc16 ? String(toRloc16) : "(no-rloc16)";
              return `${safeName} (${safeRloc16})`;
            })
            .filter((item) => item);

          return routeSummaries.length > 0 ? routeSummaries.join("\n") : "[]";
        }

        if (Array.isArray(value) || isObject(value)) {
          try {
            return JSON.stringify(value);
          } catch (_error) {
            return String(value);
          }
        }

        return String(value);
      }

      function normalizeRows(rawData) {
        if (Array.isArray(rawData)) {
          return rawData.map((row, index) => {
            if (isObject(row)) {
              return row;
            }

            return {
              row_index: index,
              value: row,
            };
          });
        }

        if (isObject(rawData)) {
          const keys = Object.keys(rawData);
          return keys.map((key) => {
            const row = rawData[key];

            if (isObject(row)) {
              return {
                _row_key: key,
                ...row,
              };
            }

            return {
              _row_key: key,
              value: row,
            };
          });
        }

        return [{ value: rawData }];
      }

      function collectColumns(rows) {
        const columns = [];
        const seen = new Set();

        rows.forEach((row) => {
          Object.keys(row).forEach((key) => {
            if (!seen.has(key)) {
              seen.add(key);
              columns.push(key);
            }
          });
        });

        const pinned = priorityColumns.filter(
          (column) => seen.has(column) || rows.some((row) => hasNestedPath(row, column))
        );
        const remaining = columns.filter((column) => !pinned.includes(column));
        return [...pinned, ...remaining];
      }

      function hasNestedPath(value, path) {
        if (!path.includes(".")) {
          return Object.prototype.hasOwnProperty.call(value, path);
        }

        const parts = path.split(".");
        let current = value;

        for (const part of parts) {
          if (!isObject(current) || !Object.prototype.hasOwnProperty.call(current, part)) {
            return false;
          }
          current = current[part];
        }

        return true;
      }

      function getColumnValue(row, columnName) {
        if (Object.prototype.hasOwnProperty.call(row, columnName)) {
          return row[columnName];
        }

        if (!columnName.includes(".")) {
          return undefined;
        }

        const parts = columnName.split(".");
        let current = row;

        for (const part of parts) {
          if (!isObject(current) || !Object.prototype.hasOwnProperty.call(current, part)) {
            return undefined;
          }
          current = current[part];
        }

        return current;
      }

      function toText(value) {
        return value === undefined || value === null ? "" : String(value).trim();
      }

      function toFiniteNumber(value) {
        if (Number.isFinite(value)) {
          return value;
        }

        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : undefined;
      }

      function isRowVisibleByNodeFilter(row, filterMode) {
        if (filterMode === "all") {
          return true;
        }

        const modeDevice = toText(getColumnValue(row, "mode.device")).toUpperCase();
        const rloc16Text = toText(getColumnValue(row, "rloc16")).toLowerCase();
        const isMainRouter = rloc16Text.endsWith("00");
        const brValue = getColumnValue(row, "br");
        const isBorderRouter = isMainRouter && (brValue === true || toText(brValue).toLowerCase() === "true");

        const totalChildren = toFiniteNumber(getColumnValue(row, "total_children"));
        const childrenValue = getColumnValue(row, "children");
        const childrenCount = Array.isArray(childrenValue) ? childrenValue.length : undefined;
        const hasChildren = (Number.isFinite(totalChildren) && totalChildren > 0)
          || (Number.isFinite(childrenCount) && childrenCount > 0);
        const isRouter = isMainRouter || Number.isFinite(totalChildren) || Array.isArray(childrenValue);

        if (filterMode === "ftd-devices") {
          return modeDevice === "FTD";
        }

        if (filterMode === "mtd-devices") {
          return modeDevice === "MTD";
        }

        if (filterMode === "main-routers") {
          return isMainRouter;
        }

        if (filterMode === "border-routers") {
          return isBorderRouter;
        }

        if (filterMode === "routers-with-children") {
          return isRouter && hasChildren;
        }

        if (filterMode === "routers-without-children") {
          return isRouter && !hasChildren;
        }

        return true;
      }

      function isRowVisibleByDiagnosticFilter(row, filterMode) {
        if (filterMode === "all") {
          return true;
        }

        const getMetricValue = (path) => {
          const value = getColumnValue(row, path);
          return Number.isFinite(value) ? value : undefined;
        };
        
        if (filterMode === "medium-total-errors-pct") {
          const err = getMetricValue("mac_counters.iftotalerrors_pct");
          return Number.isFinite(err) && err >= 5;
        }
        
        if (filterMode === "medium-total-errors-high") {
          const err = getMetricValue("mac_counters.iftotalerrors_pct");
          return Number.isFinite(err) && err > 10;
        }
        
        if (filterMode === "medium-discard-pct") {
          const pkt = getMetricValue("mac_counters.iftotaldiscards_pct");
          return Number.isFinite(pkt) && pkt >= 15;
        }

        if (filterMode === "medium-partition-changes") {
          const part = getMetricValue("mle_counters.partitionidchanges");
          return Number.isFinite(part) && part >= 2;
        }

        if (filterMode === "high-partition-changes") {
          const part = getMetricValue("mle_counters.partitionidchanges");
          return Number.isFinite(part) && part >= 5;
        }

        if (filterMode === "medium-parent-changes") {
          const parent = getMetricValue("mle_counters.parentchanges");
          return Number.isFinite(parent) && parent >= 2;
        }

        if (filterMode === "high-parent-changes") {
          const parent = getMetricValue("mle_counters.parentchanges");
          return Number.isFinite(parent) && parent >= 5;
        }

        const routerNeighborTable = getColumnValue(row, "router_neighbor_table");
        const neighborRows = Array.isArray(routerNeighborTable) ? routerNeighborTable : [];
        const hasMatchingNeighbor = (predicate) => {
          return neighborRows.some((neighbor) => predicate(neighbor));
        };

        if (filterMode === "router-neighbor-err-rate-frame-low") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.err_rate_frame_pct);
            return Number.isFinite(value) && value >= 2;
          });
        }

        if (filterMode === "router-neighbor-err-rate-frame-medium") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.err_rate_frame_pct);
            return Number.isFinite(value) && value >= 5;
          });
        }

        if (filterMode === "router-neighbor-err-rate-frame-high") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.err_rate_frame_pct);
            return Number.isFinite(value) && value >= 10;
          });
        }

        if (filterMode === "router-neighbor-err-rate-msg-low") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.err_rate_msg_pct);
            return Number.isFinite(value) && value >= 2;
          });
        }

        if (filterMode === "router-neighbor-err-rate-msg-medium") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.err_rate_msg_pct);
            return Number.isFinite(value) && value >= 5;
          });
        }

        if (filterMode === "router-neighbor-err-rate-msg-high") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.err_rate_msg_pct);
            return Number.isFinite(value) && value >= 10;
          });
        }

        if (filterMode === "router-neighbor-rss-very-low") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.rss_ave);
            return Number.isFinite(value) && value < -80;
          });
        }

        if (filterMode === "router-neighbor-rss-low") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.rss_ave);
            return Number.isFinite(value) && value >= -80 && value < -70;
          });
        }

        if (filterMode === "router-neighbor-rss-medium") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.rss_ave);
            return Number.isFinite(value) && value >= -70 && value <= -60;
          });
        }

        if (filterMode === "router-neighbor-rss-high") {
          return hasMatchingNeighbor((neighbor) => {
            const value = toFiniteNumber(neighbor?.rss_ave);
            return Number.isFinite(value) && value > -60;
          });
        }

        return true;
      }

      function calculateColumnMaxLength(rows, column) {
        let maxLength = column.length;
        rows.forEach((row) => {
          const value = formatCellValue(getColumnValue(row, column), column);
          if (value) {
            const lines = value.split('\n');
            lines.forEach((line) => {
              maxLength = Math.max(maxLength, line.length);
            });
          }
        });
        return maxLength;
      }

      function getColumnWidthStyle(maxContentLength) {
        //const charToPixels = 7.8;
        const charToPixels = 8.8;
        const minWidth = 70;
        const maxWidth = 25 * charToPixels;
        let width;
        
        if (maxContentLength >= 25) {
          width = maxWidth;
        }
        else {
          width = Math.max(maxContentLength * charToPixels, minWidth);
        }
        
        return {
          width: `${width}px`
        };
      }

      function applyAllFilters(nodeFilterMode, diagnosticFilterMode) {
        const filteredRows = currentRows.filter((row) => {
          return isRowVisibleByNodeFilter(row, nodeFilterMode)
            && isRowVisibleByDiagnosticFilter(row, diagnosticFilterMode);
        });
        renderTable(filteredRows, currentColumns);

        const nodeFilterLabel = nodeFilterSelect.options[nodeFilterSelect.selectedIndex].text;
        const diagnosticFilterLabel = diagnosticFilterSelect.options[diagnosticFilterSelect.selectedIndex].text;
        statusEl.textContent = `Loaded ${currentDatasetLabel}. Total: ${currentRows.length} rows, ${currentColumns.length} columns. Showing: ${filteredRows.length} rows. Node Filter: ${nodeFilterLabel}. Diagnostic Filter: ${diagnosticFilterLabel}. Click a header to sort.`;
      }

      function normalizeRloc16(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value).trim().toLowerCase();
      }

      function mergeRowFields(target, source) {
        Object.keys(source).forEach((key) => {
          const sourceValue = source[key];
          const targetValue = target[key];

          if (targetValue === undefined || targetValue === null || targetValue === "") {
            target[key] = sourceValue;
          }
        });
      }

      function mergeRowsByRloc16(rowGroups) {
        const mergedMap = new Map();

        rowGroups.forEach((rows) => {
          rows.forEach((row) => {
            const normalizedKey = normalizeRloc16(row.rloc16);
            if (!normalizedKey) {
              return;
            }

            if (!mergedMap.has(normalizedKey)) {
              mergedMap.set(normalizedKey, { ...row });
              return;
            }

            const current = mergedMap.get(normalizedKey);
            mergeRowFields(current, row);
          });
        });

        return Array.from(mergedMap.values());
      }

      async function loadMergedDataset() {
        const responses = await Promise.all(
          MERGED_SOURCE_FILES.map((fileName) => fetch(fileName, { cache: "no-store" }))
        );

        responses.forEach((response, index) => {
          if (!response.ok) {
            throw new Error(`${MERGED_SOURCE_FILES[index]}: HTTP ${response.status}`);
          }
        });

        const rawDataList = await Promise.all(responses.map((response) => response.json()));
        const normalizedGroups = rawDataList.map((rawData) => normalizeRows(rawData));
        const mergedRows = mergeRowsByRloc16(normalizedGroups);
        const columns = collectColumns(mergedRows);

        currentRows = mergedRows;
        currentColumns = columns;
        currentDatasetLabel = "merged: meshdiag, networkdiagnostic, eve";
        nodeFilterSelect.value = "all";
        diagnosticFilterSelect.value = "all";
        applyAllFilters(nodeFilterSelect.value, diagnosticFilterSelect.value);
      }

      function renderTable(rows, columns) {
        theadEl.innerHTML = "";
        tbodyEl.innerHTML = "";

        const columnWidths = new Map();
        columns.forEach((column) => {
          const maxLength = calculateColumnMaxLength(rows, column);
          columnWidths.set(column, getColumnWidthStyle(maxLength));
        });

        const headRow = document.createElement("tr");
        columns.forEach((column) => {
          const th = document.createElement("th");
          th.textContent = column;
          const widthStyle = columnWidths.get(column);
          if (widthStyle) {
            Object.assign(th.style, widthStyle);
          }
          headRow.appendChild(th);
        });
        theadEl.appendChild(headRow);

        const bodyFragment = document.createDocumentFragment();
        rows.forEach((row) => {
          const tr = document.createElement("tr");
          columns.forEach((column) => {
            const td = document.createElement("td");
            td.textContent = formatCellValue(getColumnValue(row, column), column);
            const widthStyle = columnWidths.get(column);
            if (widthStyle) {
              Object.assign(td.style, widthStyle);
            }
            tr.appendChild(td);
          });
          bodyFragment.appendChild(tr);
        });
        tbodyEl.appendChild(bodyFragment);

        // Re-run SortableJS setup after replacing table content.
        if (window.Sortable && typeof window.Sortable.init === "function") {
          window.Sortable.init();
        }
      }

      async function loadDataset(fileName) {
        try {
          statusEl.textContent = `Loading ${fileName}...`;
          theadEl.innerHTML = "";
          tbodyEl.innerHTML = "";

          if (fileName === MERGED_DATASET_VALUE) {
            await loadMergedDataset();
            return;
          }

          const response = await fetch(fileName, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const rawData = await response.json();
          const rows = normalizeRows(rawData);
          const columns = collectColumns(rows);

          currentRows = rows;
          currentColumns = columns;
          currentDatasetLabel = fileName;
          nodeFilterSelect.value = "all";
          diagnosticFilterSelect.value = "all";
          applyAllFilters(nodeFilterSelect.value, diagnosticFilterSelect.value);
        } catch (error) {
          statusEl.textContent = `Failed to load dataset: ${error.message}`;
        }
      }

      datasetSelect.addEventListener("change", (event) => {
        loadDataset(event.target.value);
      });

      nodeFilterSelect.addEventListener("change", () => {
        applyAllFilters(nodeFilterSelect.value, diagnosticFilterSelect.value);
      });

      diagnosticFilterSelect.addEventListener("change", () => {
        applyAllFilters(nodeFilterSelect.value, diagnosticFilterSelect.value);
      });

      loadDataset(datasetSelect.value);
    </script>
  </body>
</html>
