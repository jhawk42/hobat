name: Delete Legacy TDash Package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type delete-tdash-package to delete every legacy package version
        required: true
        type: string

jobs:
  delete-legacy-package:
    if: ${{ inputs.confirmation == 'delete-tdash-package' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete all ghcr.io/${{ github.repository_owner }}/tdash versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_IDS=$(gh api --paginate \
            "/users/${{ github.repository_owner }}/packages/container/tdash/versions" \
            --jq '.[].id')

          if [[ -z "$VERSION_IDS" ]]; then
            echo "No legacy tdash package versions found."
            exit 0
          fi

          DELETED=0
          SKIPPED=0
          NON_DELETABLE_REASON="more than 5000 downloads cannot be deleted"
          while IFS= read -r version_id; do
            [ -z "$version_id" ] && continue
            echo "Deleting legacy tdash version ID: $version_id"
            if DELETE_OUTPUT=$(gh api --method DELETE \
              "/users/${{ github.repository_owner }}/packages/container/tdash/versions/$version_id" 2>&1); then
              DELETED=$((DELETED + 1))
            elif grep -Fq "$NON_DELETABLE_REASON" <<< "$DELETE_OUTPUT"; then
              echo "Skipping legacy tdash version ID $version_id: $NON_DELETABLE_REASON"
              SKIPPED=$((SKIPPED + 1))
            else
              echo "$DELETE_OUTPUT" >&2
              exit 1
            fi
          done <<< "$VERSION_IDS"

          echo "Deleted $DELETED legacy tdash package version(s); skipped $SKIPPED non-deletable public version(s)."