name: Run Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q -m "not requires_data_dir and not browser and not live and not benchmark" --cov=src --cov-branch --cov-report=term:skip-covered
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements_test.txt -r requirements_browser_test.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated dashboard smoke
        run: python -m pytest -q tests/browser -m "browser and not live and not benchmark"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-failure
          path: .pytest-browser-artifacts/
          if-no-files-found: ignore
