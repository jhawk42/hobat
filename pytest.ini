[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts = --strict-markers -m "not benchmark and not live"
markers =
    unit: isolated unit tests
    integration: local integration tests using synthetic or cached data
    frontend: browser-independent JavaScript or browser-facing tests
    benchmark: performance tests excluded from the default suite
    live: tests requiring live OTBR, mDNS, Docker, network, or internet access
    requires_data_dir: tests that read checked-in fixtures from the repo data/ directory
