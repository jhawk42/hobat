<!doctype html>
<html lang="en">
  <head>
    <title>Thread Mesh Network Topology</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style type="text/css">
      #mynetwork {
        width: 100%;
        height: 80vh;
        border: 1px solid lightgray;
      }

      body {
        margin: 0;
        font-family: sans-serif;
      }

      .page {
        padding: 12px;
      }

      h1 {
        margin: 0 0 12px 0;
        font-size: 18px;
      }

      #status {
        margin-bottom: 8px;
        color: #555;
        font-size: 14px;
      }

      .controls {
        margin-bottom: 8px;
      }

      .main-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 12px;
        align-items: start;
      }

      #node-filter {
        padding: 4px 6px;
        font-size: 14px;
      }

      #link-filter {
        margin-left: 10px;
        padding: 4px 6px;
        font-size: 14px;
      }

      #diagnostic-filter {
        margin-left: 10px;
        padding: 4px 6px;
        font-size: 14px;
      }

      #details {
        margin-top: 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px;
        background: #fafafa;
        max-height: 80vh;
        overflow: auto;
      }

      #details h2 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }

      #details-list {
        margin: 0;
        padding-left: 20px;
      }

      #details-list li {
        margin: 3px 0;
      }

      @media (max-width: 1000px) {
        .main-layout {
          grid-template-columns: 1fr;
        }

        #details {
          margin-top: 12px;
          max-height: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <h1>Thread Mesh Network Topology: meshdiag, networkdiag</h1>
      <div class="controls">
        <label for="dataset-select">Dataset:</label>
        <select id="dataset-select">
           <option value="default_topology">merged: otbr cli meshdiag, networkdiag</option>
           <option value="merged_detailed_topology">merged: deep: otbr cli, restapi, eve</option>
           <option value="eve_topology">eve topology</option>
        </select>

        <label for="node-filter">Node Filter:</label>
        <select id="node-filter">
          <option value="all">All Nodes</option>
          <option value="ftd-devices">Full Thread Devices (FTD)</option>
          <option value="mtd-devices">Minimal Thread Devices (MTD)</option>
          <option value="border-routers">Border Routers (rloc16 ends with 00, br=true)</option>
          <option value="main-routers">Main Routers (rloc16 ends with 00)</option>
          <option value="routers-with-children">Routers with Children Nodes</option>
          <option value="routers-without-children">Routers without Children Nodes</option>
        </select>

        <label for="link-filter">Link Filter:</label>
        <select id="link-filter">
          <option value="default_links">Default: router, children, 321 _links, childTable</option>
          <option value="default_plus_router_neighbors">Default plus: router neighbors</option>
          <option value="otbr_rest_api">OTBR: rest api (route routeData, childTable)</option>
          <option value="eve_routes_children">Eve: routes and children</option>
          <option value="all_links">All Links (large)</option>
        </select>

        <label for="diagnostic-filter">Diagnostic Filter:</label>
        <select id="diagnostic-filter">
          <option value="all">All Rows</option>
          <option value="medium-total-errors-pct">Medium Total Error Packets % (>= 5%)</option>
          <option value="medium-total-errors-high">Medium Total Error Packets (>= 10%)</option>
          <option value="medium-discard-pct">Medium Discard Packets % (>= 15%)</option>
          <option value="medium-partition-changes">Medium Partition Changes (>= 2)</option>
          <option value="high-partition-changes">High Partition Changes (>= 5)</option>
          <option value="medium-parent-changes">Medium Parent Changes (>= 2)</option>
          <option value="high-parent-changes">High Parent Changes (>= 5)</option>
        </select>
      </div>
      <div id="status">Loading topology...</div>
      <div class="main-layout">
        <div id="mynetwork"></div>
        <div id="details">
          <h2>Node Details</h2>
          <ul id="details-list">
            <li>Click a node to view its properties.</li>
          </ul>
        </div>
      </div>
    </div>

    <script>
    function toText(value) {
      return value === undefined || value === null ? '' : String(value).trim();
    }

    function toFiniteNumber(value) {
      if (Number.isFinite(value)) {
        return value;
      }
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : undefined;
    }

    function chooseNodeId(node, fallbackPrefix, index) {
      const rloc16 = toText(node.rloc16);
      if (rloc16) {
        return rloc16;
      }

      const idField = toText(node.id);
      if (idField) {
        return idField;
      }

      const extAddr = toText(node.extaddr);
      if (extAddr) {
        return extAddr;
      }

      return `${fallbackPrefix}-${index}`;
    }

    function buildLabel(node, resolvedId) {
      const nodeName = toText(node.device_label) || 'Unknown node';
      const rloc16 = toText(node.rloc16) || 'rloc16:n/a';
      const idField = toText(node.id) || resolvedId;
      return `${nodeName}\n${rloc16}`;
    }

    function buildEveLabel(node, resolvedId) {
      const nodeName = toText(node.name) || 'Unknown node';
      const rloc16 = toText(node.rloc16) || 'rloc16:n/a';
      return `${nodeName}\n${rloc16}`;
    }

    function isUnknownNodeName(nodeName) {
      return toText(nodeName).toLowerCase().startsWith('unknown');
    }

    function formatValue(value) {
      if (Array.isArray(value)) {
        return value.length === 0 ? '[]' : value.join(', ');
      }

      if (value && typeof value === 'object') {
        try {
          return JSON.stringify(value);
        } catch (_error) {
          return '[object]';
        }
      }

      if (typeof value === 'boolean') {
        return value ? 'true' : 'false';
      }

      return toText(value) || 'n/a';
    }

    function isPlainObject(value) {
      return value !== null && typeof value === 'object' && !Array.isArray(value);
    }

    function mergeForDisplay(primary, secondary) {
      if (primary === undefined || primary === null) {
        return secondary;
      }

      if (secondary === undefined || secondary === null) {
        return primary;
      }

      if (Array.isArray(primary) && Array.isArray(secondary)) {
        return secondary.length > 0 ? secondary : primary;
      }

      if (isPlainObject(primary) && isPlainObject(secondary)) {
        const merged = {};
        const keys = new Set([...Object.keys(primary), ...Object.keys(secondary)]);
        keys.forEach((key) => {
          merged[key] = mergeForDisplay(primary[key], secondary[key]);
        });
        return merged;
      }

      return secondary;
    }

    function flattenObjectEntries(value, path = '', entries = []) {
      if (isPlainObject(value)) {
        const keys = Object.keys(value).sort((a, b) => a.localeCompare(b));
        if (keys.length === 0 && path) {
          entries.push([path, {}]);
          return entries;
        }

        keys.forEach((key) => {
          const nextPath = path ? `${path}.${key}` : key;
          flattenObjectEntries(value[key], nextPath, entries);
        });
        return entries;
      }

      if (Array.isArray(value)) {
        if (value.length === 0) {
          entries.push([path, []]);
          return entries;
        }

        const allObjects = value.every((item) => isPlainObject(item));
        if (allObjects) {
          value.forEach((item, index) => {
            const itemPath = `${path}[${index}]`;
            flattenObjectEntries(item, itemPath, entries);
          });
          return entries;
        }

        entries.push([path, value]);
        return entries;
      }

      entries.push([path || 'value', value]);
      return entries;
    }

    function shouldExcludeDetailPath(path) {
      const normalizedPath = toText(path);
      if (!normalizedPath) {
        return false;
      }

      if (normalizedPath === '1_links' || normalizedPath.startsWith('1_links[')) {
        return true;
      }

      if (normalizedPath === '2_links' || normalizedPath.startsWith('2_links[')) {
        return true;
      }

      if (normalizedPath === '3_links' || normalizedPath.startsWith('3_links[')) {
        return true;
      }

      if (normalizedPath === 'children' || normalizedPath.startsWith('children[')) {
        return true;
      }

      return false;
    }

    function sortDetailsWithPriority(details) {
      const priorityKeys = [
        'rloc16',
        'extaddr',
        'device_label',
        'name',
        'type',
        'br',
        'mode.device',
        'thread_stack_version',
        'ver',
        'total_links',
        'total_children',
        'mac_counters.iftotaldiscards_pct',
        'mac_counters.iftotalerrors_pct',
        'mle_counters.partitionidchanges',
        'mle_counters.betterpartitionattachattempts',
        'mle_counters.parentchanges'
      ];

      const priorityIndex = new Map();
      priorityKeys.forEach((key, index) => {
        priorityIndex.set(key, index);
      });

      return [...details].sort((a, b) => {
        const aKey = a[0];
        const bKey = b[0];
        const aPriority = priorityIndex.has(aKey) ? priorityIndex.get(aKey) : Number.POSITIVE_INFINITY;
        const bPriority = priorityIndex.has(bKey) ? priorityIndex.get(bKey) : Number.POSITIVE_INFINITY;

        if (aPriority !== bPriority) {
          return aPriority - bPriority;
        }

        return aKey.localeCompare(bKey);
      });
    }

    function addEdge(edgeMap, edgeData, from, to, style) {
      if (!from || !to || from === to) {
        return;
      }

      const edgeKeySuffix = toText(style.edgeKeySuffix);
      const keyBase = [from, to].sort().join('|');
      const key = edgeKeySuffix ? `${keyBase}|${edgeKeySuffix}` : keyBase;
      const existingEdge = edgeMap.get(key);
      if (existingEdge) {
        if (Number.isFinite(style.width)) {
          existingEdge.width = Math.max(existingEdge.width || 0, style.width);
        }
        const mergedCategories = new Set([
          ...normalizeLinkCategories(existingEdge.linkCategories),
          ...normalizeLinkCategories(style.linkCategories)
        ]);
        existingEdge.linkCategories = Array.from(mergedCategories);
        if (style.isParentChild === true) {
          existingEdge.isParentChild = true;
        }
        return;
      }

      const { edgeKeySuffix: _edgeKeySuffix, ...edgeStyle } = style;
      const edge = { from, to, ...edgeStyle };
      edge.id = key;
      edge.baseHidden = style.hidden === true;
      edge.linkCategories = normalizeLinkCategories(style.linkCategories);
      edgeMap.set(key, edge);
      edgeData.push(edge);
    }

    const LINK_FILTER_DEFAULT = 'default_links';
    const LINK_FILTER_DEFAULT_PLUS_NEIGHBORS = 'default_plus_router_neighbors';
    const LINK_FILTER_OTBR_REST_API = 'otbr_rest_api';
    const LINK_FILTER_EVE = 'eve_routes_children';
    const LINK_FILTER_ALL = 'all_links';

    const EDGE_CATEGORY_DEFAULT_CHILDREN = 'default_children';
    const EDGE_CATEGORY_DEFAULT_1 = 'default_1_links';
    const EDGE_CATEGORY_DEFAULT_2 = 'default_2_links';
    const EDGE_CATEGORY_DEFAULT_3 = 'default_3_links';
    const EDGE_CATEGORY_ROUTER_NEIGHBOR = 'router_neighbor';
    const EDGE_CATEGORY_OTBR_ROUTE = 'otbr_route';
    const EDGE_CATEGORY_OTBR_CHILD = 'otbr_child';
    const EDGE_CATEGORY_EVE_ROUTE = 'eve_route';
    const EDGE_CATEGORY_EVE_CHILD = 'eve_child';

    function normalizeLinkCategories(value) {
      if (Array.isArray(value)) {
        return value.filter((item) => toText(item));
      }

      const text = toText(value);
      return text ? [text] : [];
    }

    function edgeMatchesLinkFilter(edge, linkFilterMode) {
      const categories = normalizeLinkCategories(edge.linkCategories);
      if (categories.length === 0) {
        return linkFilterMode === LINK_FILTER_ALL;
      }

      const hasAny = (...wanted) => wanted.some((item) => categories.includes(item));

      if (linkFilterMode === LINK_FILTER_DEFAULT || linkFilterMode === 'linksdefault_') {
        return hasAny(
          EDGE_CATEGORY_DEFAULT_CHILDREN,
          EDGE_CATEGORY_DEFAULT_1,
          EDGE_CATEGORY_DEFAULT_2,
          EDGE_CATEGORY_DEFAULT_3,
          EDGE_CATEGORY_OTBR_CHILD
        );
      }

      if (linkFilterMode === LINK_FILTER_DEFAULT_PLUS_NEIGHBORS) {
        return hasAny(
          EDGE_CATEGORY_DEFAULT_CHILDREN,
          EDGE_CATEGORY_DEFAULT_1,
          EDGE_CATEGORY_DEFAULT_2,
          EDGE_CATEGORY_DEFAULT_3,
          EDGE_CATEGORY_OTBR_CHILD,
          EDGE_CATEGORY_ROUTER_NEIGHBOR
        );
      }

      if (linkFilterMode === LINK_FILTER_OTBR_REST_API) {
        return hasAny(EDGE_CATEGORY_OTBR_ROUTE, EDGE_CATEGORY_OTBR_CHILD);
      }

      if (linkFilterMode === LINK_FILTER_EVE) {
        return hasAny(EDGE_CATEGORY_EVE_ROUTE, EDGE_CATEGORY_EVE_CHILD);
      }

      if (linkFilterMode === LINK_FILTER_ALL) {
        return true;
      }

      return false;
    }

    function buildMainRouterRloc16(routeId) {
      const routeNumber = toFiniteNumber(routeId);
      if (!Number.isFinite(routeNumber)) {
        return '';
      }

      return `0x${(routeNumber << 10).toString(16).padStart(4, '0')}`;
    }

    function buildChildRloc16(parentRloc16, childId) {
      const parentText = toText(parentRloc16).toLowerCase();
      const childNumber = toFiniteNumber(childId);
      if (!parentText.startsWith('0x') || !Number.isFinite(childNumber)) {
        return '';
      }

      const parentNumber = Number.parseInt(parentText, 16);
      if (!Number.isFinite(parentNumber)) {
        return '';
      }

      return `0x${(parentNumber + childNumber).toString(16).padStart(4, '0')}`;
    }

    async function fetchJson(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`${path} returned HTTP ${response.status}`);
      }
      return response.json();
    }

    async function processEveTopology(container, status, detailsList, nodeFilter, diagnosticFilter, eveData, network, nodesDataset, edgesDataset) {
      const nodeMap = new Map();
      const eveNodeById = new Map();
      const edgeMap = new Map();
      const edgeData = [];
      const routerIdsWithChildren = new Set();

      function upsertEveNode(nodeId, rawNode, style) {
        const existing = nodeMap.get(nodeId);
        const merged = {
          id: nodeId,
          name: toText(rawNode.name) || (existing ? existing.name : ''),
          device_label: toText(rawNode.device_label) || (existing ? existing.device_label : ''),
          rloc16: toText(rawNode.rloc16) || (existing ? existing.rloc16 : ''),
          source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
          extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
          type: toText(rawNode.type) || (existing ? existing.type : ''),
          thread_stack_version: toText(rawNode.thread_stack_version) || (existing ? existing.thread_stack_version : ''),
          total_children: Number.isFinite(rawNode.total_children) ? rawNode.total_children : (existing ? existing.total_children : 0),
          total_links: Number.isFinite(rawNode.total_links) ? rawNode.total_links : (existing ? existing.total_links : 0),
          iftotalpktserrorsdiscards_pct: Number.isFinite(rawNode.mac_counters?.iftotalpktserrorsdiscards_pct) ? rawNode.mac_counters.iftotalpktserrorsdiscards_pct : (existing?.iftotalpktserrorsdiscards_pct),
          iftotalerrors_pct: Number.isFinite(rawNode.mac_counters?.iftotalerrors_pct) ? rawNode.mac_counters.iftotalerrors_pct : (existing?.iftotalerrors_pct),
          mode_device: toText(rawNode.mode?.device) || (existing ? existing.mode_device : ''),
          partitionidchanges: Number.isFinite(rawNode.mle_counters?.partitionidchanges) ? rawNode.mle_counters.partitionidchanges : (existing?.partitionidchanges),
          parentchanges: Number.isFinite(rawNode.mle_counters?.parentchanges) ? rawNode.mle_counters.parentchanges : (existing?.parentchanges),
          br: rawNode.br === true || (existing ? existing.br === true : false),
          from_eve: true,
          shape: style.shape || (existing ? existing.shape : 'box'),
          color: style.color || (existing ? existing.color : { background: '#e8f5e9', border: '#2e7d32' })
        };
        if (merged.br) {
          merged.color = { background: '#ffd9d9', border: '#c62828' };
        }
        nodeMap.set(nodeId, merged);
      }

      eveData.forEach((node) => {
        const eveNodeId = toText(node.id);
        if (!eveNodeId) return;
        eveNodeById.set(eveNodeId, node);
        upsertEveNode(eveNodeId, node, {
          source: 'eve',
          shape: 'box',
          color: node.br ? { background: '#ffd9d9', border: '#c62828' } : { background: '#e8f5e9', border: '#2e7d32' }
        });
      });

      for (const node of eveData) {
        const fromId = toText(node.id);
        if (!fromId) continue;
        const routes = Array.isArray(node.routes) ? node.routes : [];
        routes.forEach((route) => {
          const toId = toText(route.to);
          if (!toId) return;
          if (!nodeMap.has(toId)) {
            upsertEveNode(toId, { id: toId }, { source: 'eve', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } });
          }
          const lqiIn = toFiniteNumber(route.in);
          const lqiOut = toFiniteNumber(route.out);
          const avgLqi = (Number.isFinite(lqiIn) && Number.isFinite(lqiOut)) ? (lqiIn + lqiOut) / 2 : (lqiIn || lqiOut);
          let edgeWidth = 1.5;
          if (Number.isFinite(avgLqi)) {
            if (avgLqi >= 200) edgeWidth = 3;
            else if (avgLqi >= 150) edgeWidth = 2;
          }
          addEdge(edgeMap, edgeData, fromId, toId, { width: edgeWidth });
        });
        const children = Array.isArray(node.children) ? node.children : [];
        children.forEach((child) => {
          const childNodeId = toText(typeof child === 'string' ? child : child.id);
          if (!childNodeId) return;
          if (!nodeMap.has(childNodeId)) {
            upsertEveNode(childNodeId, { id: childNodeId }, { source: 'eve', shape: 'ellipse', color: { background: '#fff4cc', border: '#d9a400' } });
          }
          addEdge(edgeMap, edgeData, fromId, childNodeId, { dashes: true, isParentChild: true });
          routerIdsWithChildren.add(fromId);
        });
      }

      return { nodeMap, eveNodeById, edgeData, routerIdsWithChildren };
    }

    async function loadAndRenderTopology() {
      const container = document.getElementById('mynetwork');
      const status = document.getElementById('status');
      const detailsList = document.getElementById('details-list');
      const nodeFilter = document.getElementById('node-filter');
      const linkFilter = document.getElementById('link-filter');
      const diagnosticFilter = document.getElementById('diagnostic-filter');
      const datasetSelect = document.getElementById('dataset-select');

      function isNodeVisibleByFilter(node, filterMode) {
        if (filterMode === 'ftd-devices') {
          return toText(node.mode_device).toUpperCase() === 'FTD';
        }
        if (filterMode === 'mtd-devices') {
          return toText(node.mode_device).toUpperCase() === 'MTD';
        }
        if (filterMode === 'main-routers') {
          return node.isMainRouter === true;
        }
        if (filterMode === 'border-routers') {
          return node.isBorderRouter === true;
        }
        if (filterMode === 'routers-with-children') {
          return node.isRouter === true && node.hasChildren === true;
        }
        if (filterMode === 'routers-without-children') {
          return node.isRouter === true && node.hasChildren !== true;
        }
        return true;
      }

      function isNodeVisibleByDiagnosticFilter(node, filterMode) {
        if (filterMode === 'medium-discard-pct') {
          return Number.isFinite(node.iftotalpktserrorsdiscards_pct)
            && node.iftotalpktserrorsdiscards_pct >= 15;
        }
        if (filterMode === 'medium-total-errors-pct') {
          return Number.isFinite(node.iftotalerrors_pct)
            && node.iftotalerrors_pct >= 5;
        }
        if (filterMode === 'medium-total-errors-high') {
          return Number.isFinite(node.iftotalerrors_pct)
            && node.iftotalerrors_pct > 10;
        }
        if (filterMode === 'medium-partition-changes') {
          return Number.isFinite(node.partitionidchanges)
            && node.partitionidchanges >= 2;
        }
        if (filterMode === 'high-partition-changes') {
          return Number.isFinite(node.partitionidchanges)
            && node.partitionidchanges >= 5;
        }
        if (filterMode === 'medium-parent-changes') {
          return Number.isFinite(node.parentchanges)
            && node.parentchanges >= 2;
        }
        if (filterMode === 'high-parent-changes') {
          return Number.isFinite(node.parentchanges)
            && node.parentchanges >= 5;
        }
        return true;
      }

      async function loadMeshdiagNetworkdiag() {
        try {
          const [meshResult, ndResult, neighborResult, restApiResult] = await Promise.allSettled([
            fetchJson('./thread-meshdiag-topology.json'),
            fetchJson('./thread-networkdiagnostic-topology.json'),
            fetchJson('./thread-meshdiag-routerneighbortables.json'),
            fetchJson('./thread-restapi-diagnostics.json')
          ]);

          const meshdiag = meshResult.status === 'fulfilled' && Array.isArray(meshResult.value) ? meshResult.value : [];
          const networkDiag = ndResult.status === 'fulfilled' && Array.isArray(ndResult.value) ? ndResult.value : [];
          const routerNeighborTables = neighborResult.status === 'fulfilled' && Array.isArray(neighborResult.value) ? neighborResult.value : [];
          const restApiDiagnostics = restApiResult.status === 'fulfilled' && Array.isArray(restApiResult.value?.data)
            ? restApiResult.value.data
                .map((item) => ({
                  id: item.id,
                  type: item.type,
                  ...(item.attributes || {})
                }))
                .filter((item) => item && typeof item === 'object')
            : [];

        if (meshdiag.length === 0 && networkDiag.length === 0) {
          throw new Error('Could not load either topology JSON file.');
        }

        const nodeMap = new Map();
        const meshdiagNodeById = new Map();
        const networkDiagNodeById = new Map();
        const restApiNodeById = new Map();
        const meshIdToUnifiedId = new Map();
        const edgeMap = new Map();
        const edgeData = [];
        const routerIdsWithChildren = new Set();
        const routerNeighborByRloc16 = new Map();

        function upsertNode(nodeId, rawNode, style) {
          const existing = nodeMap.get(nodeId);
          const rawIpv6 = Array.isArray(rawNode.ipv6_addrs) ? rawNode.ipv6_addrs : [];

          const existingIpv6 = existing && Array.isArray(existing.ipv6_addrs)
            ? existing.ipv6_addrs
            : [];

          const mergedIpv6 = rawIpv6.length > 0 ? rawIpv6 : existingIpv6;

          const rawChildren = Array.isArray(rawNode.children) ? rawNode.children : [];
          const rawChildrenCount = rawChildren.length;
          const rawPacketErrorDiscardPct = rawNode.mac_counters && Number.isFinite(rawNode.mac_counters.iftotalpktserrorsdiscards_pct)
            ? rawNode.mac_counters.iftotalpktserrorsdiscards_pct
            : undefined;
          const rawTotalErrorsPct = rawNode.mac_counters && Number.isFinite(rawNode.mac_counters.iftotalerrors_pct)
            ? rawNode.mac_counters.iftotalerrors_pct
            : undefined;
          const rawModeDevice = rawNode.mode && toText(rawNode.mode.device)
            ? toText(rawNode.mode.device)
            : (rawNode.mode?.deviceTypeFTD === true ? 'FTD' : (rawNode.mode?.deviceTypeFTD === false ? 'MTD' : ''));
          const rawPartitionIdChanges = rawNode.mle_counters && Number.isFinite(rawNode.mle_counters.partitionidchanges)
            ? rawNode.mle_counters.partitionidchanges
            : undefined;
          const rawParentChanges = rawNode.mle_counters && Number.isFinite(rawNode.mle_counters.parentchanges)
            ? rawNode.mle_counters.parentchanges
            : undefined;

          const merged = {
            id: nodeId,
            device_label: toText(rawNode.device_label) || (existing ? existing.device_label : ''),
            rloc16: toText(rawNode.rloc16) || (existing ? existing.rloc16 : ''),
            source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
            extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
            type: toText(rawNode.type) || (existing ? existing.type : ''),
            thread_stack_version: toText(rawNode.thread_stack_version) || (existing ? existing.thread_stack_version : ''),
            ipv6_addrs: mergedIpv6,
            ipv6_count: mergedIpv6.length,
            total_children: Number.isFinite(rawNode.total_children)
              ? rawNode.total_children
              : (rawChildrenCount || (existing ? existing.total_children : 0)),
            total_links: Number.isFinite(rawNode.total_links)
              ? rawNode.total_links
              : (existing ? existing.total_links : 0),
            iftotalpktserrorsdiscards_pct: Number.isFinite(rawPacketErrorDiscardPct)
              ? rawPacketErrorDiscardPct
              : (existing && Number.isFinite(existing.iftotalpktserrorsdiscards_pct)
                ? existing.iftotalpktserrorsdiscards_pct
                : undefined),
            iftotalerrors_pct: Number.isFinite(rawTotalErrorsPct)
              ? rawTotalErrorsPct
              : (existing && Number.isFinite(existing.iftotalerrors_pct)
                ? existing.iftotalerrors_pct
                : undefined),
            mode_device: rawModeDevice || (existing ? existing.mode_device : ''),
            partitionidchanges: Number.isFinite(rawPartitionIdChanges)
              ? rawPartitionIdChanges
              : (existing && Number.isFinite(existing.partitionidchanges)
                ? existing.partitionidchanges
                : undefined),
            parentchanges: Number.isFinite(rawParentChanges)
              ? rawParentChanges
              : (existing && Number.isFinite(existing.parentchanges)
                ? existing.parentchanges
                : undefined),
            br: rawNode.br === true || (existing ? existing.br === true : false),
            from_meshdiag: (style.source === 'meshdiag') || (existing ? existing.from_meshdiag === true : false),
            from_networkdiagnostic: (style.source === 'networkdiagnostic') || (existing ? existing.from_networkdiagnostic === true : false),
            shape: style.shape || (existing ? existing.shape : 'box'),
            color: style.color || (existing ? existing.color : { background: '#d9ecff', border: '#1565c0' })
          };

          if (merged.br) {
            merged.color = { background: '#ffd9d9', border: '#c62828' };
          }

          nodeMap.set(nodeId, merged);
        }

        function ensureNode(nodeId, rawNode, style) {
          if (!nodeId) {
            return '';
          }

          if (!nodeMap.has(nodeId)) {
            upsertNode(nodeId, rawNode, style);
          }

          return nodeId;
        }

        meshdiag.forEach((node, index) => {
          const unifiedId = chooseNodeId(node, 'meshdiag-node', index + 1);
          meshdiagNodeById.set(unifiedId, node);
          const meshRawId = toText(node.id);
          if (meshRawId) {
            meshIdToUnifiedId.set(meshRawId, unifiedId);
          }

          upsertNode(unifiedId, node, {
            source: 'meshdiag',
            shape: 'box',
            color: node.br
              ? { background: '#ffd9d9', border: '#c62828' }
              : { background: '#d9ecff', border: '#1565c0' }
          });
        });

        networkDiag.forEach((node, index) => {
          const unifiedId = chooseNodeId(node, 'netdiag-node', index + 1);
          networkDiagNodeById.set(unifiedId, node);
          upsertNode(unifiedId, node, {
            source: 'networkdiagnostic',
            shape: 'box',
            color: { background: '#d9ecff', border: '#1565c0' }
          });
        });

        restApiDiagnostics.forEach((node, index) => {
          const unifiedId = chooseNodeId(node, 'restapi-node', index + 1);
          restApiNodeById.set(unifiedId, node);
          upsertNode(unifiedId, node, {
            source: 'networkdiagnostic',
            shape: 'box',
            color: { background: '#d9ecff', border: '#1565c0' }
          });
        });

        routerNeighborTables.forEach((row) => {
          const rloc16 = toText(row.rloc16).toLowerCase();
          if (rloc16) {
            routerNeighborByRloc16.set(rloc16, row);
          }
        });

        for (const node of meshdiag) {
          const fromId = chooseNodeId(node, 'meshdiag-parent', 0);

          const children = Array.isArray(node.children) ? node.children : [];
          children.forEach((child, childIndex) => {
            const childId = toText(child.rloc16) || `${fromId}-child-${childIndex + 1}`;
            upsertNode(childId, {
              device_label: toText(child.device_label),
              rloc16: toText(child.rloc16),
              id: childId
            }, {
              source: 'meshdiag',
              shape: 'ellipse',
              color: { background: '#fff4cc', border: '#d9a400' }
            });

            addEdge(edgeMap, edgeData, fromId, childId, {
              dashes: true,
              isParentChild: true,
              linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN]
            });
            routerIdsWithChildren.add(fromId);
          });

          const linkStyleByField = {
            '1_links': { width: 1 },
            '2_links': { width: 2 },
            '3_links': { width: 4 }
          };

          ['3_links', '2_links', '1_links'].forEach((field) => {
            const links = Array.isArray(node[field]) ? node[field] : [];
            links.forEach((link) => {
              const linkMeshId = toText(link.id);
              const toId = meshIdToUnifiedId.get(linkMeshId) || toText(link.rloc16) || linkMeshId;
              if (!toId) {
                return;
              }

              if (!nodeMap.has(toId)) {
                upsertNode(toId, {
                  device_label: toText(link.device_label),
                  rloc16: toText(link.rloc16),
                  id: linkMeshId || toId
                }, {
                  source: 'meshdiag',
                  shape: 'box',
                  color: { background: '#e8f5e9', border: '#2e7d32' }
                });
              }

              addEdge(edgeMap, edgeData, fromId, toId, {
                ...(linkStyleByField[field] || {}),
                linkCategories: [
                  field === '3_links' ? EDGE_CATEGORY_DEFAULT_3 :
                  field === '2_links' ? EDGE_CATEGORY_DEFAULT_2 :
                  EDGE_CATEGORY_DEFAULT_1
                ]
              });
            });
          });

          const neighborRow = routerNeighborByRloc16.get(toText(node.rloc16).toLowerCase());
          const neighborLinks = Array.isArray(neighborRow?.router_neighbor_table) ? neighborRow.router_neighbor_table : [];
          neighborLinks.forEach((neighbor) => {
            const toId = ensureNode(
              toText(neighbor.rloc16) || toText(neighbor.extaddr),
              {
                rloc16: toText(neighbor.rloc16),
                extaddr: toText(neighbor.extaddr),
                device_label: toText(neighbor.device_label),
                id: toText(neighbor.rloc16) || toText(neighbor.extaddr)
              },
              {
                source: 'meshdiag',
                shape: 'box',
                color: { background: '#e8f5e9', border: '#2e7d32' }
              }
            );
            addEdge(edgeMap, edgeData, fromId, toId, {
              width: 1.5,
              linkCategories: [EDGE_CATEGORY_ROUTER_NEIGHBOR]
            });
          });
        }

        for (const node of networkDiag) {
          const fromId = chooseNodeId(node, 'netdiag-parent', 0);
          const children = Array.isArray(node.children) ? node.children : [];

          children.forEach((child, childIndex) => {
            const childId = toText(child.rloc16) || `${fromId}-child-${childIndex + 1}`;
            upsertNode(childId, {
              device_label: toText(child.device_label),
              rloc16: toText(child.rloc16),
              id: childId
            }, {
              source: 'networkdiagnostic',
              shape: 'ellipse',
              color: { background: '#fff4cc', border: '#d9a400' }
            });

            addEdge(edgeMap, edgeData, fromId, childId, {
              dashes: true,
              isParentChild: true,
              linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN]
            });
            routerIdsWithChildren.add(fromId);
          });
        }

        restApiDiagnostics.forEach((node) => {
          const fromId = chooseNodeId(node, 'restapi-parent', 0);

          const routeEntries = Array.isArray(node.route?.routeData) ? node.route.routeData : [];
          routeEntries.forEach((route) => {
            const toRloc16 = buildMainRouterRloc16(route.routeId);
            const toId = ensureNode(
              toRloc16,
              {
                rloc16: toRloc16,
                id: toRloc16,
                device_label: toRloc16
              },
              {
                source: 'networkdiagnostic',
                shape: 'box',
                color: { background: '#d9ecff', border: '#1565c0' }
              }
            );

            addEdge(edgeMap, edgeData, fromId, toId, {
              width: 1.5,
              linkCategories: [EDGE_CATEGORY_OTBR_ROUTE]
            });
          });

          const childEntries = Array.isArray(node.childTable) ? node.childTable : [];
          childEntries.forEach((child, childIndex) => {
            const childRloc16 = buildChildRloc16(node.rloc16, child.childId);
            const childId = ensureNode(
              childRloc16 || `${fromId}-rest-child-${childIndex + 1}`,
              {
                rloc16: childRloc16,
                id: childRloc16 || `${fromId}-rest-child-${childIndex + 1}`,
                device_label: childRloc16 || `${fromId} child ${child.childId}`
              },
              {
                source: 'networkdiagnostic',
                shape: 'ellipse',
                color: { background: '#fff4cc', border: '#d9a400' }
              }
            );

            addEdge(edgeMap, edgeData, fromId, childId, {
              dashes: true,
              isParentChild: true,
              linkCategories: [EDGE_CATEGORY_OTBR_CHILD]
            });
            routerIdsWithChildren.add(fromId);
          });
        });

        const nodeData = Array.from(nodeMap.values()).map((node) => {
          const unknown = isUnknownNodeName(node.device_label);
          const rloc16Text = toText(node.rloc16).toLowerCase();
          const isRouter = node.shape !== 'ellipse';
          const hasChildren = routerIdsWithChildren.has(node.id);
          const isMainRouter = rloc16Text.endsWith('00');
          const isBorderRouter = isMainRouter && node.br === true;
          const isHighDiscardError = Number.isFinite(node.iftotalpktserrorsdiscards_pct)
            && node.iftotalpktserrorsdiscards_pct >= 50;
          let borderWidth = 1;
          let fontSize = 13;
          if (isBorderRouter) {
            borderWidth = 5;
            fontSize = 19.5;
          } else if (isRouter) {
            borderWidth = 3;
            fontSize = 19.5;
          }

          return {
            id: node.id,
            label: buildLabel(node, node.id),
            shape: node.shape,
            color: node.color,
            font: { size: fontSize, face: 'monospace', multi: 'md' },
            group: unknown ? 'unknown' : 'known',
            isRouter,
            hasChildren,
            isMainRouter,
            isBorderRouter,
            isHighDiscardError,
            borderWidth,
            iftotalpktserrorsdiscards_pct: node.iftotalpktserrorsdiscards_pct,
            iftotalerrors_pct: node.iftotalerrors_pct,
            mode_device: node.mode_device,
            partitionidchanges: node.partitionidchanges,
            parentchanges: node.parentchanges
          };
        });

        const nodeDegree = new Map();
        for (const edge of edgeData) {
          nodeDegree.set(edge.from, (nodeDegree.get(edge.from) || 0) + 1);
          nodeDegree.set(edge.to, (nodeDegree.get(edge.to) || 0) + 1);
        }

        const unknownNodeIds = nodeData
          .filter((node) => node.group === 'unknown' && (nodeDegree.get(node.id) || 0) === 0)
          .map((node) => node.id);

        if (unknownNodeIds.length > 1) {
          const anchorId = unknownNodeIds[0];

          for (let i = 1; i < unknownNodeIds.length; i += 1) {
            addEdge(edgeMap, edgeData, anchorId, unknownNodeIds[i], {
              hidden: true,
              physics: true,
              length: 60,
              color: { opacity: 0 }
            });
          }
        }

        if (unknownNodeIds.length > 0) {
          const knownAnchorCandidates = nodeData.filter((node) => {
            return node.group !== 'unknown' && (nodeDegree.get(node.id) || 0) > 0;
          });

          if (knownAnchorCandidates.length > 0) {
            knownAnchorCandidates.sort((a, b) => {
              return (nodeDegree.get(b.id) || 0) - (nodeDegree.get(a.id) || 0);
            });

            addEdge(edgeMap, edgeData, unknownNodeIds[0], knownAnchorCandidates[0].id, {
              hidden: true,
              physics: true,
              length: 180,
              color: { opacity: 0 }
            });
          }
        }

        const nodesDataset = new vis.DataSet(nodeData);
        const edgesDataset = new vis.DataSet(edgeData);

        const data = {
          nodes: nodesDataset,
          edges: edgesDataset
        };

        const options = {
          layout: {
            improvedLayout: true,
            randomSeed: 7
          },
          nodes: {
            font: { size: 13, face: 'monospace', multi: 'md' },
            margin: 10,
            widthConstraint: { maximum: 260 }
          },
          groups: {
            unknown: {
              color: { background: '#f2f2f2', border: '#808080' }
            }
          },
          edges: {
            color: '#8a8a8a',
            width: 1.5,
            smooth: false
          },
          physics: {
            barnesHut: {
              gravitationalConstant: -9500,
              centralGravity: 0.15,
              springLength: 300,
              springConstant: 0.01,
              damping: 0.22,
              avoidOverlap: 1
            },
            stabilization: {
              enabled: true,
              iterations: 1500,
              updateInterval: 25
            }
          },
          interaction: {
            hover: true,
            navigationButtons: true
          }
        };

        const network = new vis.Network(container, data, options);

        function applyFilters(nodeFilterMode, linkFilterMode, diagnosticFilterMode) {
          const visibleNodeIds = new Set();
          let visibleEdgeCount = 0;

          nodesDataset.forEach((node) => {
            const visible = isNodeVisibleByFilter(node, nodeFilterMode)
              && isNodeVisibleByDiagnosticFilter(node, diagnosticFilterMode);
            if (visible) {
              visibleNodeIds.add(node.id);
            }
          });

          if (nodeFilterMode === 'routers-with-children') {
            edgesDataset.forEach((edge) => {
              if (edge.isParentChild === true
                && edgeMatchesLinkFilter(edge, linkFilterMode)
                && visibleNodeIds.has(edge.from)) {
                visibleNodeIds.add(edge.to);
              }
            });
          }

          nodesDataset.forEach((node) => {
            nodesDataset.update({ id: node.id, hidden: !visibleNodeIds.has(node.id) });
          });

          edgesDataset.forEach((edge) => {
            const endpointsVisible = visibleNodeIds.has(edge.from) && visibleNodeIds.has(edge.to);
            const shouldShow = edge.baseHidden !== true
              && endpointsVisible
              && edgeMatchesLinkFilter(edge, linkFilterMode);
            edgesDataset.update({
              id: edge.id,
              hidden: !shouldShow
            });

            if (shouldShow) {
              visibleEdgeCount += 1;
            }
          });

          return {
            visibleNodeCount: visibleNodeIds.size,
            visibleEdgeCount
          };
        }

        function renderNodeDetails(selectedNodeId) {
          const node = nodeMap.get(selectedNodeId);
          detailsList.innerHTML = '';

          if (!node) {
            detailsList.innerHTML = '<li>No details available for selected node.</li>';
            return;
          }

          const meshdiagRaw = meshdiagNodeById.get(selectedNodeId) || {};
          const networkDiagRaw = networkDiagNodeById.get(selectedNodeId) || {};
          const restApiRaw = restApiNodeById.get(selectedNodeId) || {};

          const mergedSourceDetails = mergeForDisplay(mergeForDisplay(meshdiagRaw, networkDiagRaw), restApiRaw);
          const graphDetails = {
            graph: {
              unified_id: node.id,
              graph_link_count: nodeDegree.get(node.id) || 0,
              from_meshdiag: node.from_meshdiag === true,
              from_networkdiagnostic: node.from_networkdiagnostic === true,
              from_rest_api: restApiNodeById.has(selectedNodeId),
              has_children_in_graph: routerIdsWithChildren.has(node.id)
            }
          };

          const mergedDetails = mergeForDisplay(mergedSourceDetails, graphDetails);
          const details = sortDetailsWithPriority(
            flattenObjectEntries(mergedDetails)
              .filter(([key]) => !shouldExcludeDetailPath(key))
          );

          if (details.length === 0) {
            detailsList.innerHTML = '<li>No details available for selected node.</li>';
            return;
          }

          details.forEach(([key, value]) => {
            const item = document.createElement('li');
            item.textContent = `${key}: ${formatValue(value)}`;
            detailsList.appendChild(item);
          });
        }

        network.on('click', (params) => {
          if (params.nodes.length === 0) {
            detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            return;
          }

          renderNodeDetails(params.nodes[0]);
        });

        const loadedSources = [];
        if (meshdiag.length > 0) {
          loadedSources.push('meshdiag');
        }
        if (networkDiag.length > 0) {
          loadedSources.push('networkdiagnostic');
        }
        if (routerNeighborTables.length > 0) {
          loadedSources.push('routerneighbortables');
        }
        if (restApiDiagnostics.length > 0) {
          loadedSources.push('restapi');
        }

        function updateStatusLine(visibleNodeCount, visibleEdgeCount) {
          const nodeFilterLabel = nodeFilter.options[nodeFilter.selectedIndex].text;
          const linkFilterLabel = linkFilter.options[linkFilter.selectedIndex].text;
          const diagnosticFilterLabel = diagnosticFilter.options[diagnosticFilter.selectedIndex].text;
          status.textContent = `Loaded ${loadedSources.join(', ')}. Total: ${nodeData.length} nodes, ${edgeData.length} links. Showing: ${visibleNodeCount} nodes, ${visibleEdgeCount} links. Node Filter: ${nodeFilterLabel}. Link Filter: ${linkFilterLabel}. Diagnostic Filter: ${diagnosticFilterLabel}.`;
        }

        nodeFilter.onchange = (event) => {
          const filtered = applyFilters(event.target.value, linkFilter.value, diagnosticFilter.value);
          updateStatusLine(filtered.visibleNodeCount, filtered.visibleEdgeCount);
          detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
        };

        linkFilter.onchange = (event) => {
          const filtered = applyFilters(nodeFilter.value, event.target.value, diagnosticFilter.value);
          updateStatusLine(filtered.visibleNodeCount, filtered.visibleEdgeCount);
          detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
        };

        diagnosticFilter.onchange = (event) => {
          const filtered = applyFilters(nodeFilter.value, linkFilter.value, event.target.value);
          updateStatusLine(filtered.visibleNodeCount, filtered.visibleEdgeCount);
          detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
        };

        const initiallyVisible = applyFilters(nodeFilter.value, linkFilter.value, diagnosticFilter.value);
        updateStatusLine(initiallyVisible.visibleNodeCount, initiallyVisible.visibleEdgeCount);
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        }
      }

      async function loadEveDataset() {
          try {
            const eveData = await fetchJson('./thread-eve-topology.json');
            const eveArray = Array.isArray(eveData)
              ? eveData
              : (eveData && typeof eveData === 'object' ? Object.values(eveData) : []);
            if (eveArray.length === 0) {
              throw new Error('Eve topology JSON is empty.');
            }

            const nodeMap = new Map();
            const eveNodeById = new Map();
            const edgeMap = new Map();
            const edgeData = [];
            const routerIdsWithChildren = new Set();

            function upsertEveNode(nodeId, rawNode, style) {
              const existing = nodeMap.get(nodeId);
              const merged = {
                id: nodeId,
                name: toText(rawNode.name) || (existing ? existing.name : ''),
                device_label: toText(rawNode.device_label) || (existing ? existing.device_label : ''),
                rloc16: toText(rawNode.rloc16) || (existing ? existing.rloc16 : ''),
                source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
                extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
                type: toText(rawNode.type) || (existing ? existing.type : ''),
                thread_stack_version: toText(rawNode.thread_stack_version) || (existing ? existing.thread_stack_version : ''),
                total_children: Number.isFinite(rawNode.total_children) ? rawNode.total_children : (existing ? existing.total_children : 0),
                total_links: Number.isFinite(rawNode.total_links) ? rawNode.total_links : (existing ? existing.total_links : 0),
                iftotalpktserrorsdiscards_pct: Number.isFinite(rawNode.mac_counters?.iftotalpktserrorsdiscards_pct) ? rawNode.mac_counters.iftotalpktserrorsdiscards_pct : (existing?.iftotalpktserrorsdiscards_pct),
                iftotalerrors_pct: Number.isFinite(rawNode.mac_counters?.iftotalerrors_pct) ? rawNode.mac_counters.iftotalerrors_pct : (existing?.iftotalerrors_pct),
                mode_device: toText(rawNode.mode?.device) || (rawNode.type === 'router' ? 'FTD' : (rawNode.type === 'child' || rawNode.type === 'sleepy-child' ? 'MTD' : '')) || (existing ? existing.mode_device : ''),
                partitionidchanges: Number.isFinite(rawNode.mle_counters?.partitionidchanges) ? rawNode.mle_counters.partitionidchanges : (existing?.partitionidchanges),
                parentchanges: Number.isFinite(rawNode.mle_counters?.parentchanges) ? rawNode.mle_counters.parentchanges : (existing?.parentchanges),
                br: rawNode.br === true || (existing ? existing.br === true : false),
                from_eve: true,
                shape: style.shape || (existing ? existing.shape : 'box'),
                color: style.color || (existing ? existing.color : { background: '#e8f5e9', border: '#2e7d32' })
              };
              if (merged.br) {
                merged.color = { background: '#ffd9d9', border: '#c62828' };
              }
              nodeMap.set(nodeId, merged);
            }

            eveArray.forEach((node) => {
              const eveNodeId = toText(node.id);
              if (!eveNodeId) return;
              eveNodeById.set(eveNodeId, node);
              const isChildType = node.type === 'child' || node.type === 'sleepy-child';
              upsertEveNode(eveNodeId, node, {
                source: 'eve',
                shape: isChildType ? 'ellipse' : 'box',
                color: node.br ? { background: '#ffd9d9', border: '#c62828' } : (isChildType ? { background: '#fff4cc', border: '#d9a400' } : { background: '#e8f5e9', border: '#2e7d32' })
              });
            });

            for (const node of eveArray) {
              const fromId = toText(node.id);
              if (!fromId) continue;
              const routes = Array.isArray(node.routes) ? node.routes : [];
              routes.forEach((route) => {
                const toId = toText(route.to);
                if (!toId) return;
                if (!nodeMap.has(toId)) {
                  upsertEveNode(toId, { id: toId }, { source: 'eve', shape: 'box', color: { background: '#e8f5e9', border: '#2e7d32' } });
                }
                const lqiIn = toFiniteNumber(route.in);
                const lqiOut = toFiniteNumber(route.out);
                const avgLqi = (Number.isFinite(lqiIn) && Number.isFinite(lqiOut)) ? (lqiIn + lqiOut) / 2 : (lqiIn || lqiOut);
                let edgeWidth = 1.5;
                if (Number.isFinite(avgLqi)) {
                  if (avgLqi >= 200) edgeWidth = 3;
                  else if (avgLqi >= 150) edgeWidth = 2;
                }
                addEdge(edgeMap, edgeData, fromId, toId, {
                  width: edgeWidth,
                  linkCategories: [EDGE_CATEGORY_EVE_ROUTE]
                });
              });
              const children = Array.isArray(node.children) ? node.children : [];
              children.forEach((child) => {
                const childNodeId = toText(typeof child === 'string' ? child : child.id);
                if (!childNodeId) return;
                if (!nodeMap.has(childNodeId)) {
                  upsertEveNode(childNodeId, { id: childNodeId }, { source: 'eve', shape: 'ellipse', color: { background: '#fff4cc', border: '#d9a400' } });
                }
                addEdge(edgeMap, edgeData, fromId, childNodeId, {
                  dashes: true,
                  isParentChild: true,
                  linkCategories: [EDGE_CATEGORY_EVE_CHILD]
                });
                routerIdsWithChildren.add(fromId);
              });
            }

            const nodeDegree = new Map();
            for (const edge of edgeData) {
              nodeDegree.set(edge.from, (nodeDegree.get(edge.from) || 0) + 1);
              nodeDegree.set(edge.to, (nodeDegree.get(edge.to) || 0) + 1);
            }

            const nodeData = Array.from(nodeMap.values()).map((node) => {
              const unknown = toText(node.name || node.device_label).toLowerCase().startsWith('unknown');
              const rloc16Text = toText(node.rloc16).toLowerCase();
              const isRouter = node.shape !== 'ellipse';
              const hasChildren = routerIdsWithChildren.has(node.id);
              const isMainRouter = rloc16Text.endsWith('00');
              const isBorderRouter = isMainRouter && node.br === true;
              let borderWidth = 1;
              let fontSize = 13;
              if (isBorderRouter) {
                borderWidth = 5;
                fontSize = 19.5;
              } else if (isRouter) {
                borderWidth = 3;
                fontSize = 19.5;
              }
              return {
                id: node.id,
                label: buildLabel(node, node.id),
                shape: node.shape,
                color: node.color,
                font: { size: fontSize, face: 'monospace', multi: 'md' },
                group: unknown ? 'unknown' : 'known',
                isRouter,
                hasChildren,
                isMainRouter,
                isBorderRouter,
                borderWidth,
                iftotalpktserrorsdiscards_pct: node.iftotalpktserrorsdiscards_pct,
                iftotalerrors_pct: node.iftotalerrors_pct,
                mode_device: node.mode_device,
                partitionidchanges: node.partitionidchanges,
                parentchanges: node.parentchanges
              };
            });

            const unknownNodeIds = nodeData
              .filter((node) => node.group === 'unknown' && (nodeDegree.get(node.id) || 0) === 0)
              .map((node) => node.id);

            if (unknownNodeIds.length > 1) {
              const anchorId = unknownNodeIds[0];
              for (let i = 1; i < unknownNodeIds.length; i += 1) {
                addEdge(edgeMap, edgeData, anchorId, unknownNodeIds[i], {
                  hidden: true,
                  physics: true,
                  length: 60,
                  color: { opacity: 0 }
                });
              }
            }

            if (unknownNodeIds.length > 0) {
              const knownAnchorCandidates = nodeData.filter((node) => {
                return node.group !== 'unknown' && (nodeDegree.get(node.id) || 0) > 0;
              });
              if (knownAnchorCandidates.length > 0) {
                knownAnchorCandidates.sort((a, b) => {
                  return (nodeDegree.get(b.id) || 0) - (nodeDegree.get(a.id) || 0);
                });
                addEdge(edgeMap, edgeData, unknownNodeIds[0], knownAnchorCandidates[0].id, {
                  hidden: true,
                  physics: true,
                  length: 180,
                  color: { opacity: 0 }
                });
              }
            }

            const nodesDataset = new vis.DataSet(nodeData);
            const edgesDataset = new vis.DataSet(edgeData);
            const data = { nodes: nodesDataset, edges: edgesDataset };
            const options = {
              layout: { improvedLayout: true, randomSeed: 7 },
              nodes: { font: { size: 13, face: 'monospace', multi: 'md' }, margin: 10, widthConstraint: { maximum: 260 } },
              groups: { unknown: { color: { background: '#f2f2f2', border: '#808080' } } },
              edges: { color: '#8a8a8a', width: 1.5, smooth: false },
              physics: {
                barnesHut: { gravitationalConstant: -9500, centralGravity: 0.15, springLength: 300, springConstant: 0.01, damping: 0.22, avoidOverlap: 1 },
                stabilization: { enabled: true, iterations: 1500, updateInterval: 25 }
              },
              interaction: { hover: true, navigationButtons: true }
            };
            const network = new vis.Network(container, data, options);
            network.on('click', (params) => {
              if (params.nodes.length === 0) {
                detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
                return;
              }
              const selectedNodeId = params.nodes[0];
              const node = nodeMap.get(selectedNodeId);
              detailsList.innerHTML = '';
              if (!node) {
                detailsList.innerHTML = '<li>No details available for selected node.</li>';
                return;
              }
              const eveRaw = eveNodeById.get(selectedNodeId) || {};
              const graphDetails = {
                graph: {
                  unified_id: node.id,
                  graph_link_count: nodeDegree.get(node.id) || 0,
                  from_eve: node.from_eve === true
                }
              };
              const mergedDetails = mergeForDisplay(eveRaw, graphDetails);
              const details = sortDetailsWithPriority(
                flattenObjectEntries(mergedDetails)
                  .filter(([key]) => !shouldExcludeDetailPath(key))
              );
              if (details.length === 0) {
                detailsList.innerHTML = '<li>No details available for selected node.</li>';
                return;
              }
              details.forEach(([key, value]) => {
                const item = document.createElement('li');
                item.textContent = `${key}: ${formatValue(value)}`;
                detailsList.appendChild(item);
              });
            });

            function applyFiltersEve(nodeFilterMode, linkFilterMode, diagnosticFilterMode) {
              const visibleNodeIds = new Set();
              let visibleEdgeCount = 0;
              nodesDataset.forEach((node) => {
                const visible = isNodeVisibleByFilter(node, nodeFilterMode)
                  && isNodeVisibleByDiagnosticFilter(node, diagnosticFilterMode);
                if (visible) {
                  visibleNodeIds.add(node.id);
                }
              });
              if (nodeFilterMode === 'routers-with-children') {
                edgesDataset.forEach((edge) => {
                  if (edge.isParentChild === true
                    && edgeMatchesLinkFilter(edge, linkFilterMode)
                    && visibleNodeIds.has(edge.from)) {
                    visibleNodeIds.add(edge.to);
                  }
                });
              }
              nodesDataset.forEach((node) => {
                nodesDataset.update({ id: node.id, hidden: !visibleNodeIds.has(node.id) });
              });
              edgesDataset.forEach((edge) => {
                const endpointsVisible = visibleNodeIds.has(edge.from) && visibleNodeIds.has(edge.to);
                const shouldShow = edge.baseHidden !== true
                  && endpointsVisible
                  && edgeMatchesLinkFilter(edge, linkFilterMode);
                edgesDataset.update({ id: edge.id, hidden: !shouldShow });
                if (shouldShow) { visibleEdgeCount += 1; }
              });
              return { visibleNodeCount: visibleNodeIds.size, visibleEdgeCount };
            }

            function updateStatusLineEve(visibleNodeCount, visibleEdgeCount) {
              const nodeFilterLabel = nodeFilter.options[nodeFilter.selectedIndex].text;
              const linkFilterLabel = linkFilter.options[linkFilter.selectedIndex].text;
              const diagnosticFilterLabel = diagnosticFilter.options[diagnosticFilter.selectedIndex].text;
              status.textContent = `Loaded Eve Topology. Total: ${nodeData.length} nodes, ${edgeData.length} links. Showing: ${visibleNodeCount} nodes, ${visibleEdgeCount} links. Node Filter: ${nodeFilterLabel}. Link Filter: ${linkFilterLabel}. Diagnostic Filter: ${diagnosticFilterLabel}.`;
            }

            nodeFilter.onchange = (event) => {
              const filtered = applyFiltersEve(event.target.value, linkFilter.value, diagnosticFilter.value);
              updateStatusLineEve(filtered.visibleNodeCount, filtered.visibleEdgeCount);
              detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            };
            linkFilter.onchange = (event) => {
              const filtered = applyFiltersEve(nodeFilter.value, event.target.value, diagnosticFilter.value);
              updateStatusLineEve(filtered.visibleNodeCount, filtered.visibleEdgeCount);
              detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            };
            diagnosticFilter.onchange = (event) => {
              const filtered = applyFiltersEve(nodeFilter.value, linkFilter.value, event.target.value);
              updateStatusLineEve(filtered.visibleNodeCount, filtered.visibleEdgeCount);
              detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            };

            const initiallyVisible = applyFiltersEve(nodeFilter.value, linkFilter.value, diagnosticFilter.value);
            updateStatusLineEve(initiallyVisible.visibleNodeCount, initiallyVisible.visibleEdgeCount);
          } catch (error) {
            status.textContent = `Error: ${error.message}`;
          }
        }

      async function loadMergedDetailedDataset() {
          try {
            const mergedData = await fetchJson('./threadcache-merged-detailed-topology.json');
            const rows = Array.isArray(mergedData) ? mergedData : [];
            if (rows.length === 0) {
              throw new Error('Merged detailed topology JSON is empty.');
            }

            const nodeMap = new Map();
            const rawNodeById = new Map();
            const edgeMap = new Map();
            const edgeData = [];
            const routerIdsWithChildren = new Set();

            function isMergedRowEveOnly(node) {
              const sources = Array.isArray(node?._sources) ? node._sources : [];
              if (!sources.includes('thread-eve-topology.json')) {
                return false;
              }

              const hasOtbrSource = sources.some((source) => (
                source === 'thread-router-table.json'
                || source === 'thread-meshdiag-topology.json'
                || source === 'thread-networkdiagnostic-topology.json'
                || source === 'thread-meshdiag-routerneighbortables.json'
                || source === 'thread-restapi-devices.json'
                || source === 'thread-restapi-diagnostics.json'
              ));

              return !hasOtbrSource;
            }

            function chooseMergedNodeId(node, index) {
              const rloc16 = toText(node.rloc16);
              if (rloc16) return rloc16;
              const idField = toText(node.id);
              if (idField) return idField;
              const extaddr = toText(node.extaddr);
              if (extaddr) return extaddr;
              return `merged-node-${index + 1}`;
            }

            function upsertMergedNode(nodeId, rawNode, style) {
              const existing = nodeMap.get(nodeId);
              const merged = {
                id: nodeId,
                name: toText(rawNode.name) || (existing ? existing.name : ''),
                device_label: toText(rawNode.device_label) || (existing ? existing.device_label : ''),
                rloc16: toText(rawNode.rloc16) || (existing ? existing.rloc16 : ''),
                source_id: toText(rawNode.id) || (existing ? existing.source_id : ''),
                extaddr: toText(rawNode.extaddr) || (existing ? existing.extaddr : ''),
                type: toText(rawNode.type) || (existing ? existing.type : ''),
                thread_stack_version: toText(rawNode.thread_stack_version) || (existing ? existing.thread_stack_version : ''),
                total_children: Number.isFinite(rawNode.total_children) ? rawNode.total_children : (existing ? existing.total_children : 0),
                total_links: Number.isFinite(rawNode.total_links) ? rawNode.total_links : (existing ? existing.total_links : 0),
                iftotalpktserrorsdiscards_pct: Number.isFinite(rawNode.mac_counters?.iftotalpktserrorsdiscards_pct) ? rawNode.mac_counters.iftotalpktserrorsdiscards_pct : (existing?.iftotalpktserrorsdiscards_pct),
                iftotalerrors_pct: Number.isFinite(rawNode.mac_counters?.iftotalerrors_pct) ? rawNode.mac_counters.iftotalerrors_pct : (existing?.iftotalerrors_pct),
                mode_device: toText(rawNode['mode.device']) || toText(rawNode.mode?.device) || (existing ? existing.mode_device : ''),
                partitionidchanges: Number.isFinite(rawNode.mle_counters?.partitionidchanges) ? rawNode.mle_counters.partitionidchanges : (existing?.partitionidchanges),
                parentchanges: Number.isFinite(rawNode.mle_counters?.parentchanges) ? rawNode.mle_counters.parentchanges : (existing?.parentchanges),
                br: rawNode.br === true || (existing ? existing.br === true : false),
                from_merged_detailed: true,
                shape: style.shape || (existing ? existing.shape : 'box'),
                color: style.color || (existing ? existing.color : { background: '#e8f5e9', border: '#2e7d32' })
              };

              if (merged.br) {
                merged.color = { background: '#ffd9d9', border: '#c62828' };
              }

              nodeMap.set(nodeId, merged);
            }

            rows.forEach((node, index) => {
              if (isMergedRowEveOnly(node)) {
                return;
              }

              const nodeId = chooseMergedNodeId(node, index);
              rawNodeById.set(nodeId, node);

              const rloc16Text = toText(node.rloc16).toLowerCase();
              const modeDevice = toText(node['mode.device'] || node.mode?.device).toUpperCase();
              const isRouterLike = rloc16Text.endsWith('00') || modeDevice === 'FTD' || toText(node.type).toLowerCase() === 'router';
              const isChildLike = modeDevice === 'MTD' || toText(node.type).toLowerCase().includes('child');

              upsertMergedNode(nodeId, node, {
                source: 'merged-detailed',
                shape: isChildLike && !isRouterLike ? 'ellipse' : 'box',
                color: isChildLike && !isRouterLike
                  ? { background: '#fff4cc', border: '#d9a400' }
                  : { background: '#e8f5e9', border: '#2e7d32' }
              });
            });

            function ensureNodeForLink(linkNode, fallbackId) {
              const candidateId = toText(linkNode.rloc16) || toText(linkNode.id) || toText(fallbackId);
              if (!candidateId) return '';
              if (!nodeMap.has(candidateId)) {
                upsertMergedNode(candidateId, {
                  rloc16: toText(linkNode.rloc16),
                  id: toText(linkNode.id) || candidateId,
                  device_label: toText(linkNode.device_label),
                  name: toText(linkNode.name)
                }, {
                  source: 'merged-detailed',
                  shape: 'box',
                  color: { background: '#e8f5e9', border: '#2e7d32' }
                });
              }
              return candidateId;
            }

            rows.forEach((node, index) => {
              if (isMergedRowEveOnly(node)) {
                return;
              }

              const fromId = chooseMergedNodeId(node, index);

              const linkFields = [
                { key: '3_links', width: 4 },
                { key: '2_links', width: 2 },
                { key: '1_links', width: 1 }
              ];

              linkFields.forEach((field) => {
                const links = Array.isArray(node[field.key]) ? node[field.key] : [];
                links.forEach((link) => {
                  const toId = ensureNodeForLink(link, link.rloc16 || link.id);
                  if (!toId) return;
                  addEdge(edgeMap, edgeData, fromId, toId, {
                    width: field.width,
                    linkCategories: [
                      field.key === '3_links' ? EDGE_CATEGORY_DEFAULT_3 :
                      field.key === '2_links' ? EDGE_CATEGORY_DEFAULT_2 :
                      EDGE_CATEGORY_DEFAULT_1
                    ],
                    edgeKeySuffix: `merged-${field.key}`
                  });
                });
              });

              const routerNeighborLinks = Array.isArray(node.router_neighbor_table) ? node.router_neighbor_table : [];
              routerNeighborLinks.forEach((neighbor) => {
                const toId = ensureNodeForLink(neighbor, neighbor.rloc16 || neighbor.extaddr || neighbor.id);
                if (!toId) return;
                addEdge(edgeMap, edgeData, fromId, toId, {
                  width: 1.5,
                  linkCategories: [EDGE_CATEGORY_ROUTER_NEIGHBOR],
                  edgeKeySuffix: 'merged-router-neighbor'
                });
              });

              const otbrRoutes = Array.isArray(node.route?.routeData) ? node.route.routeData : [];
              otbrRoutes.forEach((route) => {
                const toRloc16 = buildMainRouterRloc16(route.routeId);
                const toId = ensureNodeForLink({
                  rloc16: toRloc16,
                  id: toRloc16,
                  device_label: toRloc16
                }, toRloc16);
                if (!toId) return;
                addEdge(edgeMap, edgeData, fromId, toId, {
                  width: 1.5,
                  linkCategories: [EDGE_CATEGORY_OTBR_ROUTE],
                  edgeKeySuffix: 'merged-otbr-route'
                });
              });

              const otbrChildren = Array.isArray(node.childTable) ? node.childTable : [];
              otbrChildren.forEach((child, childIndex) => {
                const childRloc16 = buildChildRloc16(node.rloc16, child.childId);
                const childId = ensureNodeForLink({
                  rloc16: childRloc16,
                  id: childRloc16 || `${fromId}-rest-child-${childIndex + 1}`,
                  device_label: childRloc16 || `${fromId} child ${child.childId}`
                }, childRloc16 || `${fromId}-rest-child-${childIndex + 1}`);
                if (!childId) return;
                addEdge(edgeMap, edgeData, fromId, childId, {
                  dashes: true,
                  isParentChild: true,
                  linkCategories: [EDGE_CATEGORY_OTBR_CHILD],
                  edgeKeySuffix: 'merged-otbr-child'
                });
                routerIdsWithChildren.add(fromId);
              });

              const children = Array.isArray(node.children) ? node.children : [];
              children.forEach((child, childIndex) => {
                const childNode = typeof child === 'string' ? { id: child } : (child || {});
                const isEveChild = typeof child === 'string' || Boolean(toText(childNode.id));
                if (isEveChild) {
                  return;
                }
                const childId = ensureNodeForLink(childNode, `${fromId}-child-${childIndex + 1}`);
                if (!childId) return;
                addEdge(edgeMap, edgeData, fromId, childId, {
                  dashes: true,
                  isParentChild: true,
                  linkCategories: [EDGE_CATEGORY_DEFAULT_CHILDREN],
                  edgeKeySuffix: 'merged-default-child'
                });
                routerIdsWithChildren.add(fromId);
              });
            });

            const nodeDegree = new Map();
            for (const edge of edgeData) {
              nodeDegree.set(edge.from, (nodeDegree.get(edge.from) || 0) + 1);
              nodeDegree.set(edge.to, (nodeDegree.get(edge.to) || 0) + 1);
            }

            const nodeData = Array.from(nodeMap.values()).map((node) => {
              const displayName = toText(node.name) || toText(node.device_label);
              const unknown = displayName.toLowerCase().startsWith('unknown');
              const rloc16Text = toText(node.rloc16).toLowerCase();
              const isRouter = node.shape !== 'ellipse';
              const hasChildren = routerIdsWithChildren.has(node.id);
              const isMainRouter = rloc16Text.endsWith('00');
              const isBorderRouter = isMainRouter && node.br === true;
              let borderWidth = 1;
              let fontSize = 13;
              if (isBorderRouter) {
                borderWidth = 5;
                fontSize = 19.5;
              } else if (isRouter) {
                borderWidth = 3;
                fontSize = 19.5;
              }

              return {
                id: node.id,
                label: buildEveLabel(node, node.id),
                shape: node.shape,
                color: node.color,
                font: { size: fontSize, face: 'monospace', multi: 'md' },
                group: unknown ? 'unknown' : 'known',
                isRouter,
                hasChildren,
                isMainRouter,
                isBorderRouter,
                borderWidth,
                iftotalpktserrorsdiscards_pct: node.iftotalpktserrorsdiscards_pct,
                iftotalerrors_pct: node.iftotalerrors_pct,
                mode_device: node.mode_device,
                partitionidchanges: node.partitionidchanges,
                parentchanges: node.parentchanges
              };
            });

            const nodesDataset = new vis.DataSet(nodeData);
            const edgesDataset = new vis.DataSet(edgeData);
            const data = { nodes: nodesDataset, edges: edgesDataset };
            const options = {
              layout: { improvedLayout: true, randomSeed: 7 },
              nodes: { font: { size: 13, face: 'monospace', multi: 'md' }, margin: 10, widthConstraint: { maximum: 260 } },
              groups: { unknown: { color: { background: '#f2f2f2', border: '#808080' } } },
              edges: { color: '#8a8a8a', width: 1.5, smooth: false },
              physics: {
                barnesHut: { gravitationalConstant: -9500, centralGravity: 0.15, springLength: 300, springConstant: 0.01, damping: 0.22, avoidOverlap: 1 },
                stabilization: { enabled: true, iterations: 1500, updateInterval: 25 }
              },
              interaction: { hover: true, navigationButtons: true }
            };
            const network = new vis.Network(container, data, options);

            network.on('click', (params) => {
              if (params.nodes.length === 0) {
                detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
                return;
              }

              const selectedNodeId = params.nodes[0];
              const raw = rawNodeById.get(selectedNodeId) || {};
              const graphDetails = {
                graph: {
                  unified_id: selectedNodeId,
                  graph_link_count: nodeDegree.get(selectedNodeId) || 0,
                  from_merged_detailed: true
                }
              };

              detailsList.innerHTML = '';
              const mergedDetails = mergeForDisplay(raw, graphDetails);
              const details = sortDetailsWithPriority(
                flattenObjectEntries(mergedDetails)
                  .filter(([key]) => !shouldExcludeDetailPath(key))
              );

              if (details.length === 0) {
                detailsList.innerHTML = '<li>No details available for selected node.</li>';
                return;
              }

              details.forEach(([key, value]) => {
                const item = document.createElement('li');
                item.textContent = `${key}: ${formatValue(value)}`;
                detailsList.appendChild(item);
              });
            });

            function applyFiltersMerged(nodeFilterMode, linkFilterMode, diagnosticFilterMode) {
              const visibleNodeIds = new Set();
              let visibleEdgeCount = 0;

              nodesDataset.forEach((node) => {
                const visible = isNodeVisibleByFilter(node, nodeFilterMode)
                  && isNodeVisibleByDiagnosticFilter(node, diagnosticFilterMode);
                if (visible) {
                  visibleNodeIds.add(node.id);
                }
              });

              if (nodeFilterMode === 'routers-with-children') {
                edgesDataset.forEach((edge) => {
                  if (edge.isParentChild === true
                    && edgeMatchesLinkFilter(edge, linkFilterMode)
                    && visibleNodeIds.has(edge.from)) {
                    visibleNodeIds.add(edge.to);
                  }
                });
              }

              nodesDataset.forEach((node) => {
                nodesDataset.update({ id: node.id, hidden: !visibleNodeIds.has(node.id) });
              });

              edgesDataset.forEach((edge) => {
                const endpointsVisible = visibleNodeIds.has(edge.from) && visibleNodeIds.has(edge.to);
                const shouldShow = edge.baseHidden !== true
                  && endpointsVisible
                  && edgeMatchesLinkFilter(edge, linkFilterMode);
                edgesDataset.update({ id: edge.id, hidden: !shouldShow });
                if (shouldShow) {
                  visibleEdgeCount += 1;
                }
              });

              return { visibleNodeCount: visibleNodeIds.size, visibleEdgeCount };
            }

            function updateStatusLineMerged(visibleNodeCount, visibleEdgeCount) {
              const nodeFilterLabel = nodeFilter.options[nodeFilter.selectedIndex].text;
              const linkFilterLabel = linkFilter.options[linkFilter.selectedIndex].text;
              const diagnosticFilterLabel = diagnosticFilter.options[diagnosticFilter.selectedIndex].text;
              status.textContent = `Loaded Merged Detailed Topology. Total: ${nodeData.length} nodes, ${edgeData.length} links. Showing: ${visibleNodeCount} nodes, ${visibleEdgeCount} links. Node Filter: ${nodeFilterLabel}. Link Filter: ${linkFilterLabel}. Diagnostic Filter: ${diagnosticFilterLabel}.`;
            }

            nodeFilter.onchange = (event) => {
              const filtered = applyFiltersMerged(event.target.value, linkFilter.value, diagnosticFilter.value);
              updateStatusLineMerged(filtered.visibleNodeCount, filtered.visibleEdgeCount);
              detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            };

            linkFilter.onchange = (event) => {
              const filtered = applyFiltersMerged(nodeFilter.value, event.target.value, diagnosticFilter.value);
              updateStatusLineMerged(filtered.visibleNodeCount, filtered.visibleEdgeCount);
              detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            };

            diagnosticFilter.onchange = (event) => {
              const filtered = applyFiltersMerged(nodeFilter.value, linkFilter.value, event.target.value);
              updateStatusLineMerged(filtered.visibleNodeCount, filtered.visibleEdgeCount);
              detailsList.innerHTML = '<li>Click a node to view its properties.</li>';
            };

            const initiallyVisible = applyFiltersMerged(nodeFilter.value, linkFilter.value, diagnosticFilter.value);
            updateStatusLineMerged(initiallyVisible.visibleNodeCount, initiallyVisible.visibleEdgeCount);
          } catch (error) {
            status.textContent = `Error: ${error.message}`;
          }
        }

      datasetSelect.addEventListener('change', (event) => {
        nodeFilter.value = 'all';
        if (event.target.value === 'eve_topology') {
          linkFilter.value = LINK_FILTER_EVE;
        } else if (event.target.value === 'merged_detailed_topology') {
          linkFilter.value = LINK_FILTER_ALL;
        } else {
          linkFilter.value = LINK_FILTER_DEFAULT;
        }
        diagnosticFilter.value = 'all';
        container.innerHTML = '';
        detailsList.innerHTML = '';
        if (event.target.value === 'eve_topology') {
          status.textContent = 'Loading Eve Topology...';
          loadEveDataset();
        } else if (event.target.value === 'merged_detailed_topology') {
          status.textContent = 'Loading Merged Detailed Topology...';
          loadMergedDetailedDataset();
        } else {
          status.textContent = 'Loading: meshdiag, networkdiag...';
          loadMeshdiagNetworkdiag();
        }
      });

      status.textContent = 'Loading: meshdiag, networkdiag...';
      loadMeshdiagNetworkdiag();
    }

    loadAndRenderTopology();
    </script>
  </body>
</html>
